html.qlock #cardSlot .card{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;width:100%}
html.qlock .kicker,html.qlock .qpill{flex:0 0 auto}
html.qlock .anspill{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;justify-content:flex-end}
html.qlock #footSlot{flex:0 0 auto;margin-top:8px}
.ovl{display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,12,20,.55);backdrop-filter:blur(2px);flex-direction:column}
.ovlbar{display:flex;align-items:center;gap:12px;background:#3b6e58;color:#fff;padding:10px 16px;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.ovlbar .sp{margin-left:auto}
.ovlx{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font:600 13px sans-serif}
.ovl iframe{flex:1;width:100%;border:0;background:#f7f6f2;overflow:auto;-webkit-overflow-scrolling:touch}
.cwmodal{display:none;position:fixed;inset:0;z-index:10001;background:rgba(15,12,20,.55);backdrop-filter:blur(2px);align-items:center;justify-content:center;padding:24px}
.cwmodal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:340px;width:100%;padding:22px;text-align:center;color:var(--ink)}
.cwmodal .box h4{margin:0 0 8px;font-size:18px}
.cwmodal .box p{margin:0 0 18px;opacity:.75;font-size:14px;line-height:1.4}
.cwmodal .row{display:flex;gap:10px}
.cwmodal .row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}
.cwmodal .row .ok{background:#3b6e58;color:#fff;border-color:#3b6e58}
.cwmodal .row .cancel{background:transparent;color:var(--ink)}
</style>
<div class="ovl" id="nswOv"><div class="ovlbar"><span>📖 Nachschlagewerk</span><span class="sp"></span><button class="ovlx" data-c="nswOv">✕ Schließen</button></div><iframe id="nswIf" loading="lazy" scrolling="yes"></iframe></div>

<div class="cwmodal" id="cwQuit"><div class="box"><h4>Quiz beenden?</h4><p>Dein aktueller Fortschritt in dieser Runde geht verloren.</p><div class="row"><button class="cancel" id="cwQuitNo">Abbrechen</button><button class="ok" id="cwQuitYes">Beenden</button></div></div></div>
<script>
(function(){
 var NURL="https://mvonulmerbach-ship-it.github.io/philo-nachschlagewerk/"; var HASA=false;
 function theme(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
 function openOv(id,fid,url){var o=document.getElementById(id),f=document.getElementById(fid);f.setAttribute('src',url+'?theme='+theme());o.style.display='flex';document.body.style.overflow='hidden';}
 function closeOv(o){o.style.display='none';document.body.style.overflow='';}
 document.querySelectorAll('.ovlx').forEach(function(b){b.addEventListener('click',function(){closeOv(document.getElementById(b.dataset.c));});});
 document.querySelectorAll('.ovl').forEach(function(o){o.addEventListener('click',function(e){if(e.target===o)closeOv(o);});});
 function mkTool(side,emoji,title,fn){var b=document.createElement('button');b.className='toolfb '+side;b.type='button';b.innerHTML=emoji;b.title=title;b.setAttribute('aria-label',title);b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();fn();});return b;}
 function ensureFootTools(){var fs=document.getElementById('footSlot');if(!fs)return;
   if(HASA&&!fs.querySelector('.toolfb.l')){fs.insertBefore(mkTool('l','🎡','Aromarad',function(){openOv('aromaOv','aromaIf','aromarad.html');}),fs.firstChild);}
   if(!HASA&&!fs.querySelector('.toolfb.l')){var sp=document.createElement('div');sp.className='toolfb l';sp.style.visibility='hidden';sp.style.pointerEvents='none';fs.insertBefore(sp,fs.firstChild);}
   if(!fs.querySelector('.toolfb.r')){fs.appendChild(mkTool('r','📖','Nachschlagewerk',function(){openOv('nswOv','nswIf',NURL);}));}
   fs.querySelectorAll('button:not(.toolfb)').forEach(function(b){var t=(b.textContent||'').trim();if(t.indexOf('Wusste ich nicht')>=0){b.innerHTML='❌';b.title='Wusste ich nicht';b.setAttribute('aria-label','Wusste ich nicht');b.classList.add('emojibtn');}else if(t.indexOf('Gewusst')>=0){b.innerHTML='✅';b.title='Gewusst';b.setAttribute('aria-label','Gewusst');b.classList.add('emojibtn');}});}
 function enhanceOrder(card){var wrap=card.querySelector('.order');if(!wrap||wrap._dnd)return;wrap._dnd=true;wrap.style.touchAction='none';var dragging=null;
   function moveTo(text,target){var s=40;while(s-->0){var rows=wrap.querySelectorAll('.oitem');var cur=-1;for(var i=0;i<rows.length;i++){if(rows[i].querySelector('.lbl').textContent===text){cur=i;break;}}if(cur<0||cur===target)break;var b=rows[cur].querySelectorAll('.arrows button');if(cur>target){if(b[0]&&!b[0].disabled)b[0].click();else break;}else{if(b[1]&&!b[1].disabled)b[1].click();else break;}}}
   wrap.addEventListener('pointerdown',function(e){var row=e.target.closest('.oitem');if(!row||e.target.closest('.arrows'))return;dragging=row;row.setAttribute('data-drag','1');try{wrap.setPointerCapture(e.pointerId);}catch(_){}});
   wrap.addEventListener('pointerup',function(e){if(!dragging)return;var text=dragging.querySelector('.lbl').textContent;var rows=Array.prototype.slice.call(wrap.querySelectorAll('.oitem'));var target=rows.length-1;for(var i=0;i<rows.length;i++){var r=rows[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2){target=i;break;}}dragging.removeAttribute('data-drag');dragging=null;moveTo(text,target);});
   wrap.addEventListener('pointercancel',function(){if(dragging){dragging.removeAttribute('data-drag');dragging=null;}});}
 function pillify(card){if(!card||card._pills)return;card._pills=true;
   var kind=card.querySelector('.kicker');
   var qpill=document.createElement('div');qpill.className='qpill';var anspill=document.createElement('div');anspill.className='anspill';
   Array.prototype.slice.call(card.children).forEach(function(ch){if(ch===kind)return;if(ch.classList&&ch.classList.contains('qtext'))qpill.appendChild(ch);else anspill.appendChild(ch);});
   if(kind)card.appendChild(kind);
   if(qpill.children.length)card.appendChild(qpill);
   if(anspill.children.length)card.appendChild(anspill);
   enhanceOrder(card);
   var cs=document.getElementById('cardSlot');if(cs)cs.scrollTop=0;var ap=card.querySelector('.anspill');if(ap)ap.scrollTop=0;try{window.scrollTo(0,0);}catch(_){}}
 function setLock(){var qv=document.getElementById('quizView');var on=qv&&!qv.classList.contains('hidden');document.documentElement.classList.toggle('qlock',!!on);}
 var slot=document.getElementById('cardSlot');
 if(slot){var mo=new MutationObserver(function(){pillify(slot.querySelector('.card'));});mo.observe(slot,{childList:true,subtree:true});pillify(slot.querySelector('.card'));}
 var fs=document.getElementById('footSlot');
 if(fs){var mf=new MutationObserver(ensureFootTools);mf.observe(fs,{childList:true});ensureFootTools();}
 var qv=document.getElementById('quizView');
 if(qv){var mq=new MutationObserver(setLock);mq.observe(qv,{attributes:true,attributeFilter:['class']});}
 setLock();
 /* ---- in-App Beenden-Dialog statt System-confirm ---- */
 var quitM=document.getElementById('cwQuit');
 function showQuit(){quitM.style.display='flex';}
 function hideQuit(){quitM.style.display='none';}
 document.getElementById('cwQuitNo').addEventListener('click',hideQuit);
 document.getElementById('cwQuitYes').addEventListener('click',function(){hideQuit();if(typeof renderHome==='function')renderHome();});
 quitM.addEventListener('click',function(e){if(e.target===quitM)hideQuit();});
 var qb=document.getElementById('quizBack'); if(qb){qb.onclick=function(){showQuit();};}
 /* ---- Android-Zurück-Button: eine Stufe zurück statt App verlassen ---- */
 function modalOpen(){return quitM.style.display==='flex';}
 function ovlOpen(){var a=false;document.querySelectorAll('.ovl').forEach(function(o){if(o.style.display==='flex')a=true;});return a;}
 function closeOvls(){document.querySelectorAll('.ovl').forEach(function(o){o.style.display='none';});document.body.style.overflow='';}
 function inQuiz(){var hv=document.getElementById('homeView');return hv&&hv.classList.contains('hidden');}
 function closeTop(){
   if(modalOpen()){hideQuit();return true;}
   if(ovlOpen()){closeOvls();return true;}            /* Nachschlagewerk/Aromarad zu -> zurück zur Frage */
   if(inQuiz()){if(typeof renderHome==='function')renderHome();return true;} /* Quiz/Ergebnis -> Start */
   return false;
 }
 try{history.pushState({cw:'guard'},'');}catch(_){}
 window.addEventListener('popstate',function(){
   if(closeTop()){ try{history.pushState({cw:'guard'},'');}catch(_){ } }
   else { try{history.back();}catch(_){ } }
 });
})();
</script>

</body>
</html>
