rinzip (arché) zu.", "pairs": [["Anaximander", "Das Apeiron (Unbegrenzte)"], ["Anaximenes", "Die Luft"], ["Pythagoras", "Die Zahl"], ["Heraklit", "Das Feuer"]], "fb": "Jeder Vorsokratiker bestimmte einen anderen <b>Urgrund</b> aller Dinge."}, {"track": "allg", "cat": "Antike", "d": 3, "ty": "order", "q": "Sortiere die Stufen des Aufstiegs im Höhlengleichnis (von der Täuschung zur Wahrheit).", "items": ["Schatten an der Höhlenwand", "Blick auf Feuer und Gegenstände in der Höhle", "Dinge in der Welt außerhalb der Höhle", "Die Sonne selbst"], "fb": "Der Aufstieg symbolisiert den Erkenntnisweg bis zur <b>Idee des Guten</b> (Sonne)."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "multi", "q": "Welche Aussagen über Aristoteles treffen zu? (mehrere)", "opts": ["Er war Erzieher Alexanders des Großen", "Er gilt als Begründer der formalen Logik", "Er verfasste die Nikomachische Ethik", "Er war der Lehrer des Sokrates", "Er verwarf jede Sinneserfahrung als wertlos"], "c": [0, 1, 2], "fb": "Aristoteles erzog <b>Alexander</b>, begründete die <b>Logik</b> und schrieb die <b>Nikomachische Ethik</b>; er lebte nach Sokrates und schätzte die Erfahrung."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "recall", "prompt": "Erkläre, warum Sokrates im Dialog „Kriton“ die Flucht aus dem Gefängnis ablehnt.", "hint": "Gesetze, Unrecht nicht mit Unrecht vergelten", "model": "Sokrates argumentiert, man dürfe Unrecht niemals mit Unrecht vergelten. Durch sein Leben in Athen hat er die Geltung der Gesetze stillschweigend anerkannt; eine Flucht würde diese Übereinkunft brechen und den Gesetzen schaden. Deshalb nimmt er das Urteil an."}, {"track": "allg", "cat": "Antike", "d": 3, "ty": "recall", "prompt": "Erläutere Aristoteles' Lehre von den vier Ursachen am Beispiel einer Bronzestatue.", "hint": "Stoff, Form, Wirkung, Zweck", "model": "Stoffursache: die Bronze, aus der die Statue besteht. Formursache: die Gestalt, die sie zur Statue macht. Wirkursache: der Bildhauer, der sie herstellt. Zweckursache: das Worumwillen, etwa die Ehrung eines Gottes. Erst alle vier zusammen erklären das Ding vollständig."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "mc", "q": "Wer schrieb im Kerker das Werk „Der Trost der Philosophie“?", "opts": ["Boethius", "Augustinus", "Abaelard", "Cassiodor"], "c": 0, "fb": "<b>Boethius</b> (ca. 480–524) verfasste die „Consolatio philosophiae“ vor seiner Hinrichtung; sie prägte das ganze Mittelalter."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "mc", "q": "Welcher islamische Philosoph aus Córdoba wurde im lateinischen Westen schlicht „der Kommentator“ (des Aristoteles) genannt?", "opts": ["Avicenna", "Averroes (Ibn Ruschd)", "Al-Farabi", "Al-Ghazali"], "c": 1, "fb": "<b>Averroes</b> kommentierte fast das gesamte Werk des Aristoteles und prägte so die Scholastik entscheidend."}, {"track": "allg", "cat": "Mittelalter", "d": 1, "ty": "mc", "q": "Wer war der Lehrer des Thomas von Aquin und trug den Beinamen „doctor universalis“?", "opts": ["Albertus Magnus", "Bonaventura", "Roger Bacon", "Petrus Lombardus"], "c": 0, "fb": "<b>Albertus Magnus</b> lehrte Thomas in Paris und Köln und erschloss dem Westen das aristotelische Wissen."}, {"track": "allg", "cat": "Mittelalter", "d": 3, "ty": "mc", "q": "Welche vermittelnde Position vertrat Abaelard im Universalienstreit?", "opts": ["Den extremen Realismus", "Den Konzeptualismus: Universalien sind Begriffe im Geist", "Den Materialismus", "Den Skeptizismus"], "c": 1, "fb": "Nach Abaelards <b>Konzeptualismus</b> existieren Allgemeinbegriffe weder als eigene Dinge noch als bloße Laute, sondern als Begriffe mit Grundlage in den Dingen."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "mc", "q": "Wie bestimmt Augustinus das Böse?", "opts": ["Als eigenständige Macht neben Gott", "Als Mangel an Gutem (privatio boni)", "Als Erfindung der Kirche", "Als Grundstoff der Materie"], "c": 1, "fb": "Das Böse ist für Augustinus keine Substanz, sondern <b>privatio boni</b> – Beraubung bzw. Mangel des Guten."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "mc", "q": "Wofür ist Meister Eckhart vor allem bekannt?", "opts": ["Für die deutsche Mystik (Seelengrund, Gelassenheit)", "Für die Logik der Scholastik", "Für den ontologischen Gottesbeweis", "Für den Atomismus"], "c": 0, "fb": "<b>Meister Eckhart</b> lehrte in deutschen Predigten die mystische Einheit der Seele mit Gott im „Seelengrund“."}, {"track": "allg", "cat": "Mittelalter", "d": 1, "ty": "tf", "q": "Als Scholastik bezeichnet man die an den mittelalterlichen Schulen und Universitäten entwickelte Methode wissenschaftlichen Denkens und Argumentierens.", "a": true, "fb": "Die <b>Scholastik</b> klärte Streitfragen durch Begriffsanalyse, Argument und Gegenargument (quaestio, disputatio)."}, {"track": "allg", "cat": "Mittelalter", "d": 3, "ty": "tf", "q": "Der Mönch Gaunilo kritisierte Anselms Gottesbeweis mit dem Beispiel einer vollkommenen Insel.", "a": true, "fb": "<b>Gaunilo</b> wandte ein, mit derselben Logik ließe sich die Existenz einer vollkommenen Insel „beweisen“."}, {"track": "allg", "cat": "Mittelalter", "d": 1, "ty": "tf", "q": "Wilhelm von Ockham war ein Vertreter des Universalienrealismus.", "a": false, "fb": "Ockham ist der berühmteste <b>Nominalist</b>: Universalien sind für ihn Zeichen im Geist, keine realen Dinge."}, {"track": "allg", "cat": "Mittelalter", "d": 3, "ty": "flip", "front": "Der jüdische Philosoph des Mittelalters, Autor des „Führers der Unschlüssigen“, heißt … .", "reveal": "Maimonides — Moses Maimonides (1138–1204) verband jüdische Theologie mit aristotelischer Philosophie."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "flip", "front": "Die Epoche der Kirchenväter vor der Scholastik nennt man … .", "reveal": "Patristik — die Zeit der Kirchenväter (ca. 2.–7. Jh.), deren bedeutendster Augustinus ist."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "odd", "q": "Wer war KEIN Scholastiker?", "opts": ["Anselm von Canterbury", "Thomas von Aquin", "Duns Scotus", "Augustinus"], "c": 3, "fb": "<b>Augustinus</b> gehört zur spätantiken Patristik, nicht zur mittelalterlichen Scholastik."}, {"track": "allg", "cat": "Mittelalter", "d": 3, "ty": "odd", "q": "Welches Argument gehört NICHT zu Thomas von Aquins fünf Wegen?", "opts": ["Argument aus der Bewegung", "Argument aus der Wirkursache", "Argument aus der Kontingenz", "Argument aus dem bloßen Begriff Gottes"], "c": 3, "fb": "Der Schluss aus dem <b>Begriff</b> Gottes ist Anselms ontologisches Argument – Thomas lehnte es ab und argumentierte von der Erfahrung aus."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "match", "q": "Ordne Denker → Kennzeichen zu.", "pairs": [["Abaelard", "Methodenschrift „Sic et non“"], ["Hildegard von Bingen", "Mystikerin und Universalgelehrte"], ["Duns Scotus", "Beiname „doctor subtilis“"], ["Avicenna", "Persischer Aristoteliker und Mediziner"]], "fb": "Vier prägende Gestalten des Mittelalters mit ihrem markantesten Kennzeichen."}, {"track": "allg", "cat": "Mittelalter", "d": 3, "ty": "order", "q": "Sortiere chronologisch (früh→spät).", "items": ["Boethius", "Avicenna", "Abaelard", "Duns Scotus"], "fb": "Boethius (ca. 480), Avicenna (980), Abaelard (1079), Duns Scotus (ca. 1266)."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "multi", "q": "Welche Aussagen über Augustinus treffen zu? (mehrere)", "opts": ["Er war Bischof von Hippo in Nordafrika", "Er schrieb „De civitate Dei“", "Er reflektierte in den „Confessiones“ berühmt über das Wesen der Zeit", "Er war ein Schüler des Thomas von Aquin", "Er lehrte vor seiner Bekehrung Rhetorik"], "c": [0, 1, 2, 4], "fb": "Augustinus (354–430) war Rhetoriklehrer, dann <b>Bischof von Hippo</b>; Thomas lebte 800 Jahre später."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "mc", "q": "Wozu dient Descartes' Gedankenexperiment eines „bösen Dämons“ (genius malignus)?", "opts": ["Es beweist die Existenz des Teufels", "Es radikalisiert den Zweifel, sodass selbst Mathematik bezweifelbar wird", "Es widerlegt die Astronomie", "Es begründet den Empirismus"], "c": 1, "fb": "Der <b>genius malignus</b> könnte uns sogar in einfachsten Urteilen täuschen – nur das Cogito hält diesem Zweifel stand."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 1, "ty": "mc", "q": "Welche wissenschaftliche Methode propagierte Francis Bacon im „Novum Organum“?", "opts": ["Die Deduktion aus ersten Prinzipien", "Die Induktion aus planmäßiger Beobachtung und Experiment", "Die Meditation", "Die Dialektik"], "c": 1, "fb": "<b>Bacon</b> forderte, durch Experiment und <b>Induktion</b> von Einzelbeobachtungen zu allgemeinen Gesetzen aufzusteigen."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 3, "ty": "mc", "q": "Was meint Francis Bacon mit seinen „Idolen“ (idola)?", "opts": ["Heidnische Götterbilder", "Trugbilder und Vorurteile, die die Erkenntnis verzerren", "Vorbilder der Wissenschaft", "Mathematische Modelle"], "c": 1, "fb": "Die <b>Idole</b> (des Stammes, der Höhle, des Marktes, des Theaters) sind Erkenntnishindernisse, die es abzubauen gilt."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 1, "ty": "mc", "q": "Welche berühmte These vertritt Leibniz in seiner Theodizee?", "opts": ["Die Welt ist die schlechteste aller möglichen Welten", "Unsere Welt ist die beste aller möglichen Welten", "Gott existiert nicht", "Die Welt ist reiner Zufall"], "c": 1, "fb": "Gott wählte nach Leibniz aus allen möglichen Welten die <b>beste</b> – so verteidigt die <b>Theodizee</b> Gott angesichts des Übels."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 3, "ty": "mc", "q": "Leibniz unterscheidet Vernunftwahrheiten von …", "opts": ["Glaubenswahrheiten", "Tatsachenwahrheiten", "Scheinwahrheiten", "Doppelwahrheiten"], "c": 1, "fb": "<b>Vernunftwahrheiten</b> sind notwendig (ihr Gegenteil ist unmöglich), <b>Tatsachenwahrheiten</b> kontingent und erfahrungsabhängig."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "mc", "q": "In welcher Form ist Spinozas Hauptwerk „Ethik“ verfasst?", "opts": ["Als Dialog", "Nach geometrischer Methode mit Definitionen, Axiomen und Beweisen", "Als Briefroman", "Als Aphorismensammlung"], "c": 1, "fb": "Die „Ethica, <b>ordine geometrico</b> demonstrata“ ahmt den Aufbau von Euklids Geometrie nach."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "mc", "q": "Welche Qualitäten zählt Locke zu den sekundären Qualitäten der Dinge?", "opts": ["Ausdehnung, Gestalt, Bewegung", "Farben, Töne, Geschmäcker", "Zahl und Festigkeit", "Raum und Zeit"], "c": 1, "fb": "<b>Sekundäre Qualitäten</b> wie Farbe oder Geschmack existieren nur in unserer Wahrnehmung; primäre (Gestalt, Bewegung) kommen den Dingen selbst zu."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "mc", "q": "Was besagt „Humes Gesetz“ zum Verhältnis von Sein und Sollen?", "opts": ["Aus dem Sein folgt stets das Sollen", "Aus rein beschreibenden Aussagen folgt logisch kein normatives Sollen", "Moral ist objektiv beweisbar", "Normen sind Naturgesetze"], "c": 1, "fb": "Der <b>Sein-Sollen-Fehlschluss</b>: Von deskriptiven Prämissen darf nicht ohne Weiteres auf normative Schlüsse übergegangen werden."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "mc", "q": "Wo verortete Descartes die Wechselwirkung von Geist und Körper?", "opts": ["Im Herzen", "In der Zirbeldrüse", "In der Leber", "In den Händen"], "c": 1, "fb": "Descartes sah in der <b>Zirbeldrüse</b> (Epiphyse) den Ort der Interaktion – eine berühmte Verlegenheitslösung des Dualismus."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "tf", "q": "Thomas Hobbes vertrat einen konsequenten Materialismus, nach dem alles – auch das Denken – Körper und Bewegung ist.", "a": true, "fb": "<b>Hobbes</b> erklärte alle Vorgänge, auch geistige, mechanisch aus bewegter Materie."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "tf", "q": "Nach Berkeley garantiert Gott als beständig Wahrnehmender das Fortbestehen der Dinge, wenn kein Mensch sie wahrnimmt.", "a": true, "fb": "Weil <b>Gott</b> alles immerfort wahrnimmt, existieren die Dinge auch ohne menschliche Beobachter weiter."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "tf", "q": "Spinoza wurde für seine Lehren von der jüdischen Gemeinde Amsterdams feierlich geehrt.", "a": false, "fb": "Im Gegenteil: Die Gemeinde verhängte 1656 den <b>Bann</b> (Cherem) über Spinoza und schloss ihn aus."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "flip", "front": "Descartes' berühmtes Beispiel in der zweiten Meditation dafür, dass der Verstand und nicht die Sinne erkennt, ist ein Stück … .", "reveal": "Wachs — Das Wachs bleibt dasselbe, obwohl sich alle sinnlichen Eigenschaften beim Schmelzen ändern; erfasst wird es durch den Verstand."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "flip", "front": "Leibniz' Begriff für die von Gott im Voraus abgestimmte Übereinstimmung der Monaden: prästabilierte … .", "reveal": "Harmonie — Die prästabilierte Harmonie erklärt, warum Seele und Körper übereinstimmen, ohne aufeinander einzuwirken."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 1, "ty": "flip", "front": "Francis Bacons berühmtes Diktum lautet: „Wissen ist …“", "reveal": "Macht — Wissen soll die Naturbeherrschung zum Nutzen der Menschen ermöglichen."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 1, "ty": "odd", "q": "Welches Werk stammt NICHT von Descartes?", "opts": ["Meditationen über die Erste Philosophie", "Discours de la méthode", "Prinzipien der Philosophie", "Ethik (nach geometrischer Methode)"], "c": 3, "fb": "Die „<b>Ethik</b>“ ist Spinozas Hauptwerk."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "odd", "q": "Welcher Begriff gehört NICHT zu Humes Philosophie?", "opts": ["Impressionen", "Ideen", "Gewohnheit", "Prästabilierte Harmonie"], "c": 3, "fb": "Die <b>prästabilierte Harmonie</b> ist ein Begriff von Leibniz."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "match", "q": "Ordne Denker → Hauptwerk zu.", "pairs": [["Locke", "Versuch über den menschlichen Verstand"], ["Hume", "Traktat über die menschliche Natur"], ["Leibniz", "Monadologie"], ["Berkeley", "Prinzipien der menschlichen Erkenntnis"]], "fb": "Vier Hauptwerke der neuzeitlichen Erkenntnistheorie."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "order", "q": "Sortiere die Denker nach Geburtsjahr (früh→spät).", "items": ["Francis Bacon", "Thomas Hobbes", "George Berkeley", "David Hume"], "fb": "Bacon (1561), Hobbes (1588), Berkeley (1685), Hume (1711)."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "multi", "q": "Welche Aussagen über Descartes treffen zu? (mehrere)", "opts": ["Er entwickelte die analytische Geometrie mit", "Er unterschied denkende und ausgedehnte Substanz", "Er starb 1650 in Stockholm am Hof Königin Christinas", "Er war ein britischer Empirist", "Er unterzog die Sinneserkenntnis einem methodischen Zweifel"], "c": [0, 1, 2, 4], "fb": "Descartes war Mathematiker (<b>kartesisches Koordinatensystem</b>), Dualist und Rationalist; er starb in Stockholm."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 3, "ty": "recall", "prompt": "Erkläre Humes Induktionsproblem.", "hint": "Zukunft gleicht Vergangenheit?", "model": "Induktive Schlüsse setzen voraus, dass die Zukunft der Vergangenheit gleicht. Diese Annahme lässt sich weder logisch beweisen noch ohne Zirkel durch Erfahrung rechtfertigen, denn das wäre selbst ein Induktionsschluss. Unser Vertrauen in Induktion beruht daher nach Hume nicht auf Vernunft, sondern auf Gewohnheit."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 3, "ty": "recall", "prompt": "Erkläre Humes Unterscheidung von Impressionen und Ideen.", "hint": "Lebhaftigkeit, Abbilder", "model": "Impressionen sind die lebhaften, unmittelbaren Sinneseindrücke und Gefühle. Ideen sind ihre schwächeren Abbilder im Denken und Erinnern. Jede echte Idee muss sich nach Hume auf Impressionen zurückführen lassen – sonst ist der Begriff leer."}, {"track": "allg", "cat": "Kant", "d": 1, "ty": "mc", "q": "Was bedeutet Kants Wahlspruch der Aufklärung „Sapere aude!“?", "opts": ["Genieße den Tag!", "Habe Mut, dich deines eigenen Verstandes zu bedienen!", "Erkenne dich selbst!", "Zweifle an allem!"], "c": 1, "fb": "<b>Sapere aude</b> („Wage zu wissen“) übersetzt Kant als Aufforderung zum eigenständigen Verstandesgebrauch."}, {"track": "allg", "cat": "Kant", "d": 1, "ty": "mc", "q": "Kant definiert: „Aufklärung ist der Ausgang des Menschen aus seiner selbstverschuldeten …“", "opts": ["Armut", "Unmündigkeit", "Einsamkeit", "Unwissenheit"], "c": 1, "fb": "<b>Unmündigkeit</b> ist das Unvermögen, sich seines Verstandes ohne fremde Leitung zu bedienen – selbstverschuldet durch Faulheit und Feigheit."}, {"track": "allg", "cat": "Kant", "d": 1, "ty": "mc", "q": "Was bedeutet „Autonomie“ in Kants Ethik?", "opts": ["Unabhängigkeit vom Staat", "Selbstgesetzgebung des Willens durch die Vernunft", "Freiheit von allen Regeln", "Gehorsam gegenüber Autoritäten"], "c": 1, "fb": "<b>Autonomie</b>: Der vernünftige Wille gibt sich das Sittengesetz selbst – Gegenteil ist die Heteronomie (Fremdbestimmung)."}, {"track": "allg", "cat": "Kant", "d": 2, "ty": "mc", "q": "Wann hat eine Handlung nach Kant echten moralischen Wert?", "opts": ["Wenn sie nützliche Folgen hat", "Wenn sie aus Pflicht geschieht, nicht bloß pflichtgemäß ist", "Wenn sie aus Mitleid geschieht", "Wenn sie gesetzlich erlaubt ist"], "c": 1, "fb": "Nur Handeln <b>aus Pflicht</b> – aus Achtung vor dem Sittengesetz – hat moralischen Wert; bloß pflichtgemäßes Handeln kann eigennützig sein."}, {"track": "allg", "cat": "Kant", "d": 3, "ty": "mc", "q": "Welche drei Postulate der praktischen Vernunft nennt Kant?", "opts": ["Raum, Zeit, Kausalität", "Freiheit, Unsterblichkeit der Seele, Existenz Gottes", "Glück, Tugend, Weisheit", "Staat, Recht, Frieden"], "c": 1, "fb": "<b>Freiheit</b>, <b>Unsterblichkeit</b> und <b>Gott</b> sind theoretisch unbeweisbar, werden aber von der Moral praktisch vorausgesetzt."}, {"track": "allg", "cat": "Kant", "d": 3, "ty": "mc", "q": "Was nennt Kant „transzendental“?", "opts": ["Alles Übersinnliche und Mystische", "Erkenntnis, die sich mit den Bedingungen der Möglichkeit von Erkenntnis a priori befasst", "Erkenntnis aus reiner Erfahrung", "Religiöse Offenbarung"], "c": 1, "fb": "<b>Transzendental</b> ist nicht „transzendent“: Es geht um die Bedingungen der Möglichkeit unserer Erkenntnis, nicht um das Jenseits."}, {"track": "allg", "cat": "Kant", "d": 1, "ty": "mc", "q": "Wie heißt Kants Schrift von 1795 über eine dauerhafte internationale Friedensordnung?", "opts": ["Der Leviathan", "Zum ewigen Frieden", "Vom Kriege", "Der Gesellschaftsvertrag"], "c": 1, "fb": "„<b>Zum ewigen Frieden</b>“ entwirft u.a. republikanische Verfassungen und einen Völkerbund als Friedensbedingungen."}, {"track": "allg", "cat": "Kant", "d": 3, "ty": "mc", "q": "Wodurch entstehen nach Kant die Antinomien der reinen Vernunft?", "opts": ["Durch Rechenfehler", "Dadurch, dass die Vernunft über alle mögliche Erfahrung hinaus nach dem Unbedingten fragt", "Durch mangelnde Bildung", "Durch Sinnestäuschungen"], "c": 1, "fb": "Die <b>Antinomien</b> (z.B. ob die Welt einen Anfang hat) sind Widerspruchspaare, die entstehen, wenn die Vernunft die Erfahrungsgrenzen überschreitet."}, {"track": "allg", "cat": "Kant", "d": 1, "ty": "tf", "q": "Kant verbrachte fast sein gesamtes Leben in Königsberg und verließ Ostpreußen nie weiträumig.", "a": true, "fb": "Kant lebte 1724–1804 in <b>Königsberg</b>, wo er lehrte und seine berühmt regelmäßigen Spaziergänge machte."}, {"track": "allg", "cat": "Kant", "d": 2, "ty": "tf", "q": "Kant hielt es für moralisch erlaubt, aus Menschenliebe zu lügen.", "a": false, "fb": "In der Schrift „Über ein vermeintes Recht, aus Menschenliebe zu lügen“ verwirft Kant selbst die <b>Notlüge</b> – das Lügenverbot gilt ausnahmslos."}, {"track": "allg", "cat": "Kant", "d": 2, "ty": "flip", "front": "Kants berühmter Satz am Schluss der Kritik der praktischen Vernunft: „Der bestirnte Himmel über mir und das … in mir.“", "reveal": "moralische Gesetz — Zwei Dinge erfüllen das Gemüt mit Bewunderung und Ehrfurcht: Sternenhimmel und Sittengesetz."}, {"track": "allg", "cat": "Kant", "d": 2, "ty": "flip", "front": "Vollende Kants Diktum: „Gedanken ohne Inhalt sind leer, Anschauungen ohne Begriffe sind …“", "reveal": "blind — Erkenntnis braucht beides: sinnliche Anschauung und Verstandesbegriffe."}, {"track": "allg", "cat": "Kant", "d": 1, "ty": "flip", "front": "Kants berühmter Aufsatz von 1784 heißt „Beantwortung der Frage: …?“", "reveal": "Was ist Aufklärung — Dort stehen die Definition der Unmündigkeit und der Wahlspruch „Sapere aude!“."}, {"track": "allg", "cat": "Kant", "d": 2, "ty": "odd", "q": "Welche Schrift stammt NICHT von Kant?", "opts": ["Kritik der reinen Vernunft", "Grundlegung zur Metaphysik der Sitten", "Zum ewigen Frieden", "Leviathan"], "c": 3, "fb": "Der „<b>Leviathan</b>“ (1651) ist das staatsphilosophische Hauptwerk von Thomas Hobbes."}, {"track": "allg", "cat": "Kant", "d": 2, "ty": "odd", "q": "Welcher Begriff gehört NICHT zur Kritik der reinen Vernunft?", "opts": ["Transzendentale Ästhetik", "Kategorien", "Antinomien", "Monaden"], "c": 3, "fb": "Die <b>Monaden</b> gehören zu Leibniz' Metaphysik, nicht zu Kants Kritik."}, {"track": "allg", "cat": "Kant", "d": 2, "ty": "match", "q": "Ordne Kants vier Fragen → zuständiges Gebiet zu.", "pairs": [["Was kann ich wissen?", "Erkenntnistheorie / Metaphysik"], ["Was soll ich tun?", "Ethik"], ["Was darf ich hoffen?", "Religionsphilosophie"], ["Was ist der Mensch?", "Anthropologie"]], "fb": "Die <b>vier Fragen</b> aus Kants Logik-Vorlesung; die vierte umfasst nach Kant die drei anderen."}, {"track": "allg", "cat": "Kant", "d": 3, "ty": "order", "q": "Sortiere Kants Werke nach Erscheinungsjahr (früh→spät).", "items": ["Kritik der reinen Vernunft", "Grundlegung zur Metaphysik der Sitten", "Kritik der praktischen Vernunft", "Kritik der Urteilskraft"], "fb": "KrV (1781), Grundlegung (1785), KpV (1788), KdU (1790)."}, {"track": "allg", "cat": "Kant", "d": 2, "ty": "multi", "q": "Welche Aussagen über Kants Erkenntnistheorie treffen zu? (mehrere)", "opts": ["Erkenntnis erfordert das Zusammenwirken von Anschauung und Begriff", "Raum und Zeit sind Formen unserer Anschauung", "Die Kategorien des Verstandes (z.B. Kausalität) strukturieren die Erfahrung", "Wir können die Dinge an sich vollständig erkennen", "Alle Erkenntnis hebt zeitlich mit der Erfahrung an"], "c": [0, 1, 2, 4], "fb": "Erkenntnis = Anschauung + Begriff; sie <b>beginnt</b> mit der Erfahrung, entspringt aber nicht ganz aus ihr; Dinge an sich bleiben unerkennbar."}, {"track": "allg", "cat": "Kant", "d": 3, "ty": "recall", "prompt": "Erkläre Kants Unterscheidung von Legalität und Moralität.", "hint": "äußere Übereinstimmung vs. Handeln aus Pflicht", "model": "Legalität liegt vor, wenn eine Handlung äußerlich mit dem Gesetz übereinstimmt, gleichgültig aus welchem Motiv. Moralität verlangt darüber hinaus, dass die Pflicht selbst – die Achtung vor dem Sittengesetz – die Triebfeder ist. Wer nur aus Angst vor Strafe ehrlich ist, handelt legal, aber nicht moralisch."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 1, "ty": "mc", "q": "Wer verfasste 1807 die 'Phänomenologie des Geistes'?", "opts": ["Kant", "Hegel", "Fichte", "Schelling"], "c": 1, "fb": "Die <b>Phänomenologie des Geistes</b> beschreibt den Bildungsweg des Bewusstseins bis zum absoluten Wissen."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "mc", "q": "Was zeigt Hegels Dialektik von 'Herrschaft und Knechtschaft'?", "opts": ["dass der Herr stets überlegen bleibt", "dass Selbstbewusstsein wechselseitige Anerkennung verlangt", "dass Arbeit den Menschen erniedrigt", "dass Knechtschaft naturgegeben ist"], "c": 1, "fb": "In der <b>Herr-Knecht-Dialektik</b> gewinnt der Knecht durch Arbeit Selbstständigkeit; Selbstbewusstsein braucht <b>Anerkennung</b>."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "mc", "q": "Um welche biblische Gestalt kreist Kierkegaards Schrift 'Furcht und Zittern'?", "opts": ["Hiob", "Abraham", "Mose", "Paulus"], "c": 1, "fb": "An Abrahams Opfergang zeigt Kierkegaard den <b>Sprung des Glaubens</b> jenseits des Ethischen."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "mc", "q": "Wie kann der Mensch nach Schopenhauer dem Leiden dauerhaft entkommen?", "opts": ["durch politisches Engagement", "durch Verneinung des Willens (Askese)", "durch Anhäufung von Besitz", "durch technischen Fortschritt"], "c": 1, "fb": "Kunst gewährt nur vorübergehende Ruhe; dauerhafte Erlösung bringt die <b>Verneinung des Willens</b>."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 1, "ty": "mc", "q": "Wer schrieb die Werke 'Über die Freiheit' und 'Der Utilitarismus'?", "opts": ["Jeremy Bentham", "John Stuart Mill", "Henry Sidgwick", "Herbert Spencer"], "c": 1, "fb": "<b>John Stuart Mill</b> verfasste beide Klassiker (1859 bzw. 1861)."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "mc", "q": "Was meint Marx mit der 'Entfremdung' der Arbeit?", "opts": ["Der Arbeiter verliert den Bezug zu Produkt, Tätigkeit und Mitmenschen", "Arbeit wird ins Ausland verlagert", "Maschinen ersetzen alle Arbeiter", "Arbeit wird zu leicht"], "c": 0, "fb": "<b>Entfremdung</b>: Produkt, Tätigkeit, Gattungswesen und Mitmensch werden dem Arbeiter fremd."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "mc", "q": "Welcher britische Denker übertrug Evolutionsideen auf die Gesellschaft und prägte 'survival of the fittest'?", "opts": ["Charles Darwin", "Herbert Spencer", "Thomas Malthus", "David Ricardo"], "c": 1, "fb": "<b>Spencer</b> prägte die Formel und gilt als Vordenker des Sozialdarwinismus; Darwin übernahm sie später."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 3, "ty": "mc", "q": "Welche Funktion hat Nietzsches Gedanke der 'ewigen Wiederkunft des Gleichen'?", "opts": ["eine physikalische Theorie zu beweisen", "als Prüfstein radikaler Lebensbejahung zu dienen", "die Unsterblichkeit der Seele zu sichern", "den Fortschritt der Geschichte zu garantieren"], "c": 1, "fb": "Wer sein Leben unendlich oft wiederholen wollte, besteht den Test der <b>Lebensbejahung</b> (amor fati)."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "mc", "q": "Was bezeichnet 'Ideologie' im Sinne von Marx und Engels?", "opts": ["jede beliebige politische Meinung", "gesellschaftlich bedingtes 'falsches Bewusstsein'", "eine exakte Wissenschaft", "religiöse Toleranz"], "c": 1, "fb": "<b>Ideologie</b> verschleiert die realen Verhältnisse: Die herrschenden Gedanken sind die Gedanken der Herrschenden."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 3, "ty": "mc", "q": "Was meint Hegels 'List der Vernunft'?", "opts": ["Politiker täuschen das Volk", "Die Vernunft verwirklicht ihre Zwecke durch die Leidenschaften der Individuen", "Philosophen argumentieren trickreich", "Die Vernunft ist bloße Illusion"], "c": 1, "fb": "Die <b>List der Vernunft</b>: Der Weltgeist nutzt die Interessen der Handelnden für seine eigenen Zwecke."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "mc", "q": "Wer gilt als Begründer des Pragmatismus?", "opts": ["Charles Sanders Peirce", "John Locke", "Auguste Comte", "Franz Brentano"], "c": 0, "fb": "<b>Peirce</b> begründete den Pragmatismus; William James machte ihn populär."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 1, "ty": "tf", "q": "Marx bezeichnete die Religion als 'Opium des Volkes'.", "a": true, "fb": "Religion ist für Marx Ausdruck realen Elends und zugleich ein Trost, der die Verhältnisse verschleiert."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 1, "ty": "tf", "q": "Schopenhauer war ein begeisterter Anhänger Hegels.", "a": false, "fb": "<b>Schopenhauer</b> verachtete Hegel und legte seine Berliner Vorlesungen demonstrativ auf dieselbe Stunde."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 1, "ty": "tf", "q": "Kierkegaard veröffentlichte viele seiner Werke unter Pseudonymen.", "a": true, "fb": "Pseudonyme wie Johannes Climacus gehören zu Kierkegaards Methode der <b>indirekten Mitteilung</b>."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "tf", "q": "Nietzsche stellte das Buch 'Der Wille zur Macht' selbst fertig und veröffentlichte es.", "a": false, "fb": "Es ist eine <b>Nachlass-Kompilation</b>, maßgeblich von seiner Schwester zusammengestellt."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 1, "ty": "flip", "front": "Nietzsches Dichtungswerk, in dem ein persischer Weiser den Übermenschen verkündet, heißt 'Also sprach …'.", "reveal": "Zarathustra — 'Also sprach Zarathustra' (1883–85) verkündet Übermensch und ewige Wiederkunft."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "flip", "front": "Kierkegaards drei Existenzstadien: das ästhetische, das ethische und das … Stadium.", "reveal": "religiöse — Das religiöse Stadium ist für Kierkegaard die höchste Existenzweise."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "flip", "front": "Marx' 11. Feuerbach-These: 'Die Philosophen haben die Welt nur verschieden interpretiert; es kömmt drauf an, sie zu ….'", "reveal": "verändern — Philosophie soll für Marx praktisch werden und in die Geschichte eingreifen."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 3, "ty": "flip", "front": "In welchem Jahr erschien Schopenhauers 'Die Welt als Wille und Vorstellung'?", "reveal": "ca. 1818/1819 n. Chr. — Der Erfolg des Werks kam erst Jahrzehnte später."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 1, "ty": "odd", "q": "Welches Werk stammt NICHT von Nietzsche?", "opts": ["Die Geburt der Tragödie", "Jenseits von Gut und Böse", "Zur Genealogie der Moral", "Sein und Zeit"], "c": 3, "fb": "<b>Sein und Zeit</b> ist Heideggers Hauptwerk (1927)."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "odd", "q": "Wer war KEIN Utilitarist?", "opts": ["Jeremy Bentham", "John Stuart Mill", "Henry Sidgwick", "Søren Kierkegaard"], "c": 3, "fb": "<b>Kierkegaard</b> ist religiöser Existenzdenker, kein Utilitarist."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "odd", "q": "Welcher Begriff gehört NICHT zu Hegel?", "opts": ["Weltgeist", "Aufhebung", "absolutes Wissen", "Mitleidsethik"], "c": 3, "fb": "Die <b>Mitleidsethik</b> gehört zu Schopenhauer."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "match", "q": "Ordne Werk → Autor zu.", "pairs": [["Entweder – Oder", "Kierkegaard"], ["Über die Freiheit", "Mill"], ["Das Wesen des Christentums", "Feuerbach"], ["Zur Genealogie der Moral", "Nietzsche"]], "fb": "Jede Zuordnung verbindet ein Hauptwerk des 19. Jahrhunderts mit seinem Autor."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 3, "ty": "order", "q": "Sortiere die Werke nach Erscheinungsjahr (früh→spät).", "items": ["Phänomenologie des Geistes", "Die Welt als Wille und Vorstellung", "Entweder – Oder", "Also sprach Zarathustra"], "fb": "Hegel (1807), Schopenhauer (1818/19), Kierkegaard (1843), Nietzsche (1883–85)."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 3, "ty": "multi", "q": "Welche Aussagen treffen auf Marx zu?", "opts": ["Geschichte ist für ihn eine Geschichte von Klassenkämpfen", "Der Mehrwert entspringt unbezahlter Mehrarbeit", "Er pries den freien Markt als gerechteste Ordnung", "Der Kapitalismus erzeugt seine 'Totengräber' selbst", "Er hielt Ideen für unabhängig von ökonomischen Verhältnissen"], "c": [0, 1, 3], "fb": "Marx kritisierte den Markt und band Ideen an die materielle <b>Basis</b>; das Proletariat ist der 'Totengräber' der Bourgeoisie."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 2, "ty": "recall", "prompt": "Erkläre Hegels Begriff der 'Aufhebung'.", "hint": "dreifacher Wortsinn", "model": "Aufhebung hat bei Hegel drei Bedeutungen zugleich: negieren (beenden), bewahren (aufbewahren) und emporheben (auf eine höhere Stufe bringen). In der Dialektik wird ein Gegensatz so überwunden, dass sein Wahres in einer höheren Einheit erhalten bleibt."}, {"track": "allg", "cat": "19. Jahrhundert", "d": 3, "ty": "recall", "prompt": "Erkläre Schopenhauers These, die Welt sei 'Wille und Vorstellung'.", "hint": "Erscheinung vs. Ding an sich", "model": "Als Vorstellung ist die Welt Erscheinung für ein erkennendes Subjekt. Ihr innerstes Wesen — Kants Ding an sich — deutet Schopenhauer als blinden, ziellosen Willen. Weil der Wille nie dauerhaft zu stillen ist, ist das Leben wesentlich Leiden; Auswege bieten Kunst (vorübergehend) und Askese."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 1, "ty": "mc", "q": "Von wem stammt der Satz 'Man kommt nicht als Frau zur Welt, man wird es'?", "opts": ["Hannah Arendt", "Simone de Beauvoir", "Judith Butler", "Simone Weil"], "c": 1, "fb": "Der Satz steht in <b>Beauvoirs</b> 'Das andere Geschlecht' (1949)."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "mc", "q": "Welcher Begriff steht im Zentrum von Habermas' Philosophie?", "opts": ["kommunikatives Handeln", "Wille zur Macht", "élan vital", "Herrenmoral"], "c": 0, "fb": "<b>Habermas</b>: Verständigung durch den 'zwanglosen Zwang des besseren Arguments' ('Theorie des kommunikativen Handelns', 1981)."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 1, "ty": "mc", "q": "Horkheimer, Adorno und Marcuse gehören zu welcher Denkschule?", "opts": ["Wiener Kreis", "Frankfurter Schule", "Marburger Schule", "Cambridge-Platonismus"], "c": 1, "fb": "Die <b>Frankfurter Schule</b> entwickelte die Kritische Theorie der Gesellschaft."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "mc", "q": "Womit beschäftigte sich Michel Foucault vor allem?", "opts": ["dem Verhältnis von Macht, Wissen und Diskursen", "der reinen Logik", "der Verteidigung des Naturrechts", "der Philosophie der Mathematik"], "c": 0, "fb": "<b>Foucault</b> analysierte u.a. in 'Überwachen und Strafen' die <b>Disziplinarmacht</b> moderner Institutionen."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 3, "ty": "mc", "q": "Welche 'zwei Dogmen des Empirismus' kritisierte Quine?", "opts": ["Realismus und Idealismus", "die analytisch-synthetisch-Unterscheidung und den Reduktionismus", "Determinismus und Freiheit", "Rationalismus und Skeptizismus"], "c": 1, "fb": "<b>Quine</b> (1951) bestritt eine scharfe Grenze zwischen analytischen und synthetischen Sätzen."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "mc", "q": "Der Begriff 'Dekonstruktion' ist verbunden mit …", "opts": ["Jacques Derrida", "Karl Popper", "Rudolf Carnap", "John Rawls"], "c": 0, "fb": "<b>Derrida</b> liest Texte gegen den Strich und legt ihre inneren Spannungen frei."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 3, "ty": "mc", "q": "Was bezeichnet Husserls 'Epoché'?", "opts": ["das Ende der Philosophie", "die methodische Einklammerung der Geltung der Welt (Urteilsenthaltung)", "eine historische Epoche", "ein logisches Axiom"], "c": 1, "fb": "Die <b>Epoché</b> klammert die natürliche Weltsetzung ein, um die Bewusstseinsleistungen selbst zu untersuchen."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "mc", "q": "Wie nennt Heidegger das Seiende, das wir selbst sind?", "opts": ["Substanz", "Dasein", "Monade", "res cogitans"], "c": 1, "fb": "<b>Dasein</b> ist durch In-der-Welt-sein, Sorge und Sein zum Tode bestimmt."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 1, "ty": "mc", "q": "Sartres philosophisches Hauptwerk von 1943 heißt …", "opts": ["Das Sein und das Nichts", "Kritik der reinen Vernunft", "Der Ekel", "Die Wörter"], "c": 0, "fb": "<b>Das Sein und das Nichts</b> entfaltet Sartres Ontologie der Freiheit."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "mc", "q": "Wer verfasste zusammen mit Alfred North Whitehead die 'Principia Mat ufklärung' analysiert den Umschlag von Aufklärung in neue Mythologie und Herrschaft."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 1, "ty": "flip", "front": "Sartres Diktum aus 'Geschlossene Gesellschaft': 'Die Hölle, das sind die ….'", "reveal": "anderen — Der Blick der Anderen fixiert und objektiviert uns; daher 'Die Hölle, das sind die anderen'."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 3, "ty": "flip", "front": "In welchem Jahr erschien Wittgensteins 'Tractatus logico-philosophicus'?", "reveal": "ca. 1921 n. Chr. — deutsch 1921, englisch-deutsche Ausgabe 1922."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "flip", "front": "Der amerikanische Pragmatist und Pädagoge, Autor von 'Demokratie und Erziehung': John ….", "reveal": "Dewey — Dewey verband Pragmatismus, Demokratietheorie und Erziehungsphilosophie."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "odd", "q": "Wer gehört NICHT zur Frankfurter Schule?", "opts": ["Adorno", "Horkheimer", "Marcuse", "Popper"], "c": 3, "fb": "<b>Popper</b> war im <b>Positivismusstreit</b> der 1960er Jahre ihr Kontrahent."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "odd", "q": "Wer gehört NICHT zur Phänomenologie?", "opts": ["Edmund Husserl", "Maurice Merleau-Ponty", "Max Scheler", "Rudolf Carnap"], "c": 3, "fb": "<b>Carnap</b> gehört zum Wiener Kreis (Logischer Empirismus)."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 3, "ty": "odd", "q": "Welcher Begriff gehört NICHT zu Foucault?", "opts": ["Diskurs", "Disziplinarmacht", "Biopolitik", "différance"], "c": 3, "fb": "<b>différance</b> ist ein Kunstwort Derridas."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "match", "q": "Ordne Werk → Autor zu.", "pairs": [["Wahrheit und Methode", "Gadamer"], ["Die offene Gesellschaft und ihre Feinde", "Popper"], ["Philosophische Untersuchungen", "Wittgenstein"], ["Das Prinzip Hoffnung", "Bloch"]], "fb": "Gadamer (Hermeneutik), Popper (Kritischer Rationalismus), Wittgenstein (Spätphilosophie), Bloch (Utopie-Philosophie)."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 3, "ty": "match", "q": "Ordne Denker → Schlüsselbegriff zu.", "pairs": [["Levinas", "Antlitz des Anderen"], ["Merleau-Ponty", "Leiblichkeit"], ["Adorno", "negative Dialektik"], ["Cassirer", "symbolische Formen"]], "fb": "Jeder Begriff benennt das Zentrum des jeweiligen Denkens."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 3, "ty": "order", "q": "Sortiere die Werke nach Erscheinungsjahr (früh→spät).", "items": ["Tractatus logico-philosophicus", "Sein und Zeit", "Das Sein und das Nichts", "Das andere Geschlecht"], "fb": "Wittgenstein (1921), Heidegger (1927), Sartre (1943), Beauvoir (1949)."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "multi", "q": "Welche Denker zählen zur analytischen Philosophie?", "opts": ["Bertrand Russell", "Rudolf Carnap", "W. V. O. Quine", "Martin Heidegger", "A. J. Ayer"], "c": [0, 1, 2, 4], "fb": "<b>Heidegger</b> steht für die kontinentale Tradition; die übrigen prägten die analytische Philosophie."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 3, "ty": "multi", "q": "Welche Aussagen über die Kritische Theorie treffen zu?", "opts": ["Sie verbindet Motive von Marx und Freud", "Ihr Institut ging während des Nationalsozialismus ins Exil", "Sie bejaht die bestehende Gesellschaft grundsätzlich", "'Kulturindustrie' ist einer ihrer zentralen Begriffe", "Sie verzichtet bewusst auf Gesellschaftskritik"], "c": [0, 1, 3], "fb": "Die <b>Kritische Theorie</b> ist gerade als Kritik der bestehenden Gesellschaft angelegt; das Institut emigrierte u.a. nach New York."}, {"track": "allg", "cat": "20. Jahrhundert", "d": 2, "ty": "recall", "prompt": "Erkläre Hans Jonas' 'ökologischen Imperativ' aus 'Das Prinzip Verantwortung'.", "hint": "künftige Generationen", "model": "Jonas fordert: Handle so, dass die Wirkungen deiner Handlung verträglich sind mit der Permanenz echten menschlichen Lebens auf Erden. Angesichts der Macht modern  "<b>Burkes</b> 'Betrachtungen über die Revolution in Frankreich' (1790) verteidigen Tradition und gewachsene Ordnung."}, {"track": "allg", "cat": "Politische Philosophie", "d": 2, "ty": "mc", "q": "Alexis de Tocqueville warnte in 'Über die Demokratie in Amerika' vor …", "opts": ["der Tyrannei der Mehrheit", "der Rückkehr der Monarchie", "dem Föderalismus", "der Pressefreiheit"], "c": 0, "fb": "<b>Tocqueville</b> sah in der Demokratie die Gefahr einer <b>Tyrannei der Mehrheit</b> über Minderheiten und Meinungen."}, {"track": "allg", "cat": "Politische Philosophie", "d": 3, "ty": "mc", "q": "Wodurch bestimmt Carl Schmitt 'das Politische'?", "opts": ["durch Gerechtigkeit", "durch die Unterscheidung von Freund und Feind", "durch Wohlstandsmehrung", "durch neutrale Verwaltung"], "c": 1, "fb": "<b>Schmitts</b> umstrittene These: Das Politische beruht auf der <b>Freund-Feind-Unterscheidung</b>."}, {"track": "allg", "cat": "Politische Philosophie", "d": 2, "ty": "mc", "q": "Von wem stammt der Satz 'Eigentum ist Diebstahl'?", "opts": ["Karl Marx", "Pierre-Joseph Proudhon", "Michail Bakunin", "Jean-Jacques Rousseau"], "c": 1, "fb": "<b>Proudhon</b> (1840), ein Vordenker des <b>Anarchismus</b>."}, {"track": "allg", "cat": "Politische Philosophie", "d": 1, "ty": "tf", "q": "Platons 'Politeia' entwirft einen Staat mit drei Ständen: Regenten, Wächter und Nährstand.", "a": true, "fb": "Gerechtigkeit herrscht, wenn jeder Stand 'das Seine tut' — analog zu den drei Seelenteilen."}, {"track": "allg", "cat": "Politische Philosophie", "d": 1, "ty": "tf", "q": "Mary Wollstonecraft verteidigte im 18. Jahrhundert die Rechte der Frauen.", "a": true, "fb": "<b>Wollstonecrafts</b> 'A Vindication of the Rights of Woman' (1792) ist ein Gründungstext des Feminismus."}, {"track": "allg", "cat": "Politische Philosophie", "d": 2, "ty": "tf", "q": "Für Hobbes behält der Einzelne auch im Staat das unveräußerliche Recht auf Selbsterhaltung.", "a": true, "fb": "Selbst bei Hobbes darf niemand verpflich er <b>Klassenkampf</b> ist ein Begriff von Marx und Engels."}, {"track": "allg", "cat": "Politische Philosophie", "d": 2, "ty": "match", "q": "Ordne Werk → Autor zu.", "pairs": [["Politeia", "Platon"], ["Politik", "Aristoteles"], ["Utopia", "Thomas Morus"], ["Vom Geist der Gesetze", "Montesquieu"]], "fb": "Vier Klassiker der politischen Philosophie von der Antike bis zur Aufklärung."}, {"track": "allg", "cat": "Politische Philosophie", "d": 2, "ty": "order", "q": "Sortiere die politischen Denker chronologisch (früh→spät).", "items": ["Platon", "Machiavelli", "Montesquieu", "Isaiah Berlin"], "fb": "Platon (Antike), Machiavelli (Renaissance), Montesquieu (Aufklärung), Berlin (20. Jahrhundert)."}, {"track": "allg", "cat": "Politische Philosophie", "d": 3, "ty": "multi", "q": "Welche Forderungen enthält Kants 'Zum ewigen Frieden'?", "opts": ["republikanische Verfassung jedes Staates", "Föderation freier Staaten", "Weltbürgerrecht der Hospitalität", "Errichtung eines Weltstaats mit Zwangsgewalt", "Abschaffung aller Verfassungen"], "c": [0, 1, 2], "fb": "Kant will eine <b>Föderation</b> freier Republiken, ausdrücklich keinen Zwangs-Weltstaat."}, {"track": "allg", "cat": "Politische Philosophie", "d": 3, "ty": "recall", "prompt": "Erkläre Isaiah Berlins Unterscheidung von negativer und positiver Freiheit.", "hint": "Freiheit von / Freiheit zu", "model": "Negative Freiheit ist die Abwesenheit äußerer Eingriffe ('Freiheit von'), positive Freiheit die Fähigkeit zur Selbstbestimmung und Selbstverwirklichung ('Freiheit zu'). Berlin warnt, dass positive Freiheit politisch missbraucht werden kann, wenn ein angeblich 'wahres Selbst' gegen die realen Individuen ausgespielt wird."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 1, "ty": "mc", "q": "'Post hoc ergo propter hoc' bezeichnet den Fehler, …", "opts": ["aus bloßer zeitlicher Abfolge auf Verursachung zu schließen", "die Person statt des Arguments anzugreifen", "nur zwei Optionen zuzulassen", "sich auf Autoritäten zu berufen"], "c": 0, "fb": "<b>Post hoc ergo propter hoc</b>: 'Danach, also deswegen' — Korrelation in der Zeit ist keine Kausalität."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 1, "ty": "mc", "q": "Beim 'argumentum ad populum' gilt etwas als wahr, weil …", "opts": ["es logisch bewiesen ist", "viele Menschen es glauben", "ein Experte es sagt", "es besonders alt ist"], "c": 1, "fb": "Der Appell an die Mehrheit (<b>ad populum</b>) ersetzt Gründe durch Popularität."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "'Wenn p, dann q. q. Also p.' — Diese Schlussform ist …", "opts": ["gültig (Modus ponens)", "ungültig: Bejahung des Konsequens", "gültig (Modus tollens)", "eine Tautologie"], "c": 1, "fb": "Die <b>Bejahung des Konsequens</b> ist ein formaler Fehlschluss: Aus dem Eintreten der Folge folgt nicht die Bedingung."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "Was ist ein 'Tu-quoque'-Einwand ('Du auch!')?", "opts": ["ein gültiger Gegenbeweis", "der Versuch, ein Argument durch den Vorwurf der Inkonsequenz des Sprechers zu entkräften", "eine Form der Induktion", "ein mathematischer Beweis"], "c": 1, "fb": "<b>Tu quoque</b> ist ein Sonderfall des Ad hominem: Inkonsequenz des Sprechers widerlegt nicht seine These."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "Der 'Schluss auf die beste Erklärung' heißt auch …", "opts": ["Deduktion", "Abduktion", "Intuition", "Reduktion"], "c": 1, "fb": "Die <b>Abduktion</b> (Peirce) wählt zu einem Befund die plausibelste Erklärungshypothese."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "Sauerstoff ist für ein Feuer eine … Bedingung.", "opts": ["hinreichende, aber nicht notwendige", "notwendige, aber nicht hinreichende", "notwendige und hinreichende", "weder notwendige noch hinreichende"], "c": 1, "fb": "Ohne Sauerstoff kein Feuer (<b>notwendig</b>); Sauerstoff allein entzündet aber nichts (nicht <b>hinreichend</b>)."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 3, "ty": "mc", "q": "'Ex falso quodlibet' besagt, dass …", "opts": ["aus Falschem gar nichts folgt", "aus einem Widerspruch logisch Beliebiges folgt", "falsche Prämissen verboten sind", "die Logik keine Wahrheit kennt"], "c": 1, "fb": "<b>Ex falso quodlibet</b>: Aus einer Kontradiktion lässt sich in der klassischen Logik jede beliebige Aussage ableiten."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "Beim 'argumentum ad ignorantiam' wird geschlossen, dass etwas wahr ist, weil …", "opts": ["es bewiesen wurde", "es niemand widerlegt hat", "es der Mehrheit gefällt", "es die einfachste Erklärung ist"], "c": 1, "fb": "Fehlendes Gegenwissen ist kein Beweis: Das <b>Argument aus Unwissenheit</b> verwechselt Unwiderlegtheit mit Wahrheit."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 3, "ty": "mc", "q": "Welchen Fehler begeht dieses Argument: 'Eine Bank verwahrt Geld. Am Fluss steht eine Bank. Also wird dort Geld verwahrt.'?", "opts": ["Äquivokation (Mehrdeutigkeit)", "Zirkelschluss", "falsches Dilemma", "Ad hominem"], "c": 0, "fb": "Bei der <b>Äquivokation</b> wird ein mehrdeutiges Wort ('Bank') im Argument in verschiedenen Bedeutungen verwendet."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 1, "ty": "tf", "q": "Eine Tautologie ist eine Aussage, die unter allen Umständen wahr ist.", "a": true, "fb": "Eine <b>Tautologie</b> wie ‚Es regnet oder es regnet nicht' ist unter jeder Interpretation wahr."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 1, "ty": "tf", "q": "Prämissen sind die Aussagen, aus denen die Konklusion eines Arguments folgen soll.", "a": true, "fb": "Ein Argument besteht aus <b>Prämissen</b> (Gründen) und einer <b>Konklusion</b> (Schlussfolgerung)."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 1, "ty": "tf", "q": "Der Satz vom Widerspruch besagt, dass eine Aussage nicht zugleich wahr und falsch sein kann.", "a": true, "fb": "Der <b>Satz vom Widerspruch</b> ist ein Grundprinzip der klassischen Logik (schon bei Aristoteles)."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "tf", "q": "'Wenn p, dann q. Nicht p. Also nicht q.' ist eine gültige Schlussform.", "a": false, "fb": "Die <b>Verneinung des Antezedens</b> ist ein formaler Fehlschluss: q kann auch aus anderen Gründen wahr sein."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "flip", "front": "Der Grundsatz, gegnerische Aussagen möglichst stark und wohlwollend auszulegen, heißt 'Prinzip der …'.", "reveal": "wohlwollenden Interpretation — englisch 'principle of charity': erst die stärkste Lesart rekonstruieren, dann kritisieren."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "flip", "front": "Eine Aussage, die unter keinen Umständen wahr sein kann, heißt ….", "reveal": "Kontradiktion — z.B. ‚Es regnet und es regnet nicht'; das Gegenstück zur Tautologie."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "flip", "front": "Das Sparsamkeitsprinzip 'Erkläre nicht mit mehr Annahmen als nötig' heißt … Rasiermesser.", "reveal": "Ockhams — Ockhams Rasiermesser bevorzugt bei gleicher Erklärungskraft die einfachere Hypothese."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 1, "ty": "odd", "q": "Welcher Ausdruck gehört NICHT zu den logischen Junktoren?", "opts": ["Konjunktion (und)", "Disjunktion (oder)", "Negation (nicht)", "Kategorischer Imperativ"], "c": 3, "fb": "Der <b>kategorische Imperativ</b> ist ein Moralprinzip Kants, kein Junktor der Aussagenlogik."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 3, "ty": "odd", "q": "Welcher Begriff stammt NICHT aus der aristotelischen Syllogistik?", "opts": ["Obersatz", "Untersatz", "Mittelbegriff", "Wahrheitstafel"], "c": 3, "fb": "<b>Wahrheitstafeln</b> gehören zur modernen Aussagenlogik des 20. Jahrhunderts."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "match", "q": "Ordne Fehlschluss → Beispiel zu.", "pairs": [["Post hoc", "Nach dem Hahnenschrei geht die Sonne auf — also weckt der Hahn die Sonne"], ["Ad populum", "Millionen nutzen es, also ist es gut"], ["Dammbruch", "Eine Ausnahme, und bald gilt gar keine Regel mehr"], ["Autoritätsargument", "Ein Prominenter sagt es, also stimmt es"]], "fb": "Jedes Beispiel zeigt das typische Muster des jeweiligen Fehlschlusses."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "order", "q": "Sortiere die Schritte einer Argumentationsanalyse (zuerst→zuletzt).", "items": ["These identifizieren", "Prämissen rekonstruieren", "Gültigkeit der Schlussform prüfen", "Wahrheit der Prämissen bewerten"], "fb": "Erst rekonstruieren, dann formal (Gültigkeit) und inhaltlich (Wahrheit) prüfen."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 3, "ty": "order", "q": "Sortiere die Etappen der Logikgeschichte chronologisch (früh→spät).", "items": ["aristotelische Syllogistik", "scholastische Logik des Mittelalters", "Freges 'Begriffsschrift'", "moderne Modallogik (C. I. Lewis)"], "fb": "Antike (Aristoteles), Mittelalter (Scholastik), 1879 (Frege), 20. Jahrhundert (Lewis)."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "multi", "q": "Welche Merkmale kennzeichnen ein gutes induktives Argument?", "opts": ["große Stichprobe", "repräsentative Auswahl der Fälle", "Berücksichtigung möglicher Gegenbeispiele", "logische Zwangsläufigkeit der Konklusion", "Garantie der Wahrheit"], "c": [0, 1, 2], "fb": "Induktion stützt die Konklusion nur mit <b>Wahrscheinlichkeit</b> — Zwangsläufigkeit und Garantie gibt es nur bei der Deduktion."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "recall", "prompt": "Erkläre, was die 'Beweislast' (onus probandi) in einer Debatte bedeutet.", "hint": "Wer behauptet, …", "model": "Die Beweislast liegt in der Regel bei dem, der eine Behauptung aufstellt: Er muss Gründe liefern. Wird sie unzulässig verschoben ('Beweise doch, dass es NICHT so ist!'), entsteht der Fehlschluss des argumentum ad ignorantiam."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 3, "ty": "recall", "prompt": "Erkläre den Unterschied zwischen formalen und informellen Fehlschlüssen.", "hint": "Form vs. Inhalt/Kontext", "model": "Formale Fehlschlüsse verletzen die logische Form (z.B. Bejahung des Konsequens) und sind unabhängig vom Inhalt ungültig. Informelle Fehlschlüsse (z.B. Strohmann oder Ad hominem) scheitern an Inhalt, Relevanz oder Kontext, obwohl die Form korrekt wirken kann."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 1, "ty": "mc", "q": "Welches Teilgebiet der Philosophie untersucht Wesen, Bedeutung und Funktion der Sprache?", "opts": ["Sprachphilosophie", "Ästhetik", "Rechtsphilosophie", "Ontologie"], "c": 0, "fb": "Die <b>Sprachphilosophie</b> fragt, was Bedeutung ist und wie sich Sprache, Denken und Welt zueinander verhalten."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "mc", "q": "Kants Frage „Was darf ich hoffen?“ wird traditionell welcher Disziplin zugeordnet?", "opts": ["Logik", "Religionsphilosophie", "Ästhetik", "Sprachphilosophie"], "c": 1, "fb": "„Was darf ich hoffen?“ zielt auf Gott, Unsterblichkeit und Sinn – Kernthemen der <b>Religionsphilosophie</b>."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 1, "ty": "mc", "q": "In welcher Epoche wirkten Sokrates, Platon und Aristoteles?", "opts": ["Mittelalter", "Renaissance", "Antike", "Aufklärung"], "c": 2, "fb": "Die drei prägten die griechische <b>Antike</b> (5.–4. Jahrhundert v. Chr.) und damit die gesamte westliche Philosophie."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "mc", "q": "Welche Disziplin fragt, was Recht ist und wann Gesetze legitim sind?", "opts": ["Rechtsphilosophie", "Logik", "Erkenntnistheorie", "Ästhetik"], "c": 0, "fb": "Die <b>Rechtsphilosophie</b> untersucht Begriff, Geltung und Legitimität des Rechts – etwa im Streit zwischen Naturrecht und Rechtspositivismus."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "mc", "q": "Worin unterscheiden sich theoretische und praktische Philosophie?", "opts": ["Die theoretische fragt nach Erkennen und Sein, die praktische nach richtigem Handeln", "Die theoretische ist spekulativ, die praktische experimentell", "Die theoretische behandelt Texte, die praktische Diskussionen", "Die theoretische ist antik, die praktische modern"], "c": 0, "fb": "Klassische Einteilung: <b>theoretische Philosophie</b> (Metaphysik, Erkenntnistheorie, Logik) vs. <b>praktische Philosophie</b> (Ethik, politische Philosophie, Rechtsphilosophie)."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 3, "ty": "mc", "q": "Was unterscheidet philosophische Fragen typischerweise von einzelwissenschaftlichen?", "opts": ["Sie lassen sich nicht allein durch empirische Messung entscheiden, sondern verlangen Begriffs- und Argumentationsarbeit", "Sie sind grundsätzlich unbeantwortbar", "Sie betreffen nur historische Themen", "Sie benötigen keinerlei Bezug zur Erfahrung"], "c": 0, "fb": "Philosophie klärt <b>Grundbegriffe und Geltungsfragen</b> (Was ist Wissen? Was ist gerecht?), die Empirie voraussetzt, aber nicht selbst beantwortet."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 3, "ty": "mc", "q": "Unter welchem Titel wurden Aristoteles' logische Schriften später zusammengefasst?", "opts": ["Organon", "Kanon", "Corpus", "Enchiridion"], "c": 0, "fb": "<b>Organon</b> heißt wörtlich „Werkzeug“: Die Logik galt als Instrument aller Wissenschaften."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "mc", "q": "Platon unterscheidet bloße Meinung und echtes Wissen. Wie lauten die griechischen Begriffe?", "opts": ["Doxa und Episteme", "Ethos und Pathos", "Physis und Nomos", "Logos und Mythos"], "c": 0, "fb": "<b>Doxa</b> (Meinung) steht gegen <b>Episteme</b> (begründetes Wissen) – eine Grundunterscheidung der Erkenntnistheorie."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 1, "ty": "tf", "q": "Die Ästhetik beschäftigt sich ausschließlich mit Kunstwerken.", "a": false, "fb": "Sie umfasst auch <b>sinnliche Wahrnehmung</b> und das Naturschöne – nicht nur die Kunst."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "tf", "q": "Sprachphilosophie und Philosophie des Geistes zählen üblicherweise zur theoretischen Philosophie.", "a": true, "fb": "Beide fragen nach <b>Erkennen, Bedeutung und Sein</b>, nicht nach Normen des Handelns – daher theoretische Philosophie."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 1, "ty": "tf", "q": "Die angewandte Ethik (z. B. Medizin- oder Umweltethik) gehört zur theoretischen Philosophie.", "a": false, "fb": "Sie ist Teil der <b>praktischen Philosophie</b>: Sie überträgt ethische Prinzipien auf konkrete Handlungsfelder."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "flip", "front": "Die philosophische Lehre von den Werten heißt … .", "reveal": "Axiologie (Wertlehre) – sie untersucht Wesen, Arten und Rangordnung von Werten."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "flip", "front": "Die Disziplin, die über Verlauf, Sinn und Deutbarkeit der Geschichte nachdenkt, heißt … .", "reveal": "Geschichtsphilosophie – etwa bei Hegel, der die Geschichte als Fortschritt im Bewusstsein der Freiheit deutet."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "flip", "front": "Sokrates' Methode, durch geschicktes Fragen Erkenntnis „zu entbinden“, heißt … .", "reveal": "Mäeutik („Hebammenkunst“) – der Gefragte bringt die Einsicht selbst hervor, statt sie belehrt zu bekommen."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "order", "q": "Sortiere Kants vier berühmte Fragen in ihrer klassischen Reihenfolge.", "items": ["Was kann ich wissen?", "Was soll ich tun?", "Was darf ich hoffen?", "Was ist der Mensch?"], "fb": "So zählt Kant die Grundfragen der Philosophie auf; die vierte fasst nach ihm die ersten drei zusammen."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "match", "q": "Ordne Philosoph → Epoche zu.", "pairs": [["Platon", "Antike"], ["Thomas von Aquin", "Mittelalter"], ["Descartes", "Frühe Neuzeit"], ["Sartre", "20. Jahrhundert"]], "fb": "Antike, mittelalterliche Scholastik, frühneuzeitlicher Rationalismus und Existenzialismus des 20. Jahrhunderts."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 1, "ty": "odd", "q": "Welcher Begriff bezeichnet KEIN Teilgebiet der Philosophie?", "opts": ["Ontologie", "Astrologie", "Ästhetik", "Metaethik"], "c": 1, "fb": "Die <b>Astrologie</b> ist keine philosophische Disziplin; Ontologie, Ästhetik und Metaethik schon."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "odd", "q": "Welcher Denker gehört NICHT in die Antike?", "opts": ["Platon", "Aristoteles", "Epikur", "Thomas von Aquin"], "c": 3, "fb": "<b>Thomas von Aquin</b> (13. Jahrhundert) ist der große Systematiker des Mittelalters."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "multi", "q": "Welche Fragen sind typisch für die Erkenntnistheorie? (mehrere)", "opts": ["Was ist Wissen?", "Ist unsere Wahrnehmung verlässlich?", "Was ist gerecht?", "Gibt es angeborene Erkenntnisse?", "Was macht Kunst wertvoll?"], "c": [0, 1, 3], "fb": "Gerechtigkeit gehört zur praktischen Philosophie, Kunst zur Ästhetik; die übrigen Fragen sind <b>erkenntnistheoretisch</b>."}, {"track": "allg", "cat": "Ethik", "d": 1, "ty": "mc", "q": "Wie lautet die Grundformel von Kants kategorischem Imperativ?", "opts": ["Handle nur nach derjenigen Maxime, durch die du zugleich wollen kannst, dass sie ein allgemeines Gesetz werde", "Maximiere das Glück der größten Zahl", "Folge stets deinem Gewissen", "Handle so, wie es die Mehrheit erwartet"], "c": 0, "fb": "Die <b>Universalisierungsformel</b> prüft, ob sich der eigene Handlungsgrundsatz widerspruchsfrei verallgemeinern lässt."}, {"track": "allg", "cat": "Ethik", "d": 1, "ty": "mc", "q": "Worum geht es beim Trolley-Problem in seiner Grundform?", "opts": ["Ob man eine Weiche umstellen darf, sodass ein Mensch statt fünf stirbt", "Ob man Tiere essen darf", "Ob Strafen abschreckend wirken", "Ob Lügen erlaubt sind"], "c": 0, "fb": "Das <b>Trolley-Problem</b> (Philippa Foot, Judith Jarvis Thomson) testet Intuitionen über Töten, Sterbenlassen und das Abwägen von Leben."}, {"track": "allg", "cat": "Ethik", "d": 3, "ty": "mc", "q": "Was ändert die „Brücken-Variante“ (der dicke Mann) am Trolley-Problem?", "opts": ["Der Einzelne wird aktiv als Mittel benutzt, statt dass der Schaden nur umgelenkt wird", "Es sterben mehr Menschen", "Die Bahn fährt langsamer", "Es gibt keine Handlungsalternative"], "c": 0, "fb": "Die meisten lehnen das Hinabstoßen ab: Der Mann wird <b>bloß als Mittel</b> gebraucht – ein Kernpunkt deontologischer Kritik am reinen Folgenkalkül."}, {"track": "allg", "cat": "Ethik", "d": 1, "ty": "mc", "q": "Wer begründete den klassischen Utilitarismus und entwarf ein „hedonistisches Kalkül“?", "opts": ["Jeremy Bentham", "Immanuel Kant", "Aristoteles", "Thomas Hobbes"], "c": 0, "fb": "<b>Jeremy Bentham</b> (1748–1832) wollte Lust und Leid einer Handlung rechnerisch bilanzieren."}, {"track": "allg", "cat": "Ethik", "d": 2, "ty": "mc", "q": "Womit modifiziert John Stuart Mill den Utilitarismus Benthams?", "opts": ["Er unterscheidet höhere und niedere Freuden qualitativ", "Er verwirft das Glücksprinzip", "Er ersetzt Glück durch Pflicht", "Er beschränkt Moral auf Verträge"], "c": 0, "fb": "Mill: „Besser ein unzufriedener Sokrates als ein zufriedenes Schwein“ – die <b>Qualität</b> der Freuden zählt, nicht nur ihre Quantität."}, {"track": "allg", "cat": "Ethik", "d": 1, "ty": "mc", "q": "Wie heißt bei Aristoteles das Glück im Sinne eines gelingenden Lebens?", "opts": ["Eudaimonia", "Ataraxie", "Katharsis", "Hybris"], "c": 0, "fb": "<b>Eudaimonia</b> ist das Ziel des Lebens: Tätigkeit der Seele gemäß der Tugend."}, {"track": "allg", "ca g von Interessen</b> – auch der Interessen empfindungsfähiger Tiere."}, {"track": "allg", "cat": "Ethik", "d": 2, "ty": "tf", "q": "Nach Kant ist eine Notlüge erlaubt, wenn sie insgesamt gute Folgen hat.", "a": false, "fb": "Kant hält das Lügenverbot für <b>unbedingt</b>; gute Folgen können eine Pflichtverletzung nicht rechtfertigen."}, {"track": "allg", "cat": "Ethik", "d": 1, "ty": "tf", "q": "Der ethische Relativismus behauptet, moralische Normen gälten universell für alle Kulturen.", "a": false, "fb": "Genau umgekehrt: Er hält Moral für <b>kulturrelativ</b>; die Gegenposition heißt Universalismus."}, {"track": "allg", "cat": "Ethik", "d": 1, "ty": "tf", "q": "Die deskriptive Ethik beschreibt vorhandene Moralvorstellungen, ohne sie zu bewerten.", "a": true, "fb": "Sie arbeitet empirisch; die <b>normative Ethik</b> dagegen begründet, welche Normen gelten sollen."}, {"track": "allg", "cat": "Ethik", "d": 2, "ty": "flip", "front": "Kants Formel, den Menschen „niemals bloß als Mittel“ zu gebrauchen, heißt … .", "reveal": "Selbstzweckformel (Menschheitszweckformel) – jede Person ist Zweck an sich selbst und hat Würde statt eines Preises."}, {"track": "allg", "cat": "Ethik", "d": 3, "ty": "flip", "front": "Die metaethische Position, nach der Moralurteile nur Gefühle ausdrücken („Buh!“ / „Hurra!“), heißt … .", "reveal": "Emotivismus (A. J. Ayer, C. L. Stevenson) – Moralsätze sind danach weder wahr noch falsch."}, {"track": "allg", "cat": "Ethik", "d": 1, "ty": "flip", "front": "Das Feld der angewandten Ethik zu Fragen von Lebensbeginn und Lebensende heißt … .", "reveal": "Bioethik bzw. Medizinethik – etwa zu Abtreibung, Sterbehilfe und Organspende."}, {"track": "allg", "cat": "Ethik", "d": 2, "ty": "flip", "front": "Aristoteles' Tugend des klugen praktischen Überlegens heißt griechisch … .", "reveal": "Phronesis (praktische Weisheit) – sie findet im Einzelfall das rechte Maß des Handelns."}, {"track": "allg", "cat": "Ethik", "d": 1, "ty": "flip", "front": "„Was du nicht mente sind grundsätzlich überflüssig", "Theorien sind wörtliche Abbilder der Natur", "Messgeräte sind immer zuverlässig"], "c": 0, "fb": "Scheitert eine Vorhersage, kann statt der Haupthypothese auch eine <b>Hilfsannahme</b> falsch sein – das erschwert eindeutige Falsifikation."}, {"track": "allg", "cat": "Wissenschaftstheorie", "d": 2, "ty": "mc", "q": "Welches Beispiel steht klassisch dafür, dass viele Bestätigungen ein Allgesetz nicht beweisen?", "opts": ["Der schwarze Schwan", "Der Laplacesche Dämon", "Schrödingers Katze", "Das Foucaultsche Pendel"], "c": 0, "fb": "Noch so viele weiße Schwäne beweisen nicht „Alle Schwäne sind weiß“ – ein einziger <b>schwarzer Schwan</b> widerlegt den Satz."}, {"track": "allg", "cat": "Wissenschaftstheorie", "d": 3, "ty": "mc", "q": "Was bezeichnet Imre Lakatos als „harten Kern“ eines Forschungsprogramms?", "opts": ["Die Grundannahmen, die durch einen Schutzgürtel von Hilfshypothesen abgeschirmt werden", "Die teuerste Laborausstattung", "Die älteste Publikation", "Die mathematische Notation"], "c": 0, "fb": "Lakatos vermittelt zwischen Popper und Kuhn: Programme sind <b>progressiv</b>, wenn sie neue Tatsachen vorhersagen, sonst degenerativ."}, {"track": "allg", "cat": "Wissenschaftstheorie", "d": 2, "ty": "mc", "q": "Wie heißt der Schluss auf die beste Erklärung?", "opts": ["Abduktion", "Deduktion", "Subsumtion", "Extrapolation"], "c": 0, "fb": "Die <b>Abduktion</b> (Peirce) wählt unter konkurrierenden Hypothesen diejenige, die den Befund am besten erklärt."}, {"track": "allg", "cat": "Wissenschaftstheorie", "d": 2, "ty": "mc", "q": "Wie nennt Kuhn die Forschung innerhalb eines etablierten Paradigmas?", "opts": ["Normale Wissenschaft", "Revolutionäre Wissenschaft", "Protowissenschaft", "Pseudowissenschaft"], "c": 0, "fb": "<b>Normale Wissenschaft</b> ist für Kuhn „Rätsellösen“ im Rahmen anerkannter Regeln – bis sich Anomalien häufen."}, {"track": "allg", "cat": "Wissenschaftstheorie", "d": 1, "ty": "tf", "q": "Nach Popper kann ei
