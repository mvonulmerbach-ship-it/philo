zu.", "pairs": [["Popper", "Falsifikationismus"], ["Kuhn", "Paradigmen und Revolutionen"], ["Lakatos", "Forschungsprogramme"], ["Feyerabend", "Anything goes"]], "fb": "Vier Klassiker der Wissenschaftstheorie des 20. Jahrhunderts."}, {"track": "allg", "cat": "Wissenschaftstheorie", "d": 2, "ty": "odd", "q": "Welcher Begriff stammt NICHT von Thomas Kuhn?", "opts": ["Paradigma", "Normale Wissenschaft", "Anomalie", "Schutzgürtel"], "c": 3, "fb": "Der <b>Schutzgürtel</b> von Hilfshypothesen gehört zu Lakatos' Theorie der Forschungsprogramme."}, {"track": "allg", "cat": "Wissenschaftstheorie", "d": 3, "ty": "multi", "q": "Welche Aussagen zum Induktionsproblem treffen zu? (mehrere)", "opts": ["Es geht auf David Hume zurück", "Deduktive Schlüsse sind genauso betroffen", "Die Rechtfertigung der Induktion durch ihren bisherigen Erfolg wäre zirkulär", "Popper wollte es umgehen: Wissenschaft prüft deduktiv, statt induktiv zu beweisen", "Die moderne Statistik hat es endgültig gelöst"], "c": [0, 2, 3], "fb": "Humes Problem: Dass die Zukunft der Vergangenheit gleicht, lässt sich <b>nicht ohne Zirkel</b> begründen; Deduktion ist davon nicht betroffen, und gelöst ist das Problem bis heute nicht."}, {"track": "allg", "cat": "Wissenschaftstheorie", "d": 2, "ty": "recall", "prompt": "Erkläre den Unterschied zwischen Verifikation und Falsifikation und warum Popper auf Falsifikation setzt.", "hint": "Asymmetrie bei Allaussagen", "model": "Verifikation hieße, eine Theorie durch Beobachtungen als wahr zu erweisen; Falsifikation heißt, sie durch ein Gegenbeispiel zu widerlegen. Allaussagen wie „Alle Schwäne sind weiß“ lassen sich durch endlich viele Beobachtungen nie verifizieren, wohl aber durch eine einzige Gegeninstanz falsifizieren. Wegen dieser logischen Asymmetrie soll Wissenschaft nach Popper Theorien scharfen Widerlegungsversuchen aussetzen; was standhält, gilt als bewährt, nicht als bewiesen."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 3, "ty": "mc", "q": "Wie analysiert Russell den Satz „Der gegenwärtige König von Frankreich ist kahl“?", "opts": ["Er ist falsch, weil die enthaltene Existenzbehauptung falsch ist", "Er ist sinnlos", "Er ist wahr", "Er ist weder wahr noch falsch, weil grammatisch fehlerhaft"], "c": 0, "fb": "Nach Russells <b>Kennzeichnungstheorie</b> behauptet der Satz unter anderem, dass es genau einen König von Frankreich gibt – das ist falsch, also ist der ganze Satz falsch."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 2, "ty": "mc", "q": "Was ist eine konversationelle Implikatur nach Grice?", "opts": ["Etwas, das mitgemeint wird, ohne wörtlich gesagt zu sein", "Ein grammatischer Fehler", "Eine logische Tautologie", "Ein Versprecher"], "c": 0, "fb": "Grices Beispiel: „Er hat eine schöne Handschrift“ im Empfehlungsschreiben <b>implikiert</b>, dass der Kandidat fachlich wenig taugt – erschlossen über das Kooperationsprinzip."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 1, "ty": "mc", "q": "Der späte Wittgenstein: „Die Bedeutung eines Wortes ist …", "opts": ["sein Gebrauch in der Sprache", "sein Klang", "seine Etymologie", "das innere Bild im Kopf"], "c": 0, "fb": "Die <b>Gebrauchstheorie</b> der Bedeutung aus den Philosophischen Untersuchungen (§ 43)."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 2, "ty": "mc", "q": "Was sind Eigennamen nach Saul Kripke?", "opts": ["Starre Designatoren, die in allen möglichen Welten dasselbe bezeichnen", "Abkürzungen für Bündel von Beschreibungen", "Bloße Schallwörter ohne Bezug", "Synonyme für Kennzeichnungen"], "c": 0, "fb": "In <b>„Name und Notwendigkeit“</b> kritisiert Kripke die Beschreibungstheorie: „Aristoteles“ bezeichnet denselben Mann auch in Welten, in denen er nie Philosoph wurde."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 1, "ty": "mc", "q": "Der Standesbeamte sagt: „Hiermit erkläre ich Sie zu Eheleuten.“ Was für eine Äußerung ist das?", "opts": ["Eine performative Äußerung, die eine Handlung vollzieht", "Eine bloße Beschreibung", "Eine Vermutung", "Eine Frage"], "c": 0, "fb": "<b>Performative</b> Äußerungen (Austin) beschreiben nichts, sie tun etwas – hier: den Vollzug der Eheschließung."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 2, "ty": "tf", "q": "Nach Grice beruht gelingende Kommunikation auf einem Kooperationsprinzip mit Maximen wie Wahrhaftigkeit und Relevanz.", "a": true, "fb": "Aus der erkennbaren Verletzung dieser <b>Maximen</b> erschließen Hörer konversationelle Implikaturen."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 2, "ty": "tf", "q": "Der frühe Wittgenstein (Tractatus) und der späte Wittgenstein (Philosophische Untersuchungen) vertreten dieselbe Bedeutungstheorie.", "a": false, "fb": "Der Tractatus vertritt eine <b>Abbildtheorie</b> (Sätze als Bilder von Sachverhalten), das Spätwerk eine Gebrauchstheorie."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 2, "ty": "flip", "front": "Austins Begriff für das, was wir mit einer Äußerung tun (warnen, versprechen, befehlen), lautet: … Akt.", "reveal": "Illokutionärer Akt – neben der Lokution (das Sagen selbst) und der Perlokution (die beim Hörer bewirkte Folge)."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 2, "ty": "flip", "front": "Wittgensteins Begriff für die regelgeleiteten, in Lebensformen eingebetteten Verwendungsweisen der Sprache: … .", "reveal": "Sprachspiel – Sprechen ist Teil einer Tätigkeit; Bedeutung zeigt sich im Spiel, nicht in einer festen Definition."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 2, "ty": "match", "q": "Ordne die sprachphilosophische Idee ihrem Urheber zu.", "pairs": [["Theorie der Kennzeichnungen", "Bertrand Russell"], ["Sprechakttheorie", "John L. Austin"], ["Konversationsmaximen", "Paul Grice"], ["Starre Designatoren", "Saul Kripke"]], "fb": "Vier Meilensteine der analytischen Sprachphilosophie."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 1, "ty": "odd", "q": "Welcher Begriff stammt NICHT aus der Sprechakttheorie?", "opts": ["Lokution", "Illokution", "Perlokution", "Paradigma"], "c": 3, "fb": "<b>Paradigma</b> gehört zu Kuhns Wissenschaftstheorie; die drei anderen bezeichnen Aspekte von Sprechakten."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 2, "ty": "multi", "q": "Welche gehören zu Grice' Konversationsmaximen? (mehrere)", "opts": ["Quantität (so informativ wie nötig)", "Qualität (nichts Falsches behaupten)", "Relation (sei relevant)", "Falsifizierbarkeit", "Modalität (sei klar und geordnet)"], "c": [0, 1, 2, 4], "fb": "<b>Falsifizierbarkeit</b> ist Poppers Kriterium; Grice nennt Quantität, Qualität, Relation und Modalität."}, {"track": "allg", "cat": "Sprachphilosophie", "d": 3, "ty": "recall", "prompt": "Erkläre den Unterschied zwischen der Abbildtheorie des Tractatus und der Gebrauchstheorie des späten Wittgenstein.", "hint": "Bild der Wirklichkeit vs. Sprachspiel", "model": "Im Tractatus sind sinnvolle Sätze logische Bilder möglicher Sachverhalte: Die Struktur des Satzes bildet die Struktur der Welt ab, Bedeutung ist Abbildbeziehung. Der späte Wittgenstein verwirft dieses Ideal: Die Bedeutung eines Wortes liegt in seinem Gebrauch innerhalb vielfältiger Sprachspiele, die in Lebensformen eingebettet sind. Statt einer einzigen Wesenslogik der Sprache gibt es viele regelgeleitete Praktiken (befehlen, danken, grüßen), die nur Familienähnlichkeiten verbinden."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 2, "ty": "mc", "q": "Was soll Searles Gedankenexperiment vom Chinesischen Zimmer zeigen?", "opts": ["Dass reine Symbolmanipulation (Syntax) kein Verstehen (Semantik) erzeugt", "Dass Chinesisch besonders schwer ist", "Dass Computer schneller rechnen als Menschen", "Dass Übersetzung unmöglich ist"], "c": 0, "fb": "Die Person im Zimmer folgt nur Regeln und versteht nichts – ein Einwand gegen die These der <b>starken KI</b>, wonach ein passend programmierter Computer buchstäblich versteht."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 1, "ty": "mc", "q": "Was prüft der Turing-Test?", "opts": ["Ob eine Maschine im Dialog nicht von einem Menschen zu unterscheiden ist", "Ob ein Computer schnell rechnet", "Ob ein Roboter laufen kann", "Ob ein Programm fehlerfrei ist"], "c": 0, "fb": "Turing (1950) ersetzte die Frage „Können Maschinen denken?“ durch das <b>Imitationsspiel</b>: Ununterscheidbarkeit im Dialog als Kriterium."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 2, "ty": "mc", "q": "Was besagt der Funktionalismus in der Philosophie des Geistes?", "opts": ["Mentale Zustände sind durch ihre kausale Rolle definiert, nicht durch ihr Trägermaterial", "Nur Gehirne können Geist haben", "Geist ist eine immaterielle Substanz", "Mentale Begriffe sind wissenschaftlich wertlos"], "c": 0, "fb": "Schmerz ist danach das, was Schmerz <b>tut</b> (typische Ursachen und Wirkungen) – gleichgültig, ob in Neuronen oder Chips realisiert."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 2, "ty": "mc", "q": "Was sind „philosophische Zombies“ in Chalmers' Argument?", "opts": ["Wesen, die physisch und im Verhalten identisch mit uns sind, aber kein bewusstes Erleben haben", "Untote aus Horrorfilmen", "Menschen ohne Gedächtnis", "Roboter mit Gefühlen"], "c": 0, "fb": "Wenn Zombies <b>denkbar</b> sind, folgt das Bewusstsein nicht logisch aus den physischen Tatsachen – ein Argument gegen den Physikalismus."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 3, "ty": "mc", "q": "Worauf zielt Frank Jacksons Gedankenexperiment von „Mary, der Farbforscherin“?", "opts": ["Mary kennt alle physikalischen Fakten über Farben, lernt aber beim ersten Farbsehen etwas Neues – gegen den Physikalismus", "Frauen sehen Farben besser", "Farbenblindheit ist heilbar", "Farben existieren nicht objektiv"], "c": 0, "fb": "Das <b>Wissensargument</b>: Wenn Mary etwas Neues lernt, gibt es Erlebnistatsachen (Qualia), die nicht in physikalischem Wissen aufgehen."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 1, "ty": "mc", "q": "Was bezeichnet der Begriff „Qualia“?", "opts": ["Die subjektiven Erlebnisqualitäten – wie es sich anfühlt, etwas zu erleben", "Die Qualität wissenschaftlicher Daten", "Neuronale Messwerte", "Angeborene Verhaltensmuster"], "c": 0, "fb": "<b>Qualia</b>: das Rot-Erleben, der Schmerz, der Geschmack von Kaffee – der phänomenale Gehalt des Bewusstseins."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 3, "ty": "mc", "q": "Was behauptet der Epiphänomenalismus?", "opts": ["Mentale Zustände werden von physischen verursacht, haben selbst aber keine kausale Wirkung", "Der Geist steuert den Körper vollständig", "Es gibt keine mentalen Zustände", "Körper und Geist wechselwirken ständig"], "c": 0, "fb": "Bewusstsein wäre danach ein bloßes <b>Begleitphänomen</b> – wie der Pfiff der Lokomotive, der den Zug nicht antreibt."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 1, "ty": "tf", "q": "Die Identitätstheorie behauptet, mentale Zustände seien nichts anderes als Gehirnzustände.", "a": true, "fb": "Klassische Formel: Schmerz = Reizung bestimmter Nervenfasern (<b>Typen-Identität</b>, Place/Smart)."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 2, "ty": "tf", "q": "Thomas Nagel argumentiert in „What is it like to be a bat?“, dass die subjektive Perspektive des Erlebens jeder rein objektiven Beschreibung entgeht.", "a": true, "fb": "Selbst vollständiges Wissen über das Fledermaus-Sonar sagt uns nicht, <b>wie es ist</b>, eine Fledermaus zu sein."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 2, "ty": "tf", "q": "Der Funktionalismus schließt aus, dass Maschinen jemals mentale Zustände haben könnten.", "a": false, "fb": "Im Gegenteil: Wegen der <b>multiplen Realisierbarkeit</b> könnten auch nicht-biologische Systeme die passenden funktionalen Rollen besetzen."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 2, "ty": "flip", "front": "Die These, dass derselbe mentale Zustand in verschiedenen Substraten (Gehirn, Chip, fremde Physiologie) verwirklicht sein kann, heißt … .", "reveal": "Multiple Realisierbarkeit (Putnam) – ein zentrales Argument für den Funktionalismus und gegen die Typen-Identitätstheorie."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 1, "ty": "flip", "front": "Descartes' berühmter Satz, mit dem er das eigene Denken als unbezweifelbar erweist: … .", "reveal": "„Cogito ergo sum“ – ich denke, also bin ich; Ausgangspunkt seines Dualismus von denkender und ausgedehnter Substanz."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 2, "ty": "match", "q": "Ordne die Position zum Leib-Seele-Problem ihrer Kernthese zu.", "pairs": [["Substanzdualismus", "Geist und Körper sind zwei verschiedene Substanzen"], ["Identitätstheorie", "Mentale Zustände sind Gehirnzustände"], ["Funktionalismus", "Mentale Zustände sind durch kausale Rollen bestimmt"], ["Eliminativer Materialismus", "Begriffe wie „Glaube“ und „Wunsch“ sind wissenschaftlich zu verwerfen"]], "fb": "Von Descartes über Smart und Putnam bis zu den Churchlands."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 2, "ty": "order", "q": "Sortiere die Stationen der Debatte um Geist und Maschine chronologisch.", "items": ["Descartes begründet den Substanzdualismus (17. Jahrhundert)", "Turing schlägt das Imitationsspiel vor (1950)", "Putnam entwickelt den Funktionalismus (1960er)", "Chalmers formuliert das „schwere Problem des Bewusstseins“ (1990er)"], "fb": "Vom neuzeitlichen Dualismus bis zur heutigen Bewusstseinsdebatte."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 1, "ty": "odd", "q": "Welcher Begriff gehört NICHT zur Bewusstseinsdebatte?", "opts": ["Qualia", "Zombie-Argument", "Wissensargument", "Rabenparadox"], "c": 3, "fb": "Das <b>Rabenparadox</b> gehört zur Wissenschaftstheorie (Bestätigungstheorie), nicht zur Philosophie des Geistes."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 3, "ty": "odd", "q": "Welche Position ist KEINE monistische Antwort auf das Leib-Seele-Problem?", "opts": ["Identitätstheorie", "Eliminativer Materialismus", "Berkeleys Idealismus", "Substanzdualismus"], "c": 3, "fb": "Der <b>Substanzdualismus</b> nimmt zwei Substanzen an; Materialismus und Idealismus kennen dagegen nur je eine."}, {"track": "allg", "cat": "Philosophie des Geistes", "d": 2, "ty": "multi", "q": "Welche Aussagen zum Chinesischen Zimmer treffen zu? (mehrere)", "opts": ["Es stammt von John Searle", "Es richtet sich gegen die These der „starken KI“", "Die Person im Zimmer versteht am Ende Chinesisch", "Es beruht auf der Unterscheidung von Syntax und Semantik", "Es soll beweisen, dass Computer nicht rechnen können"], "c": [0, 1, 3], "fb": "Searle bestreitet nicht die Rechenleistung, sondern dass bloßes <b>Regelbefolgen</b> Verstehen erzeugt."}]</script>

<script id="thinker-intros" type="application/json">{"Nassim Taleb": {"name": "Nassim Nicholas Taleb", "years": "geb. 1960", "tag": "„Der Schwarze Schwan“ (2007), „Antifragilität“ (2012)", "summary": "Der libanesisch-amerikanische Essayist und ehemalige Börsenhändler untersucht, wie seltene, unvorhersehbare Ereignisse – „Schwarze Schwäne“ – Geschichte und Märkte prägen. Er warnt vor der Anmaßung von Prognosen, entlarvt Denkfehler wie das Truthahn-Problem und den Survivorship Bias und fordert „Skin in the Game“: Wer entscheidet, soll die Risiken selbst tragen. Sein Begriff der Antifragilität beschreibt Systeme, die durch Stress und Unordnung sogar stärker werden."}, "Surowiecki": {"name": "James Surowiecki", "years": "geb. 1967", "tag": "„Die Weisheit der Vielen“ (2004)", "summary": "Der amerikanische Wirtschaftsjournalist zeigt anhand von Beispielen wie Galtons Ochsen-Schätzung, dass Gruppen unter bestimmten Bedingungen klüger urteilen als einzelne Experten. Voraussetzung sind Meinungsvielfalt, Unabhängigkeit der Urteile, Dezentralität und ein guter Aggregationsmechanismus. Zugleich warnt er: Herdenverhalten und Konformitätsdruck zerstören diese kollektive Intelligenz."}, "Epiktet & Stoa": {"name": "Epiktet", "years": "ca. 50–135 n. Chr.", "tag": "„Encheiridion“ (Handbüchlein der Moral)", "summary": "Der ehemalige Sklave wurde zu einem der einflussreichsten Lehrer der späten Stoa. Sein Kerngedanke ist die Dichotomie der Kontrolle: Unterscheide, was in deiner Macht steht (Urteile, Handlungen) und was nicht (Ruf, Besitz, Körper). Da uns nicht die Dinge selbst, sondern unsere Urteile über sie beunruhigen, ist Gelassenheit durch richtiges Denken erreichbar – eine Lebenskunst, die bis heute nachwirkt."}, "Viktor Frankl": {"name": "Viktor E. Frankl", "years": "1905–1997", "tag": "„… trotzdem Ja zum Leben sagen“ (1946)", "summary": "Der Wiener Psychiater und KZ-Überlebende begründete die Logotherapie, die den „Willen zum Sinn“ als zentrale Triebkraft des Menschen sieht. Selbst im extremsten Leid bleibe dem Menschen die „letzte Freiheit“: die Wahl der eigenen Haltung zum Schicksal. Sinn findet man nach Frankl auf drei Wegen – durch Schaffen, durch Erleben und Lieben sowie durch die Einstellung zum unabänderlichen Leid."}, "J. S. Mill": {"name": "John Stuart Mill", "years": "1806–1873", "tag": "„Über die Freiheit“ (1859), „Der Utilitarismus“ (1861)", "summary": "Der britische Philosoph und Ökonom ist ein Klassiker des Liberalismus. Sein Schadensprinzip erlaubt Eingriffe in die Freiheit nur zum Schutz anderer; die Meinungsfreiheit verteidigt er selbst für falsche Ansichten, weil Widerspruch die Wahrheit schärft. Zugleich warnt er vor der „Tyrannei der Mehrheit“ und verfeinert Benthams Utilitarismus durch die Unterscheidung höherer und niederer Freuden."}, "Michael Sandel": {"name": "Michael J. Sandel", "years": "geb. 1953", "tag": "„Vom Ende des Gemeinwohls“ (The Tyranny of Merit, 2020)", "summary": "Der Harvard-Philosoph kritisiert die Meritokratie: Der Glaube, Erfolg sei rein selbstverdient, erzeugt Hybris bei den Gewinnern und Demütigung bei den Verlierern. Da Erfolg stark von Glück, Herkunft und unverdientem Talent abhängt, plädiert Sandel für mehr Demut, eine Aufwertung der Würde der Arbeit und einen neuen Sinn für das Gemeinwohl."}, "Epikur": {"name": "Epikur", "years": "341–270 v. Chr.", "tag": "„Brief an Menoikeus“, „Tetrapharmakon“", "summary": "Der griechische Philosoph lehrte in seinem „Garten“ eine oft missverstandene Lustethik: Höchstes Gut ist die Lust – verstanden als Schmerzfreiheit und Seelenruhe (Ataraxia), nicht als Maßlosigkeit. Er unterscheidet natürliche und nichtige Begierden und rät, Ruhm und Luxus zu meiden. Sein berühmtes Todesargument soll die Todesfurcht auflösen: Solange wir sind, ist der Tod nicht da – und umgekehrt."}, "C. S. Lewis": {"name": "Clive Staples Lewis", "years": "1898–1963", "tag": "„Pardon, ich bin Christ“ (Mere Christianity, 1952)", "summary": "Der Oxforder Literaturwissenschaftler wurde als christlicher Apologet und Autor der „Chroniken von Narnia“ weltberühmt. In „Mere Christianity“ entwickelt er das Argument aus der Moral: Das geteilte Bewusstsein eines objektiven Moralgesetzes deute auf einen moralischen Urheber jenseits der Natur hin. Lewis verbindet klare Sprache mit dem Anspruch, den Glauben vernünftig zu begründen."}, "Hayek": {"name": "Friedrich August von Hayek", "years": "1899–1992", "tag": "„Der Weg zur Knechtschaft“ (1944)", "summary": "Der österreichische Ökonom und Sozialphilosoph (Wirtschaftsnobelpreis 1974) kritisiert die „Anmaßung von Wissen“: Keine zentrale Planungsinstanz kann das über unzählige Individuen verstreute Wissen der Gesellschaft bündeln. Der Markt koordiniert dieses Wissen dezentral über Preise als Informationssignale. Ordnungen wie Sprache und Markt versteht Hayek als spontan gewachsen (Kosmos), nicht als bewusst gemacht (Taxis)."}, "Wittgenstein": {"name": "Ludwig Wittgenstein", "years": "1889–1951", "tag": "„Tractatus logico-philosophicus“ (1921), „Philosophische Untersuchungen“ (1953)", "summary": "Der Wiener Philosoph prägte die Sprachphilosophie des 20. Jahrhunderts gleich zweimal: Der frühe Tractatus vertritt eine Abbildtheorie, nach der Sätze mögliche Sachverhalte der Welt abbilden. Der späte Wittgenstein erklärt Bedeutung dagegen durch den Gebrauch in „Sprachspielen“, die in Lebensformen eingebettet sind. Sein Privatsprachenargument zeigt: Bedeutung setzt eine öffentliche, regelgeleitete Praxis voraus."}, "Hannah Arendt": {"name": "Hannah Arendt", "years": "1906–1975", "tag": "„Vita activa“ (1958), „Eichmann in Jerusalem“ (1963)", "summary": "Die deutsch-amerikanische politische Denkerin unterscheidet in „Vita activa“ drei Grundtätigkeiten: Arbeiten, Herstellen und Handeln. Das Handeln im öffentlichen Raum der Pluralität ermöglicht Neuanfänge – Arendts Begriff der Natalität. Macht entsteht für sie aus dem gemeinsamen Handeln Vieler und ist der Gegensatz zur Gewalt; mit der „Banalität des Bösen“ prägte sie eine der umstrittensten Formeln des 20. Jahrhunderts."}, "Spinoza": {"name": "Baruch de Spinoza", "years": "1632–1677", "tag": "„Ethik“ (1677, more geometrico)", "summary": "Der niederländische Philosoph entwarf in seiner nach geometrischer Methode aufgebauten „Ethik“ einen radikalen Substanzmonismus: Es gibt nur eine Substanz – „Deus sive Natura“, Gott oder die Natur. Denken und Ausdehnung sind bloß zwei ihrer Attribute. Freiheit ist für Spinoza nicht Willkür, sondern Einsicht in die Notwendigkeit; höchstes Glück gewährt die „intellektuelle Liebe zu Gott“ durch adäquate Erkenntnis."}, "Marc Aurel": {"name": "Marc Aurel", "years": "121–180 n. Chr.", "tag": "„Selbstbetrachtungen“", "summary": "Der römische Kaiser gilt als „Philosophenkaiser“ der späten Stoa. Seine „Selbstbetrachtungen“ sind persönliche Notizen, in denen er sich stoische Grundhaltungen einschärft: Akzeptanz des Schicksals, Konzentration auf die eigene Tugend und Pflicht, Gelassenheit gegenüber Äußerem und der Vergänglichkeit. Das Werk zählt bis heute zu den meistgelesenen Texten praktischer Lebensphilosophie."}, "Aristoteles": {"name": "Aristoteles", "years": "384–322 v. Chr.", "tag": "„Nikomachische Ethik“, „Politik“", "summary": "Der Schüler Platons und Lehrer Alexanders des Großen begründete die Tugendethik: Ziel des Handelns ist die Eudaimonia, das gelingende Leben durch tugendhafte Tätigkeit der Vernunft. Tugend ist die Mitte zwischen Extremen (Mesotes), praktische Klugheit (Phronesis) findet im Einzelfall das rechte Maß. Als „zoon politikon“ verwirklicht sich der Mensch erst in der Gemeinschaft der Polis; die höchste Freundschaft beruht auf Tugend."}, "Putnam (Sozialkapital)": {"name": "Robert D. Putnam", "years": "geb. 1941", "tag": "„Bowling Alone“ (2000)", "summary": "Der Harvard-Politikwissenschaftler machte den Begriff des Sozialkapitals bekannt: Netzwerke, Normen und Vertrauen, die Kooperation in einer Gesellschaft ermöglichen. In „Bowling Alone“ diagnostiziert er einen dramatischen Rückgang des bürgerschaftlichen Engagements in den USA. Wichtig ist seine Unterscheidung von „bonding“ (bindendem) Sozialkapital innerhalb homogener Gruppen und „bridging“ (überbrückendem), das über Gruppengrenzen hinweg verbindet."}, "Veblen": {"name": "Thorstein Veblen", "years": "1857–1929", "tag": "„Die Theorie der feinen Leute“ (1899)", "summary": "Der amerikanische Ökonom und Soziologe analysierte die „müßige Klasse“ und prägte den Begriff des demonstrativen Konsums: Güter werden gekauft, um Reichtum und Status sichtbar vorzuführen. Nach ihm sind „Veblen-Güter“ benannt, deren Nachfrage steigt, wenn der Preis steigt – weil der hohe Preis selbst zum Statussymbol wird. Seine Konsumkritik ist bis heute aktuell."}, "Byung-Chul Han": {"name": "Byung-Chul Han", "years": "geb. 1959", "tag": "„Müdigkeitsgesellschaft“ (2010), „Transparenzgesellschaft“ (2012)", "summary": "Der in Seoul geborene Berliner Philosoph deutet die Gegenwart als Leistungsgesellschaft, in der an die Stelle von Verboten und Fremdzwang der Imperativ „Du kannst“ getreten ist: Das Leistungssubjekt beutet sich freiwillig selbst aus – mit Burnout und Depression als Folgen. In der digitalen „Transparenzgesellschaft“ sieht Han den Verlust von Distanz, Geheimnis und Vertrauen als neue Form der Kontrolle."}, "Hartmut Rosa": {"name": "Hartmut Rosa", "years": "geb. 1965", "tag": "„Beschleunigung“ (2005), „Resonanz“ (2016)", "summary": "Der Jenaer Soziologe diagnostiziert die soziale Beschleunigung als Grundproblem der Moderne: Ständige Steigerung führt zur Entfremdung, einer stummen Weltbeziehung. Als Gegenbild entwirft Rosa die Resonanz – eine antwortende, berührbare Beziehung zur Welt, die sich nicht erzwingen lässt. Er unterscheidet horizontale (soziale), diagonale (materiale) und vertikale (existenzielle) Resonanzachsen."}, "Tocqueville": {"name": "Alexis de Tocqueville", "years": "1805–1859", "tag": "„Über die Demokratie in Amerika“ (1835/1840)", "summary": "Der französische Aristokrat und Politikdenker analysierte auf seiner Amerikareise die junge Demokratie mit scharfem Blick. Er warnt vor einem „sanften Despotismus“: Die Leidenschaft für Gleichheit kann in Konformismus und einen bevormundenden Staat münden und so die Freiheit gefährden. Freiwillige Vereinigungen sind für ihn eine Schule der Freiheit; im „wohlverstandenen Eigeninteresse“ verbinden sich Eigennutz und Gemeinsinn."}, "Nozick": {"name": "Robert Nozick", "years": "1938–2002", "tag": "„Anarchie, Staat, Utopie“ (1974)", "summary": "Der Harvard-Philosoph ist der wichtigste libertäre Gegenspieler von Rawls. Seine Anspruchstheorie der Gerechtigkeit hält Verteilungen für gerecht, wenn sie durch rechtmäßigen Erwerb und freiwilligen Tausch entstanden sind – erzwungene Umverteilung verletzt individuelle Rechte, wie das Wilt-Chamberlain-Beispiel zeigt. Sein Gedankenexperiment der Erlebnismaschine argumentiert gegen den Hedonismus: Wir wollen mehr als angenehme Erlebnisse, nämlich wirkliches Tun und Kontakt zur Realität."}, "Stoa": {"name": "Die Stoa", "years": "ca. 300 v. Chr. – 180 n. Chr.", "tag": "Zenon von Kition, Seneca, Epiktet, Marc Aurel", "summary": "Die von Zenon in Athen begründete Schule lehrt ein Leben im Einklang mit der vernünftigen Naturordnung. Allein die Tugend ist gut, alles Äußere wie Gesundheit oder Reichtum ist „indifferent“ (Adiaphora) – daher kann Äußeres die Glückseligkeit nicht antasten. Zentral sind die Unterscheidung dessen, was in unserer Macht steht, die Seelenruhe (Apatheia) und die Oikeiosis: die natürliche Zuwendung, die sich vom Selbst auf die ganze Menschheit ausweitet."}, "Sokrates/Platon": {"name": "Sokrates & Platon", "years": "469–399 / 428–348 v. Chr.", "tag": "Platons Dialoge, u. a. „Politeia“", "summary": "Sokrates, der selbst nichts Schriftliches hinterließ, machte das prüfende Gespräch zur Methode der Philosophie und wurde 399 v. Chr. zum Tode verurteilt. Sein Schüler Platon überlieferte ihn in Dialogen und baute auf ihm seine Ideenlehre auf. Zum Kernbestand gehört das sokratische Paradox: Niemand tut freiwillig Böses – Unrecht beruht auf mangelnder Einsicht, weshalb Wissen und Selbstprüfung der Weg zur Tugend sind."}, "Kant": {"name": "Immanuel Kant", "years": "1724–1804", "tag": "„Kritik der reinen Vernunft“ (1781)", "summary": "Der Königsberger Philosoph vollzog die „kopernikanische Wende“ der Erkenntnistheorie: Erkenntnis beginnt mit der Erfahrung, entspringt aber nicht ganz aus ihr – Raum und Zeit sind Anschauungsformen a priori, die Kategorien strukturieren die Erfahrung, das Ding an sich bleibt unerkennbar. In der Ethik gilt der kategorische Imperativ unbedingt, im Unterschied zu bloß hypothetischen Imperativen. Kant prägt die Philosophie bis heute wie kaum ein anderer."}, "Hegel": {"name": "Georg Wilhelm Friedrich Hegel", "years": "1770–1831", "tag": "„Phänomenologie des Geistes“ (1807)", "summary": "Der Hauptvertreter des deutschen Idealismus denkt Wirklichkeit und Geschichte als dialektische Bewegung: These und Gegensatz werden „aufgehoben“ – zugleich negiert, bewahrt und auf eine höhere Stufe gehoben. In der berühmten Herr-Knecht-Dialektik gewinnt der Knecht durch seine formende Arbeit paradoxerweise das höhere Selbstbewusstsein. Die Geschichte deutet Hegel als Entfaltung des Weltgeists – als Fortschritt im Bewusstsein der Freiheit."}, "Nietzsche": {"name": "Friedrich Nietzsche", "years": "1844–1900", "tag": "„Also sprach Zarathustra“ (1883–1885)", "summary": "Der radikale Kritiker der Moral und Metaphysik diagnostiziert mit „Gott ist tot“ den Verlust verbindlicher Wertfundamente in der Moderne – und die Gefahr des Nihilismus. Als treibende Grundkraft des Lebens sieht er den „Willen zur Macht“. Sein Gedankenexperiment der ewigen Wiederkunft dient als Prüfstein der Lebensbejahung: Kannst du dein Leben so bejahen (amor fati), dass du es unendlich oft wiederholen wolltest?"}, "Camus": {"name": "Albert Camus", "years": "1913–1960", "tag": "„Der Mythos des Sisyphos“ (1942)", "summary": "Der französische Schriftsteller und Philosoph (Literaturnobelpreis 1957) denkt das Absurde: den Zusammenstoß unseres Sinnverlangens mit einer stummen Welt. Weder Selbstmord noch der religiöse „Sprung“ sind für ihn die richtige Antwort, sondern die hellsichtige Revolte – die trotzige Bejahung des Lebens ohne Illusion. Sein berühmter Schluss: „Wir müssen uns Sisyphos als einen glücklichen Menschen vorstellen.“"}, "Antike": {"name": "Antike Philosophie", "years": "ca. 600 v. Chr. – 300 n. Chr.", "tag": "Sokrates, Platon, Aristoteles, Epikur, Stoa", "summary": "Im antiken Griechenland entstand die Philosophie als eigenständiges, vernunftgeleitetes Fragen nach Welt, Wahrheit und gutem Leben. Von Sokrates' Tod (399 v. Chr.) über Platons „Politeia“ und Aristoteles' Ethik bis zu den hellenistischen Schulen Epikurs und der Stoa spannt sich eine Entwicklung, die das gesamte abendländische Denken begründet hat. Wer die Chronologie und die großen Linien kennt, versteht, worauf alle Späteren aufbauen."}, "Descartes": {"name": "René Descartes", "years": "1596–1650", "tag": "„Meditationen über die Erste Philosophie“ (1641)", "summary": "Der französische Philosoph und Mathematiker gilt als Vater der neuzeitlichen Philosophie und Begründer des Rationalismus. Mit dem methodischen Zweifel verwirft er alles Bezweifelbare – Sinne, Träume, sogar einen täuschenden Dämon –, bis die erste Gewissheit bleibt: „Cogito, ergo sum“, ich denke, also bin ich. Sein Dualismus von denkender (res cogitans) und ausgedehnter Substanz (res extensa) prägt das Leib-Seele-Problem bis heute."}, "Hume": {"name": "David Hume", "years": "1711–1776", "tag": "„Eine Untersuchung über den menschlichen Verstand“ (1748)", "summary": "Der schottische Empirist führt alle Vorstellungen auf vorausgehende Sinneseindrücke zurück und stellt unbequeme Fragen: Kausalität ist keine beobachtbare Notwendigkeit, sondern Gewohnheit aus wiederholter Erfahrung; allgemeine Gesetze lassen sich nicht zwingend aus Einzelfällen ableiten (Induktionsproblem). Sein „Gesetz“ verbietet den Schluss vom Sein aufs Sollen. Kant bekannte, Hume habe ihn aus dem „dogmatischen Schlummer“ geweckt."}, "Locke": {"name": "John Locke", "years": "1632–1704", "tag": "„Zwei Abhandlungen über die Regierung“ (1689)", "summary": "Der englische Philosoph ist Empirist und Begründer des politischen Liberalismus. Erkenntnistheoretisch ist der Geist bei Geburt eine „tabula rasa“ – alles Wissen stammt aus Erfahrung. Politisch besitzt jeder Mensch die Naturrechte auf Leben, Freiheit und Eigentum; der Staat entsteht durch Vertrag zu ihrem Schutz. Verletzt eine Regierung diese Rechte, besteht ein Widerstandsrecht des Volkes."}, "Hobbes": {"name": "Thomas Hobbes", "years": "1588–1679", "tag": "„Leviathan“ (1651)", "summary": "Der englische Staatsphilosoph denkt den Staat vom Schrecken seiner Abwesenheit her: Der Naturzustand ist ein „Krieg aller gegen alle“, in dem Furcht regiert. Aus Selbsterhaltung schließen die Menschen einen Gesellschaftsvertrag und übertragen ihre Macht an einen starken Souverän – den „Leviathan“ –, der Frieden und Sicherheit garantiert. Hobbes begründet damit die neuzeitliche Vertragstheorie des Staates."}, "Leibniz": {"name": "Gottfried Wilhelm Leibniz", "years": "1646–1716", "tag": "„Monadologie“ (1714), „Theodizee“ (1710)", "summary": "Das Universalgenie – Philosoph, Mathematiker, Miterfinder der Infinitesimalrechnung – entwarf eine Metaphysik der Monaden: einfacher, „fensterloser“ Kraftzentren, deren Ordnung eine prästabilierte Harmonie stiftet. Nach seinem Satz vom zureichenden Grund gibt es für alles einen Grund, warum es so und nicht anders ist. Seine Theodizee-These, Gott habe die „beste aller möglichen Welten“ geschaffen, verspottete Voltaire in „Candide“."}, "Rousseau": {"name": "Jean-Jacques Rousseau", "years": "1712–1778", "tag": "„Der Gesellschaftsvertrag“ (1762)", "summary": "Der Genfer Philosoph eröffnet sein Hauptwerk mit dem berühmten Satz: „Der Mensch ist frei geboren, und überall liegt er in Ketten.“ Legitime Herrschaft gründet für ihn in der volonté générale, dem auf das Gemeinwohl gerichteten Gemeinwillen – nicht in der bloßen Summe der Einzelinteressen. Seine Kulturkritik behauptet, der Mensch sei von Natur aus gut und werde erst durch die Gesellschaft verdorben."}, "Schopenhauer": {"name": "Arthur Schopenhauer", "years": "1788–1860", "tag": "„Die Welt als Wille und Vorstellung“ (1819)", "summary": "Der große Pessimist der deutschen Philosophie sieht hinter der Welt der Erscheinungen einen blinden, ziellosen Willen als Wesen der Welt „an sich“. Weil dieser Wille unstillbar strebt, ist das Dasein wesentlich Leiden. Grundlage der Ethik ist für Schopenhauer das Mitleid: Moralisch handelt, wer das Leiden des anderen unmittelbar als eigenes miterlebt. Er beeinflusste Nietzsche, Freud und Thomas Mann."}, "Kierkegaard": {"name": "Søren Kierkegaard", "years": "1813–1855", "tag": "„Entweder – Oder“ (1843)", "summary": "Der Kopenhagener Denker gilt als Vater des Existenzialismus: Gegen Hegels System stellt er den einzelnen Existierenden mit seinen Entscheidungen. Er beschreibt drei Existenzstadien – das ästhetische (Genuss), das ethische (Pflicht) und das religiöse –, wobei der Weg ins religiöse Stadium nicht über Vernunftbeweise führt, sondern über den existenziellen „Sprung des Glaubens“."}, "Marx": {"name": "Karl Marx", "years": "1818–1883", "tag": "„Das Kommunistische Manifest“ (1848), „Das Kapital“ (1867)", "summary": "Der Philosoph und Ökonom stellte Hegels Dialektik „vom Kopf auf die Füße“: Nach seinem historischen Materialismus bestimmen die materiellen Produktionsverhältnisse (Basis) das gesellschaftliche Bewusstsein (Überbau), und die bisherige Geschichte ist eine Geschichte von Klassenkämpfen. Im Kapitalismus diagnostiziert er die Entfremdung des Arbeiters von seiner Tätigkeit und deren Produkt. Kaum ein Denker hat die Weltgeschichte stärker beeinflusst."}, "Heidegger": {"name": "Martin Heidegger", "years": "1889–1976", "tag": "„Sein und Zeit“ (1927)", "summary": "Der umstrittene Freiburger Philosoph stellt die Frage nach dem Sinn von Sein neu. Zugang ist das „Dasein“ – der Mensch als das Seiende, dem es um sein Sein geht und das wesentlich „In-der-Welt-sein“ ist, nie isoliertes Subjekt. Eigentliche Existenz gelingt im „Sein zum Tode“: Die Vorwegnahme der eigenen Endlichkeit macht das Dasein entschlossen. Heidegger prägte Existenzphilosophie und Hermeneutik nachhaltig."}, "Sartre": {"name": "Jean-Paul Sartre", "years": "1905–1980", "tag": "„Das Sein und das Nichts“ (1943), „Geschlossene Gesellschaft“ (1944)", "summary": "Der Kopf des französischen Existenzialismus lehrt: Die Existenz geht der Essenz voraus – der Mensch hat kein festes Wesen, sondern schafft es durch seine Wahl und ist „zur Freiheit verurteilt“. Wer sich auf Rollen oder Zwänge herausredet, verfällt dem „bösen Glauben“ (mauvaise foi), der Selbsttäuschung zur Flucht vor der Freiheit. Aus seinem Drama stammt der berühmte Satz: „Die Hölle, das sind die anderen.“"}, "Simone de Beauvoir": {"name": "Simone de Beauvoir", "years": "1908–1986", "tag": "„Das andere Geschlecht“ (1949)", "summary": "Die französische Philosophin und Schriftstellerin verbindet Existenzialismus und Feminismus. Ihr berühmter Satz „Man kommt nicht als Frau zur Welt, man wird es“ fasst ihre These zusammen: Geschlechterrollen sind kulturell konstruiert, nicht Natur. Sie analysiert, wie die Frau zum „Anderen“ gegenüber dem Mann als Norm gemacht wird – ein Gründungstext der modernen feministischen Theorie."}, "Popper": {"name": "Karl Popper", "years": "1902–1994", "tag": "„Logik der Forschung“ (1934), „Die offene Gesellschaft und ihre Feinde“ (1945)", "summary": "Der österreichisch-britische Philosoph machte die Falsifizierbarkeit zum Abgrenzungskriterium der Wissenschaft: Wissenschaftlich ist nur, was prinzipiell durch Erfahrung widerlegbar ist; Fortschritt entsteht durch „Vermutung und Widerlegung“. Politisch verteidigt er in der „Offenen Gesellschaft“ die Demokratie gegen totalitäres Denken und den Historizismus – den Glauben an unausweichliche Geschichtsgesetze."}, "Rawls": {"name": "John Rawls", "years": "1921–2002", "tag": "„Eine Theorie der Gerechtigkeit“ (1971)", "summary": "Der Harvard-Philosoph erneuerte die politische Philosophie mit seiner Konzeption der „Gerechtigkeit als Fairness“: Gerecht sind die Grundsätze, die man im Urzustand hinter einem „Schleier des Nichtwissens“ wählen würde – ohne Kenntnis der eigenen späteren Position. Sein Differenzprinzip erlaubt Ungleichheiten nur, wenn sie den am schlechtesten Gestellten nützen. Nozick kritisierte ihn aus libertärer Perspektive."}, "Foucault": {"name": "Michel Foucault", "years": "1926–1984", "tag": "„Überwachen und Strafen“ (1975)", "summary": "Der französische Denker analysiert das Verhältnis von Macht und Wissen: Was als Wahrheit gilt, ist an Machtverhältnisse gebunden. Am Bild des Panopticons zeigt er die moderne Disziplinargesellschaft – ständige mögliche Sichtbarkeit führt zur Selbstkontrolle der Individuen. Seine historischen Studien zu Gefängnis, Wahnsinn und Sexualität prägen Sozial- und Kulturwissenschaften bis heute."}, "Habermas": {"name": "Jürgen Habermas", "years": "geb. 1929", "tag": "„Theorie des kommunikativen Handelns“ (1981)", "summary": "Der bedeutendste lebende Vertreter der Kritischen Theorie stellt das kommunikative Handeln ins Zentrum: Verständigung beruht auf dem „zwanglosen Zwang des besseren Arguments“. Seine Diskursethik hält Normen für gültig, wenn ihnen alle Betroffenen in einem herrschaftsfreien Diskurs zustimmen könnten. Habermas verbindet so Vernunftphilosophie mit Demokratietheorie und Öffentlichkeitsanalyse."}, "Frankfurter Schule": {"name": "Frankfurter Schule (Kritische Theorie)", "years": "ab 1923, Blütezeit 1930er–1960er", "tag": "Max Horkheimer, Theodor W. Adorno; „Dialektik der Aufklärung“ (1944/47)", "summary": "Die am Frankfurter Institut für Sozialforschung entstandene Kritische Theorie fragt in der „Dialektik der Aufklärung“, warum die Aufklärung in neue Barbarei umschlug. Mit dem Begriff der Kulturindustrie kritisieren Adorno und Horkheimer die massenhafte, standardisierte Vermarktung von Kultur, die Konsumenten normiert und entmündigt. Adornos Diktum bringt die Haltung auf den Punkt: „Es gibt kein richtiges Leben im falschen.“"}, "Peter Singer": {"name": "Peter Singer", "years": "geb. 1946", "tag": "„Animal Liberation“ (1975), „Praktische Ethik“ (1979)", "summary": "Der australische Moralphilosoph vertritt einen Präferenzutilitarismus: Die Interessen aller empfindungsfähigen Wesen zählen gleich. Den „Speziesismus“ – die willkürliche Bevorzugung der eigenen Art – kritisiert er analog zum Rassismus und wurde so zum Vordenker der Tierethik. Sein Ertrinkende-Kind-Argument begründet weitreichende Hilfspflichten gegenüber der weltweiten Not."}, "Martha Nussbaum": {"name": "Martha Nussbaum", "years": "geb. 1947", "tag": "„Die Grenzen der Gerechtigkeit“ (2006), Fähigkeitenansatz", "summary": "Die amerikanische Philosophin entwickelte gemeinsam mit Amartya Sen den Fähigkeitenansatz (capabilities approach): Gerechtigkeit bemisst sich daran, was Menschen real tun und sein können – nicht bloß an Ressourcen oder Einkommen. Ihre Ethik knüpft neo-aristotelisch an Vorstellungen des guten, gelingenden Lebens an und verbindet antike Tugendethik mit moderner Gerechtigkeitstheorie."}, "Thomas Kuhn": {"name": "Thomas S. Kuhn", "years": "1922–1996", "tag": "„Die Struktur wissenschaftlicher Revolutionen“ (1962)", "summary": "Der amerikanische Wissenschaftshistoriker beschreibt Wissenschaft nicht als stetigen Fortschritt, sondern als Abfolge von Paradigmen: In der „Normalwissenschaft“ forschen Wissenschaftler innerhalb geteilter Grundannahmen; häufen sich Anomalien, kommt es zur Krise und zum Paradigmenwechsel – einer wissenschaftlichen Revolution. Da konkurrierende Paradigmen teils „inkommensurabel“ sind, steht Kuhn im Gegensatz zu Poppers rationalem Falsifikationismus."}}</script>

"use strict";
const CFG = JSON.parse(document.getElementById('cfg').textContent);
const QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);
const INTROS=(function(){try{return JSON.parse(document.getElementById('thinker-intros').textContent);}catch(e){return {};}})();
QUESTIONS.forEach((q,i)=>{q._i=i;});
const SESSION_LEN = 12;

/* ---------- storage ---------- */
const SK = CFG.storeKey;
function load(){ try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return {};} }
function save(){ try{localStorage.setItem(SK, JSON.stringify(store));}catch(e){} }
let store = load();
store.xp = store.xp||0; store.sc = store.sc||0; store.sl = store.sl||"";
store.best = store.best||{};

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function norm(s){return (s||"").toString().toLowerCase().trim()
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9]/g,"");}
function lev(a,b){var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++)d[i]=[i];for(var j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
const LETTERS="ABCDE";

/* ---------- header ---------- */
function refreshHeader(){
  $('brandTitle').innerHTML = CFG.brand;
  $('streakStat').textContent = "🔥 "+store.sc;
  $('xpStat').textContent = "⭐ "+store.xp;
}
function applyTheme(){
  if(store.theme==='dark'){document.documentElement.setAttribute('data-theme','dark');$('themeBtn').textContent='☀️';}
  else{document.documentElement.removeAttribute('data-theme');$('themeBtn').textContent='🌙';}
}
$('themeBtn').onclick=function(){store.theme=(store.theme==='dark')?'light':'dark';save();applyTheme();
  var v=store.theme==='dark'?'dark':'light';
  document.querySelectorAll('iframe').forEach(function(fr){ if(fr.contentWindow){try{fr.contentWindow.postMessage({type:'aromarad-theme',value:v},'*');}catch(e){}} });};

/* ---------- streak ---------- */
function bumpStreak(){
  var t=today();
  if(store.sl===t){} else if(store.sl===yesterday()){store.sc++;} else {store.sc=1;}
  store.sl=t; save(); refreshHeader();
}

/* ---------- home ---------- */
let curTrack = CFG.tracks[0].id;
function trackColor(id){var t=CFG.tracks.find(function(x){return x.id===id;});return t?t.color:'var(--brand)';}
function catIcon(cat){return (CFG.catIcons&&CFG.catIcons[cat])|| '📖';}

function renderTabs(){
  var w=$('tabs'); w.innerHTML='';
  CFG.tracks.forEach(function(t){
    var b=el('button','tab'+(t.id===curTrack?' on':''), t.emoji+' '+t.label);
    if(t.id===curTrack){b.style.background=t.color;}
    b.onclick=function(){curTrack=t.id;renderHome();};
    w.appendChild(b);
  });
}
function catsOf(track){
  var map={}; var order=[];
  QUESTIONS.forEach(function(q){ if(q.track===track){ if(!map[q.cat]){map[q.cat]=[];order.push(q.cat);} map[q.cat].push(q);} });
  return order.map(function(c){return {cat:c,items:map[c]};});
}
function diffDots(items){
  var avg=items.reduce(function(s,q){return s+(q.d||1);},0)/items.length;
  var n=Math.round(avg); var h='<span class="dots">';
  for(var i=1;i<=3;i++)h+='<i class="'+(i<=n?'on':'')+'"></i>';
  return h+'</span>';
}
function renderHome(){
  $('homeView').classList.remove('hidden');
  $('quizView').classList.add('hidden');
  $('resultView').classList.add('hidden');
  renderTabs();
  var col=trackColor(curTrack);
  var tObj=CFG.tracks.find(function(x){return x.id===curTrack;});
  var pool=QUESTIONS.filter(function(q){return q.track===curTrack;});
  // banner: mixed for this track
  var bs=$('bannerSlot'); bs.innerHTML='';
  var ban=el('div','banner');
  ban.style.background='linear-gradient(135deg,'+col+',color-mix(in srgb,'+col+' 65%, #000))';
  ban.innerHTML='<span class="em">🎲</span><div><b>Alles gemischt</b><small>'+pool.length+' Fragen · '+tObj.label+' · zufällig & gemischt</small></div><span class="go">›</span>';
  ban.onclick=function(){startQuiz(function(q){return q.track===curTrack;}, '🎲 '+tObj.label, col);};
  bs.appendChild(ban);
  // category list
  var list=$('catList'); list.innerHTML='';
  if(tObj.wheel){
    list.appendChild(el('div','sectit','Aromarad — jederzeit zum Nachschlagen'));
    var fr=el('div','wheelFrame');
    var th=(store.theme==='dark')?'dark':'light';
    var ifr=document.createElement('iframe');
    ifr.id='aromaFrame'; ifr.title='Aromarad';
    ifr.setAttribute('src',(CFG.wheelSrc||'aromarad.html')+'?theme='+th);
    fr.appendChild(ifr); list.appendChild(fr);
    return;
  }
  list.appendChild(el('div','sectit','Themen'));
  catsOf(curTrack).forEach(function(g){
    var b=el('button','cat');
    b.innerHTML='<span class="ic">'+catIcon(g.cat)+'</span>'+
      '<span class="tx"><b>'+g.cat+'</b><small>'+g.items.length+' Fragen '+diffDots(g.items)+'</small></span>'+
      '<span class="ct">›</span>';
    b.onclick=function(){startQuiz(function(q){return q.track===curTrack&&q.cat===g.cat;}, g.cat, col, {cat:g.cat,track:curTrack});};
    list.appendChild(b);
  });
}

/* ---------- quiz session ---------- */
let S=null;
function startQuiz(filter, label, color, opts){
  var pool=QUESTIONS.filter(filter);
  var queue;
  var intro=(opts&&opts.cat&&(opts.track==='quellen'||opts.track==='vertieft'))?INTROS[opts.cat]:null;
  if(intro){
    queue=pool.slice();
    queue.unshift({ty:'intro',cat:opts.cat,info:intro});
  } else {
    queue=sample(pool, Math.min(SESSION_LEN, pool.length));
  }
  S={queue:queue,pos:0,correct:0,xp:0,label:label,color:color||'var(--brand)',filter:filter,opts:opts||null};
  $('homeView').classList.add('hidden');
  $('resultView').classList.add('hidden');
  $('quizView').classList.remove('hidden');
  renderQ();
}
$('quizBack').onclick=function(){ if(confirm('Quiz beenden und zurück?')) renderHome(); };

function setFoot(buttons){ // buttons: array of {label,cls,fn,disabled}
  var f=$('footSlot'); f.innerHTML='';
  buttons.forEach(function(b){
    var btn=el('button','btn'+(b.cls?' '+b.cls:''), b.label);
    if(b.disabled)btn.disabled=true;
    btn.onclick=b.fn; f.appendChild(btn); b._el=btn;
  });
}
function progress(){
  $('pbarFill').style.width=((S.pos)/S.queue.length*100)+'%';
  $('qcount').textContent=(S.pos+1)+' / '+S.queue.length;
}
function next(){ S.pos++; if(S.pos>=S.queue.length){finish();} else {renderQ();} }
function nextBtn(){ var last=(S.pos+1>=S.queue.length); setFoot([{label:last?'Ergebnis ansehen':'Weiter ›',fn:next}]); }

let answered=false;
function reveal(correct, q, opts){
  if(answered)return; answered=true;
  opts=opts||{};
  var gain=0;
  if(correct){ gain = 10 + ((q.d||1)-1)*5; S.correct++; }
  else if(opts.self){ gain=0; }
  if(opts.self && correct){ gain = 6 + ((q.d||1)-1)*3; }
  S.xp+=gain; store.xp+=gain; save(); refreshHeader();
  // feedback box
  var fb=$('cardFb');
  if(fb){
    fb.className='fb show '+(correct?'ok':'no');
    var head = opts.self ? (correct?'Stark! ✓':'Beim nächsten Mal ✗') : (correct?'Richtig ✓':'Nicht ganz ✗');
    var body = q.fb || opts.body || '';
    fb.innerHTML='<span class="h">'+head+(gain?'  +'+gain+' XP':'')+'</span><span class="x">'+body+'</span>';
  }
  nextBtn();
}

function buildQ(q){
  var k='<span class="kicker t-'+q.ty+'">'+kickerLabel(q.ty)+'</span>';
  var card=el('div','card');
  card.innerHTML=k;
  var qt = q.q || q.front || q.prompt || '';
  if(q.ty!=='flip') card.appendChild(el('div','qtext', qt));
  return card;
}
function kickerLabel(ty){
  return ({mc:'Frage',multi:'Mehrfachauswahl',tf:'Wahr oder Falsch',odd:'Ausreißer finden',
    match:'Zuordnen',order:'Sortieren',gap:'Lückentext',est:'Schätzen',flip:'Lernkarte',recall:'Selbsttest'})[ty]||'Frage';
}

function renderIntro(q,slot){
  var it=q.info||{};
  var card=el('div','card introcard');
  card.innerHTML='<span class="kicker t-flip">Einweisung</span>'
    +'<div class="in-name">'+(it.name||q.cat)+'</div>'
    +'<div class="in-meta">'+(it.years||'')+(it.tag?(' \u00b7 '+it.tag):'')+'</div>'
    +'<div class="in-sum">'+(it.summary||'')+'</div>'
    +'<div class="in-hint">Danach folgen alle '+(S.queue.length-1)+' Fragen dazu.</div>';
  slot.appendChild(card);
  setFoot([{label:'Los geht\u2019s \u203a',fn:next}]);
}
function renderQ(){
  answered=false; progress();
  var q=S.queue[S.pos];
  var slot=$('cardSlot'); slot.innerHTML='';
  if(q.ty==='intro'){ renderIntro(q,slot); window.scrollTo(0,0); return; }
  var card=buildQ(q);
  slot.appendChild(card);
  var fb=el('div','fb'); fb.id='cardFb'; card.appendChild(fb);
  // type-specific
  if(q.ty==='mc'||q.ty==='odd') renderMC(q,card);
  else if(q.ty==='multi') renderMulti(q,card);
  else if(q.ty==='tf') renderTF(q,card);
  else if(q.ty==='match') renderMatch(q,card);
  else if(q.ty==='order') renderOrder(q,card);
  else if(q.ty==='gap') renderGap(q,card);
  else if(q.ty==='est') renderEst(q,card);
  else if(q.ty==='flip') renderFlip(q,card);
  else if(q.ty==='recall') renderRecall(q,card);
  else { card.appendChild(el('div','qsub','(unbekannter Typ)')); nextBtn(); }
  window.scrollTo(0,0);
}

/* MC + odd */
function renderMC(q,card){
  var wrap=el('div','opts'); card.insertBefore(wrap, $('cardFb'));
  var idx=q.opts.map(function(_,i){return i;});
  var order=shuffle(idx);
  var btns=[];
  order.forEach(function(origIdx,pos){
    var b=el('button','opt');
    b.innerHTML='<span class="k">'+LETTERS[pos]+'</span><span>'+q.opts[origIdx]+'</span>';
    b.onclick=function(){
      if(answered)return;
      var correct = origIdx===q.c;
      btns.forEach(function(o){o.b.disabled=true;});
      b.classList.add(correct?'correct':'wrong');
      if(!correct){ // also show correct one
        btns.forEach(function(o){ if(o.origIdx===q.c) o.b.classList.add('correct'); });
      }
      reveal(correct,q);
    };
    btns.push({b:b,origIdx:origIdx}); wrap.appendChild(b);
  });
  setFoot([{label:'Wähle eine Antwort',fn:function(){},disabled:true}]);
}

/* multi */
function renderMulti(q,card){
  card.insertBefore(el('div','qsub','Mehrere Antworten richtig – wähle alle aus.'), $('cardFb'));
  var wrap=el('div','opts'); card.insertBefore(wrap, $('cardFb'));
  var order=shuffle(q.opts.map(function(_,i){return i;}));
  var sel={};
  var btns=[];
  order.forEach(function(origIdx,pos){
    var b=el('button','opt');
    b.innerHTML='<span class="k">'+LETTERS[pos]+'</span><span>'+q.opts[origIdx]+'</span>';
    b.onclick=function(){ if(answered)return; sel[origIdx]=!sel[origIdx]; b.classList.toggle('sel',sel[origIdx]); updateFoot(); };
    btns.push({b:b,origIdx:origIdx}); wrap.appendChild(b);
  });
  function ready(){return Object.keys(sel).filter(function(k){return sel[k];}).length>0;}
  function updateFoot(){ if(S._mf)S._mf.disabled=!ready(); }
  function check(){
    if(answered)return;
    var picked=Object.keys(sel).filter(function(k){return sel[k];}).map(Number).sort();
    var corr=q.c.slice().sort();
    var ok = picked.length===corr.length && picked.every(function(v,i){return v===corr[i];});
    btns.forEach(function(o){
      var isC=q.c.indexOf(o.origIdx)>=0, isP=!!sel[o.origIdx];
      o.b.disabled=true; o.b.classList.remove('sel');
      if(isC) o.b.classList.add('correct');
      else if(isP) o.b.classList.add('wrong');
    });
    reveal(ok,q);
  }
  setFoot([{label:'Prüfen',fn:check,disabled:true}]); S._mf=$('footSlot').firstChild;
}

/* true/false */
function renderTF(q,card){
  var wrap=el('div','tf'); card.insertBefore(wrap,$('cardFb'));
  [['Wahr','✓',true],['Falsch','✗',false]].forEach(function(o){
    var b=el('button',null,'<span class="e">'+o[1]+'</span>'+o[0]);
    b.onclick=function(){
      if(answered)return;
      var correct = (o[2]===q.a);
      wrap.querySelectorAll('button').forEach(function(x){x.disabled=true;});
      b.classList.add(correct?'correct':'wrong');
      if(!correct){ wrap.querySelectorAll('button')[q.a?0:1].classList.add('correct'); }
      reveal(correct,q);
    };
    wrap.appendChild(b);
  });
  setFoot([{label:'Wahr oder Falsch?',fn:function(){},disabled:true}]);
}

/* match */
function renderMatch(q,card){
  card.insertBefore(el('div','qsub','Tippe links, dann den passenden Partner rechts.'),$('cardFb'));
  var lefts=q.pairs.map(function(p){return p[0];});
  var rights=q.pairs.map(function(p,i){return {txt:p[1],orig:i};});
  var rOrder=shuffle(rights);
  var wrap=el('div','match'); card.insertBefore(wrap,$('cardFb'));
  var lc=el('div','mcol'), rc=el('div','mcol');
  wrap.appendChild(lc); wrap.appendChild(rc);
  var assign={}; // leftIndex -> position in rOrder
  var activeL=null; var lEls=[],rEls=[];
  lefts.forEach(function(t,i){
    var b=el('button','mitem','<span>'+t+'</span>');
    b.onclick=function(){ if(answered)return;
      if(assign[i]!=null){ // clear
        var rp=assign[i]; delete assign[i]; rEls[rp].classList.remove('used'); rEls[rp].dataset.l='';
        b.querySelector('.mbadge')&&b.querySelector('.mbadge').remove(); refresh();
        return;
      }
      activeL=(activeL===i?null:i); refresh();
    };
    lEls.push(b); lc.appendChild(b);
  });
  rOrder.forEach(function(r,p){
    var b=el('button','mitem','<span>'+r.txt+'</span>');
    b.onclick=function(){ if(answered)return; if(activeL==null)return; if(b.classList.contains('used'))return;
      assign[activeL]=p; b.classList.add('used'); b.dataset.l=activeL;
      var badge=lEls[activeL].querySelector('.mbadge'); if(!badge){badge=el('span','mbadge');lEls[activeL].appendChild(badge);}
      badge.textContent=(p+1); var rb=el('span','mbadge');rb.textContent=(p+1);
      // tag right with same number
      b.querySelector('.mbadge')&&b.querySelector('.mbadge').remove(); b.appendChild(rb);
      activeL=null; refresh();
    };
    rEls.push(b); rc.appendChild(b);
  });
  function refresh(){
    lEls.forEach(function(b,i){b.classList.toggle('active',activeL===i);});
    if(S._mf)S._mf.disabled=Object.keys(assign).length<lefts.length;
  }
  function check(){
    if(answered)return; var ok=true;
    lefts.forEach(function(t,i){
      var p=assign[i]; var chosen=rOrder[p]; var correct=chosen&&chosen.orig===i;
      if(!correct)ok=false;
      lEls[i].classList.add(correct?'correct':'wrong');
      lEls[i].disabled=true;
    });
    rEls.forEach(function(b){b.disabled=true;});
    // build answer key in fb
    var key=q.pairs.map(function(p){return '<b>'+p[0]+'</b> → '+p[1];}).join('<br>');
    reveal(ok,q,{body:(q.fb?q.fb+'<br><br>':'')+key});
  }
  setFoot([{label:'Prüfen',fn:check,disabled:true}]); S._mf=$('footSlot').firstChild;
}

/* order */
function renderOrder(q,card){
  card.insertBefore(el('div','qsub','Bringe in die richtige Reihenfolge (▲▼).'),$('cardFb'));
  var arr=shuffle(q.items.map(function(t,i){return {t:t,orig:i};}));
  // ensure not already perfectly sorted
  if(arr.every(function(x,i){return x.orig===i;}) && arr.length>1){ var t=arr[0];arr[0]=arr[1];arr[1]=t; }
  var wrap=el('div','order'); card.insertBefore(wrap,$('cardFb'));
  function draw(){
    wrap.innerHTML='';
    arr.forEach(function(it,i){
      var row=el('div','oitem');
      row.innerHTML='<span class="num">'+(i+1)+'</span><span class="lbl">'+it.t+'</span>';
      var ar=el('div','arrows');
      var up=el('button',null,'▲'), dn=el('button',null,'▼');
      up.disabled=(i===0); dn.disabled=(i===arr.length-1);
      up.onclick=function(){if(answered)return;var t=arr[i];arr[i]=arr[i-1];arr[i-1]=t;draw();};
      dn.onclick=function(){if(answered)return;var t=arr[i];arr[i]=arr[i+1];arr[i+1]=t;draw();};
      ar.appendChild(up);ar.appendChild(dn);row.appendChild(ar);
      wrap.appendChild(row);
    });
  }
  draw();
  function check(){
    if(answered)return; var ok=arr.every(function(x,i){return x.orig===i;});
    wrap.querySelectorAll('.oitem').forEach(function(row,i){
      row.classList.add(arr[i].orig===i?'correct':'wrong');
      row.querySelectorAll('button').forEach(function(b){b.disabled=true;});
    });
    var key='Richtig: '+q.items.map(function(t,i){return (i+1)+'. '+t;}).join(' · ');
    reveal(ok,q,{body:(q.fb?q.fb+'<br><br>':'')+key});
  }
  setFoot([{label:'Prüfen',fn:check}]);
}

/* gap */
function renderGap(q,card){
  var inp=el('input','gapin'); inp.type='text'; inp.placeholder='Antwort eingeben…';
  inp.autocomplete='off'; inp.autocapitalize='off'; inp.spellcheck=false;
  card.insertBefore(inp,$('cardFb'));
  function check(){
    if(answered)return; var v=norm(inp.value);
    if(!v)return;
    var acc=q.a.map(norm);
    var ok = acc.some(function(a){ return a===v || (a.length>4 && lev(a,v)<=1) || (a.length>6 && (v.indexOf(a)>=0||a.indexOf(v)>=0)); });
    inp.disabled=true; inp.style.borderColor=ok?'var(--good)':'var(--bad)';
    inp.style.background=ok?'var(--good-soft)':'var(--bad-soft)';
    reveal(ok,q,{body:(q.fb?q.fb+'<br><br>':'')+'Akzeptiert: <b>'+q.a[0]+'</b>'});
  }
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  setTimeout(function(){inp.focus();},100);
  setFoot([{label:'Prüfen',fn:check}]);
}

/* estimate */
function renderEst(q,card){
  var box=el('div','est'); card.insertBefore(box,$('cardFb'));
  var start=Math.round((q.min+q.max)/2/ (q.step||1))*(q.step||1);
  var val=el('div','estval');
  var rng=el('input','estrange'); rng.type='range'; rng.min=q.min;rng.max=q.max;rng.step=q.step||1;rng.value=start;
  function fmt(v){return v+(q.unit?(' '+q.unit):'');}
  val.textContent=fmt(start);
  rng.oninput=function(){val.textContent=fmt(rng.value);};
  var mm=el('div','estminmax','<span>'+fmt(q.min)+'</span><span>'+fmt(q.max)+'</span>');
  box.appendChild(val);box.appendChild(rng);box.appendChild(mm);
  function check(){
    if(answered)return; var v=Number(rng.value); rng.disabled=true;
    var ok=Math.abs(v-q.ans)<=q.tol;
    val.style.color=ok?'var(--good)':'var(--bad)';
    reveal(ok,q,{body:(q.fb?q.fb+'<br><br>':'')+'Deine Schätzung: <b>'+fmt(v)+'</b> · Richtig: <b>'+fmt(q.ans)+'</b> (±'+q.tol+')'});
  }
  setFoot([{label:'Prüfen',fn:check}]);
}

/* flip */
function renderFlip(q,card){
  card.insertBefore(el('div','qsub','Überlege, dann Antwort zeigen:'),$('cardFb'));
  var fc=el('div','flipcard', q.front); card.insertBefore(fc,$('cardFb'));
  function flip(){ fc.innerHTML=q.reveal; fc.style.borderColor='var(--brand)';
    setFoot([{label:'❌ Wusste ich nicht',cls:'ghost',fn:function(){reveal(false,q,{self:true,body:q.reveal});}},
             {label:'✅ Gewusst',cls:'good',fn:function(){reveal(true,q,{self:true,body:q.reveal});}}]);
    try{fc.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){} }
  setFoot([{label:'Antwort zeigen',fn:flip}]);
}

/* recall */
function renderRecall(q,card){
  if(q.hint) card.insertBefore(el('div','hintbox','💡 Tipp: '+q.hint),$('cardFb'));
  function show(){
    var mb=el('div','modelbox','<b>Musterantwort:</b><br>'+q.model); var _fb=$('cardFb');_fb.parentNode.insertBefore(mb,_fb);
    try{mb.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}
    setFoot([{label:'❌ Wusste ich nicht',cls:'ghost',fn:function(){reveal(false,q,{self:true,body:q.model});}},
             {label:'✅ Gewusst',cls:'good',fn:function(){reveal(true,q,{self:true,body:q.model});}}]);
  }
  setFoot([{label:'Musterantwort zeigen',fn:show}]);
}

/* ---------- result ---------- */
function finish(){
  $('pbarFill').style.width='100%';
  bumpStreak();
  var n=S.queue.filter(function(it){return it.ty!=='intro';}).length, c=S.correct, pct=n?Math.round(c/n*100):0;
  var key=S.label; if((store.best[key]||0)<pct){store.best[key]=pct;save();}
  $('quizView').classList.add('hidden');
  $('resultView').classList.remove('hidden');
  var ring=$('resRing');
  var col = pct>=80?'var(--good)':(pct>=50?'var(--gold)':'var(--bad)');
  ring.style.background='conic-gradient('+col+' '+pct+'%, var(--line) 0)';
  ring.innerHTML='<div style="width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink);font-size:30px">'+pct+'%</div>';
  var emo = pct>=80?'🏆':(pct>=50?'👍':'📚');
  $('resTitle').textContent = emo+' '+c+' von '+n+' richtig';
  $('resSub').textContent = S.label;
  $('resPills').innerHTML='<span class="pill">+'+S.xp+' XP</span><span class="pill">🔥 '+store.sc+' Tage</span><span class="pill">Bestwert: '+store.best[key]+'%</span>';
  $('resAgain').onclick=function(){startQuiz(S.filter,S.label,S.color,S.opts);};
  $('resHome').onclick=function(){ renderHome();};
}

<script id="dl-lessons" type="application/json">{"cats":{"Überblick & Teilgebiete":{"lead":"Philosophie fragt grundlegend nach Wissen, Sein, Handeln und Sinn. Die Teilgebiete ordnen diese Fragen.","points":["Metaphysik: Was existiert? (Sein, Geist, Freiheit)","Erkenntnistheorie: Was und wie können wir wissen?","Ethik: Was sollen wir tun?","Logik: Was folgt gültig aus was?"],"more":"Dazu kommen u. a. politische Philosophie, Ästhetik und Sprachphilosophie."},"Logik & Argumentation":{"lead":"Logik prüft, ob Schlüsse gültig sind – unabhängig davon, ob die Prämissen wahr sind.","points":["Gültig = wenn die Prämissen wahr sind, muss die Konklusion wahr sein.","Deduktion (sicher) vs. Induktion (wahrscheinlich).","Typische Fehlschlüsse: Strohmann, Zirkelschluss, ad hominem.","Wahrheit der Prämissen und Gültigkeit der Form sind zweierlei."],"more":"Ein gültiges Argument mit falscher Prämisse kann zu einer falschen Konklusion führen."},"Antike":{"lead":"Die antike Philosophie legt das Fundament des westlichen Denkens.","points":["Sokrates: Fragen als Methode, „Ich weiß, dass ich nichts weiß.“","Platon: Ideenlehre – wahre Wirklichkeit hinter den Erscheinungen.","Aristoteles: Logik, Empirie, Tugend als „rechte Mitte“.","Stoa & Epikur: Wege zu Seelenruhe und gutem Leben."],"more":"„Eudaimonia“ (gelingendes Leben) ist das gemeinsame Ziel vieler Schulen."},"Mittelalter":{"lead":"Im Mittelalter verbindet sich antike Philosophie mit Theologie.","points":["Augustinus: Glaube und Innerlichkeit, beeinflusst von Platon.","Thomas von Aquin: Aristoteles + Christentum, Gottesbeweise.","Universalienstreit: Sind Allgemeinbegriffe real oder nur Namen?","Scholastik: strenge Methode von Frage, Einwand, Antwort."],"more":"Viele antike Texte überlebten über arabische Gelehrte."},"Rationalismus & Empirismus":{"lead":"Zwei Wege zur Erkenntnis prägen die frühe Neuzeit: Vernunft vs. Erfahrung.","points":["Rationalismus (Descartes, Spinoza, Leibniz): Wissen aus der Vernunft.","Empirismus (Locke, Hume, Berkeley): Wissen aus Sinneserfahrung.","Descartes: „Cogito, ergo sum“ als sicherer Ausgangspunkt.","Hume: Zweifel an Kausalität und Induktion."],"more":"Kant versucht später, beide Richtungen zu versöhnen."},"Kant":{"lead":"Kant vollzieht die „kopernikanische Wende“: Der Verstand formt die Erfahrung.","points":["Wir erkennen Erscheinungen, nicht das „Ding an sich“.","Raum & Zeit sind Formen unserer Anschauung.","Kategorischer Imperativ: handle nach verallgemeinerbaren Maximen.","Aufklärung: „Habe Mut, dich deines Verstandes zu bedienen!“"],"more":"Kant trennt, was wir wissen können, von dem, was wir glauben/hoffen."},"Politische Philosophie":{"lead":"Wie sollen wir zusammenleben? Macht, Gerechtigkeit und Freiheit stehen im Zentrum.","points":["Vertragstheorien (Hobbes, Locke, Rousseau): Legitimation von Herrschaft.","Liberalismus betont Freiheit & Rechte des Einzelnen.","Rawls: Gerechtigkeit als Fairness („Schleier des Nichtwissens“).","Spannungsfeld Freiheit vs. Gleichheit."],"more":"Nozick kontert Rawls mit Minimalstaat und Eigentumsrechten."},"19. Jahrhundert":{"lead":"Das 19. Jh. denkt Geschichte, Gesellschaft und Wille neu.","points":["Hegel: Dialektik, Geschichte als Entfaltung des Geistes.","Marx: materialistische Wende, Kritik des Kapitalismus.","Schopenhauer: die Welt als Wille und Vorstellung.","Nietzsche: Kritik der Moral, „Wille zur Macht“."],"more":"Viele dieser Ideen prägen bis heute Politik und Psychologie."},"20. Jahrhundert":{"lead":"Sprache, Existenz und Wissenschaft rücken ins Zentrum.","points":["Wittgenstein: Grenzen und Spiele der Sprache.","Existenzialismus (Sartre, Camus): Freiheit, Sinn, Absurdität.","Popper: Wissenschaft lebt von Falsifizierbarkeit.","Phänomenologie & Hermeneutik: Erfahrung und Verstehen."],"more":"Hier trennen sich „analytische“ und „kontinentale“ Tradition."},"Nassim Taleb":{"lead":"Taleb denkt über Zufall, Risiko und Robustheit – wie man in einer unsicheren Welt besteht.","points":["„Black Swan“: seltene, extreme, im Nachhinein „erklärte“ Ereignisse.","„Antifragil“: was durch Stress & Unordnung stärker wird.","„Skin in the Game“: wer entscheidet, soll das Risiko mittragen."],"more":"Scharfe Kritik an Experten, die Risiken auf andere auslagern."},"Surowiecki":{"lead":"James Surowiecki: „Die Weisheit der Vielen“ – Gruppen können klüger sein als Einzelne.","points":["Braucht Vielfalt, Unabhängigkeit & Dezentralität der Urteile.","Die Aggregation vieler Schätzungen schlägt oft den Experten.","Gefahr: Herdenverhalten zerstört die Weisheit der Menge."]},"Epiktet & Stoa":{"lead":"Epiktet, einst Sklave, dann Stoiker: Frei ist, wer Beeinflussbares von Nicht-Beeinflussbarem trennt.","points":["„Nicht die Dinge beunruhigen uns, sondern unsere Urteile darüber.“","Konzentriere dich auf das, was in deiner Macht steht.","Tugend und innere Haltung statt äußerer Umstände."]},"Viktor Frankl":{"lead":"Frankl, Psychiater und KZ-Überlebender: Sinn ist die stärkste Kraft des Menschen.","points":["Logotherapie: Heilung durch Sinnfindung.","„Wer ein Warum hat, erträgt fast jedes Wie.“","Sinn entsteht durch Tun, Erleben und Haltung im Leid."]},"J. S. Mill":{"lead":"Mill verbindet Freiheit und Nützlichkeit – ein Klassiker des Liberalismus.","points":["Schadensprinzip: Freiheit endet, wo man anderen schadet.","Utilitarismus: höhere und niedere Freuden unterscheiden.","Leidenschaftliche Verteidigung der Meinungsfreiheit."]},"Michael Sandel":{"lead":"Sandel hinterfragt die Grenzen von Markt und Meritokratie aus Sicht des Gemeinwohls.","points":["„Was man für Geld nicht kaufen sollte“ – moralische Grenzen von Märkten.","Kritik der Leistungsgesellschaft: Erfolg ist nie allein Verdienst.","Gerechtigkeit braucht Debatte über das gute Leben."]},"Epikur":{"lead":"Epikur sucht Glück in maßvoller Lust und Schmerzfreiheit (Ataraxie).","points":["Lust = Abwesenheit von Schmerz und Unruhe, nicht Exzess.","Bedürfnisse einteilen: natürlich/notwendig vs. überflüssig.","„Solange wir sind, ist der Tod nicht; ist er da, sind wir nicht.“"]},"C. S. Lewis":{"lead":"Lewis: Literaturwissenschaftler und christlicher Denker, bekannt für klare Apologetik.","points":["„Trilemma“: Jesus als Lügner, Verrückter oder Herr.","Das moralische Gesetz als Hinweis auf etwas Höheres.","Verbindet Vernunft, Mythos und Glauben."]},"Hayek":{"lead":"Hayek: Wissen ist verstreut – Märkte koordinieren es besser als zentrale Planung.","points":["Preise bündeln verstreutes Wissen als Signale.","„Anmaßung von Wissen“: Planer überschätzen ihr Wissen.","Spontane Ordnung statt Steuerung von oben."]},"Wittgenstein":{"lead":"Wittgenstein untersucht die Grenzen und Funktionsweise der Sprache.","points":["Früh: „Wovon man nicht sprechen kann, darüber muss man schweigen.“","Spät: Bedeutung entsteht im Gebrauch („Sprachspiele“).","Viele Probleme sind sprachliche Verwirrungen."]},"Hannah Arendt":{"lead":"Arendt denkt über Macht, Freiheit und politisches Handeln.","points":["„Banalität des Bösen“: Unrecht durch Gedankenlosigkeit.","Vita activa: Arbeiten, Herstellen, Handeln unterscheiden.","Freiheit zeigt sich im gemeinsamen Handeln im öffentlichen Raum."]},"Spinoza":{"lead":"Spinoza: Gott und Natur sind eins – Freiheit heißt Einsicht in die Notwendigkeit.","points":["Eine einzige Substanz („Deus sive Natura“).","Affekte verstehen, um nicht ihr Sklave zu sein.","Erkenntnis führt zu Gleichmut."]},"Marc Aurel":{"lead":"Marc Aurel, römischer Kaiser und Stoiker, schrieb „Selbstbetrachtungen“ als Lebensübung.","points":["Erinnere dich täglich an Vergänglichkeit und Pflicht.","Beherrsche dein Urteil, nicht die äußeren Dinge.","Handle vernünftig und zum Wohl der Gemeinschaft."]},"Aristoteles":{"lead":"Aristoteles: Empiriker und Systematiker – Tugend als Mitte, Glück als Ziel.","points":["Tugend liegt in der „rechten Mitte“ zwischen Extremen.","Eudaimonia = gelingendes Leben durch tugendhafte Tätigkeit.","Begründer der formalen Logik (Syllogismus)."]},"Putnam (Sozialkapital)":{"lead":"Robert Putnam: „Bowling Alone“ – Zusammenhalt als „Sozialkapital“.","points":["Netzwerke, Vertrauen und Normen sind Ressourcen einer Gesellschaft.","„Bonding“ (innerhalb) vs. „Bridging“ (zwischen Gruppen).","Sinkende Bindung schwächt die Demokratie."]},"Veblen":{"lead":"Thorstein Veblen prägte den Begriff „demonstrativer Konsum“.","points":["Status wird durch sichtbaren Verbrauch signalisiert.","„Leisure Class“: Verschwendung als Prestige.","Kritik am Geltungsstreben der Wirtschaft."]},"Byung-Chul Han":{"lead":"Byung-Chul Han diagnostiziert die „Müdigkeitsgesellschaft“.","points":["Selbstausbeutung statt Fremdzwang („Leistungssubjekt“).","Verlust von Muße, Ferne und Negativität.","Transparenz- und Optimierungsdruck machen krank."]},"Hartmut Rosa":{"lead":"Hartmut Rosa: Beschleunigung und „Resonanz“ als Schlüssel der Moderne.","points":["Soziale Beschleunigung erzeugt Entfremdung.","„Resonanz“: eine gelingende, antwortende Weltbeziehung.","Nicht mehr Ressourcen, sondern bessere Beziehungen zur Welt."]},"Tocqueville":{"lead":"Tocqueville analysierte Demokratie, Freiheit und ihre Gefahren.","points":["„Über die Demokratie in Amerika“: Gleichheit als Grundtrend.","Gefahr der „Tyrannei der Mehrheit“.","Vereine & lokale Selbstverwaltung schützen die Freiheit."]},"Nozick":{"lead":"Nozick verteidigt einen Minimalstaat und starke Eigentumsrechte.","points":["Nur ein „Nachtwächterstaat“ ist legitim.","Gerechtigkeit als rechtmäßiger Erwerb & Übertragung.","„Erfahrungsmaschine“: Wir wollen echtes Leben, nicht nur Lust."]},"Stoa":{"lead":"Die Stoa lehrt Gelassenheit durch Vernunft und Akzeptanz des Naturlaufs.","points":["Unterscheide Beeinflussbares von Nicht-Beeinflussbarem.","Negative Affekte entstehen aus falschen Urteilen.","Lebe „gemäß der Natur“ und der Vernunft."]},"Sokrates/Platon":{"lead":"Sokrates fragt, Platon systematisiert: Wahrheit liegt hinter den Erscheinungen.","points":["Sokratische Methode: durch Fragen zum Wissen (und zur eigenen Unwissenheit).","Platons Ideenlehre: Urbilder hinter den Dingen.","Höhlengleichnis: Bildung als Weg ins Licht."]},"Hegel":{"lead":"Hegel denkt Wirklichkeit als Prozess: These, Antithese, Synthese.","points":["Dialektik treibt Denken und Geschichte voran.","„Das Wahre ist das Ganze.“","Geschichte als Fortschritt im Bewusstsein der Freiheit."]},"Nietzsche":{"lead":"Nietzsche hinterfragt Moral, Wahrheit und Werte radikal.","points":["„Gott ist tot“ – Verlust verbindlicher Werte (Nihilismus).","Umwertung der Werte; Herren- vs. Sklavenmoral.","Ideal: lebensbejahendes Schaffen eigener Werte."]},"Camus":{"lead":"Camus: Das Leben ist absurd – und gerade darum zu bejahen.","points":["Das Absurde: Sinnsuche trifft auf eine stumme Welt.","„Wir müssen uns Sisyphos als glücklichen Menschen vorstellen.“","Auflehnung statt Selbstaufgabe oder fauler Hoffnung."]}},"mixed":{"Quellen":{"lead":"Querschnitt durch die Denker und Quellen, die du gesammelt hast.","points":["12 zufällige Fragen aus verschiedenen Autoren.","Verbinde Idee und Kopf dahinter.","Kein Zeitdruck – ruhig nachdenken."]},"Vertieft":{"lead":"Vertiefende Fragen quer durch Epochen und Denker.","points":["Von der Antike bis zur Gegenwart gemischt.","Achte auf die zentrale These jedes Denkers."]},"Allgemein":{"lead":"Gemischte Runde durch die großen Felder und Epochen der Philosophie.","points":["Teilgebiete, Logik und Epochen gemischt.","Merksatz: Gültigkeit ist nicht dasselbe wie Wahrheit."]}},"mixedDefault":{"lead":"Eine bunt gemischte Übungsrunde. Kein Zeitdruck.","points":["12 zufällige Fragen aus diesem Bereich.","Achte auf die zentrale These jedes Denkers."]}}</script>
<script id="dl-logic">
(function(){
  if(window.__dlInit)return; window.__dlInit=1;
  var L; try{ L=JSON.parse(document.getElementById('dl-lessons').textContent); }catch(e){ return; }
  function theme(){
    var cs=getComputedStyle(document.body);
    var tab=document.querySelector('#tabs .tab.on')||document.body;
    var a=getComputedStyle(tab).backgroundColor;
    return {bg:cs.backgroundColor||'#fff', fg:cs.color||'#222', acc:(a&&a!=='rgba(0, 0, 0, 0)')?a:'#555'};
  }
  function soft(fg){ return fg==='rgb(255, 255, 255)'?'rgba(255,255,255,.08)':'rgba(0,0,0,.05)'; }
  function buildOverlay(kick,title,icon,data){
    var t=theme();
    var ov=document.createElement('div'); ov.className='dlov'; ov.style.background=t.bg; ov.style.color=t.fg;
    var pts=(data.points||[]).map(function(p,i){
      return "<div class='dlpt' style='background:"+soft(t.fg)+"'><span class='dld' style='background:"+t.acc+"'>"+(i+1)+"</span><span>"+p+"</span></div>";
    }).join('');
    var more=data.more?("<div class='dlmore' style='background:"+soft(t.fg)+"'><b>Gut zu wissen</b>"+data.more+"</div>"):'';
    ov.innerHTML="<div class='dlhead'><div class='dlkick'>"+kick+"</div><div class='dltitle'>"+(icon?icon+' ':'')+title+"</div></div>"
      +"<div class='dlscroll'><div class='dllead'>"+(data.lead||'')+"</div>"+pts+more+"</div>"
      +"<div class='dlfoot'><button class='dlgo' style='background:"+t.acc+"'>Los geht’s →</button><button class='dlskip'>Direkt zu den Fragen</button></div>";
    document.body.appendChild(ov);
    var prevOv=document.body.style.overflow; document.body.style.overflow='hidden';
    function close(){ ov.remove(); document.body.style.overflow=prevOv; }
    ov.querySelector('.dlgo').addEventListener('click',close);
    ov.querySelector('.dlskip').addEventListener('click',close);
    ov.querySelector('.dlscroll').scrollTop=0;
  }
  var lastPick=null;
  function cleanTrack(s){ return String(s||'').replace(/[^\p{L}0-9 .\-]/gu,'').trim(); }
  document.addEventListener('click',function(e){
    var cat=e.target.closest&&e.target.closest('#catList button.cat');
    var ban=e.target.closest&&e.target.closest('#bannerSlot .banner');
    if(!cat&&!ban)return;
    var tabOn=document.querySelector('#tabs .tab.on');
    var track=cleanTrack(tabOn&&tabOn.textContent);
    if(cat){
      var tx=cat.querySelector('.tx');
      var nameEl=tx&&(tx.querySelector('b')||tx.firstElementChild);
      var name=(nameEl?nameEl.textContent:(tx?tx.textContent:'')).replace(/\s*\d+\s*Fragen.*$/,'').trim();
      var ic=cat.querySelector('.ic');
      lastPick={kind:'cat',cat:name,track:track,icon:ic?ic.textContent.trim():'',shown:false};
    } else {
      lastPick={kind:'mixed',cat:null,track:track,icon:'🎲',shown:false};
    }
  },true);
  var qv=document.getElementById('quizView');
  if(!qv)return;
  var wasHidden=qv.classList.contains('hidden');
  function maybeShow(){
    if(!lastPick||lastPick.shown)return;
    var data=null,title='',kick='Lektion';
    if(lastPick.kind==='cat'){ if(lastPick.track==='Quellen'||lastPick.track==='Vertieft'){ lastPick.shown=true; return; } data=L.cats&&L.cats[lastPick.cat]; title=lastPick.cat; }
    else { data=(L.mixed&&L.mixed[lastPick.track])||L.mixedDefault; title='Alles gemischt'; kick='Aufwärmen'; }
    if(!data)return;
    lastPick.shown=true;
    buildOverlay(kick,title,lastPick.icon,data);
  }
  new MutationObserver(function(){ var h=qv.classList.contains('hidden'); if(wasHidden&&!h)maybeShow(); wasHidden=h; })
    .observe(qv,{attributes:true,attributeFilter:['class']});
})();
</script>
