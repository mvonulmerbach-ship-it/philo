<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3b6e58">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Philosophie">
<title>Philosophie lernen</title>
<style>
:root{
  color-scheme: light;
  --bg:#f7f6f2; --card:#ffffff; --ink:#1c1b18; --muted:#6b6862; --line:#e7e4dc;
  --brand:#3b6e58; --brand-soft:#e7f0ea; --accent:#6a4c93; --gold:#c9a227;
  --good:#3b6e58; --good-soft:#e7f0ea; --bad:#b4452f; --bad-soft:#f6e6e1;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
  --radius:16px;
}
[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121310; --card:#1c1e19; --ink:#ece9e2; --muted:#9c988e; --line:#30332c;
  --brand-soft:#1b271f; --good:#5aa483; --good-soft:#19241d; --bad:#e0826b; --bad-soft:#2c1b15;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:580px;margin:0 auto;padding:0 16px;
  padding-top:env(safe-area-inset-top);padding-bottom:calc(28px + env(safe-area-inset-bottom))}

/* header */
header{position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;gap:8px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.4px;flex:1}
.brand b{color:var(--brand)}
.stat{font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);
  padding:5px 9px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap}
.themebtn{font-size:16px;line-height:1;padding:8px 10px;border-radius:10px;
  color:var(--ink);background:var(--card);border:1px solid var(--line)}
.themebtn:active{transform:translateY(1px)}

/* tabs */
.tabs{display:flex;gap:8px;margin:10px 0 14px}
.tab{flex:1;text-align:center;padding:11px 4px;border-radius:14px;font-weight:700;font-size:13.5px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);box-shadow:var(--shadow)}
.tab.on{color:#fff;border-color:transparent}
.tab:active{transform:translateY(1px)}

/* banner */
.banner{color:#fff;padding:16px;border-radius:var(--radius);margin-bottom:14px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer}
.banner .em{font-size:26px}
.banner b{font-size:16px;display:block}
.banner small{opacity:.92;font-size:12.5px;font-weight:600}
.banner .go{margin-left:auto;font-size:22px;opacity:.9}
.banner:active{transform:translateY(1px)}

/* category cards */
.sectit{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);margin:18px 4px 8px}
.cat{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);width:100%;text-align:left}
.cat:active{transform:translateY(1px)}
.cat .ic{font-size:22px;width:30px;text-align:center;flex:none}
.cat .tx{flex:1;min-width:0}
.cat .tx b{font-weight:700;font-size:15px;display:block}
.cat .tx small{color:var(--muted);font-size:12.5px}
.cat .ct{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;flex:none}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.back{font-size:15px;font-weight:700;color:var(--muted);padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.pbar{flex:1;height:9px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s ease}
.qcount{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--brand);
  padding:4px 9px;border-radius:999px;margin-bottom:12px}
.kicker.t-multi{background:var(--accent)} .kicker.t-est{background:var(--gold);color:#1c1b18}
.kicker.t-match{background:var(--accent)} .kicker.t-order{background:var(--accent)}
.kicker.t-gap{background:var(--gold);color:#1c1b18} .kicker.t-tf{background:var(--brand)}
.kicker.t-flip,.kicker.t-recall{background:var(--muted)}
.qtext{font-size:18px;font-weight:650;line-height:1.4;margin:0 0 4px}
.qsub{font-size:13px;color:var(--muted);margin:8px 0 2px}

/* options */
.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--bg);border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;font-size:15px}
.opt .k{flex:none;width:25px;height:25px;border-radius:8px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted);background:var(--card)}
.opt:active{transform:translateY(1px)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}

/* true/false */
.tf{display:flex;gap:10px;margin-top:16px}
.tf button{flex:1;padding:18px 8px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--bg);font-size:17px;font-weight:800}
.tf button .e{font-size:22px;display:block;margin-bottom:3px}
.tf button.correct{border-color:var(--good);background:var(--good-soft)}
.tf button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tf button.sel{border-color:var(--brand);background:var(--brand-soft)}

/* match */
.match{display:flex;gap:10px;margin-top:14px}
.mcol{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.mitem{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 10px;
  font-size:13.5px;font-weight:600;text-align:left;position:relative;min-height:46px;display:flex;align-items:center}
.mitem.active{border-color:var(--brand);background:var(--brand-soft)}
.mitem.used{opacity:.55}
.mitem.correct{border-color:var(--good);background:var(--good-soft)}
.mitem.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mbadge{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:var(--shadow)}

/* order */
.order{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.oitem{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--bg);
  border-radius:12px;padding:11px 12px;font-size:14.5px;font-weight:600}
.oitem .num{flex:none;width:24px;height:24px;border-radius:7px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--muted)}
.oitem .lbl{flex:1;min-width:0}
.oitem .arrows{display:flex;flex-direction:column;gap:2px}
.oitem .arrows button{font-size:13px;line-height:1;padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-weight:800}
.oitem.correct{border-color:var(--good);background:var(--good-soft)}
.oitem.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* gap input */
.gapin{margin-top:16px;width:100%;font-size:17px;padding:13px 14px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600}
.gapin:focus{outline:none;border-color:var(--brand);background:var(--brand-soft)}

/* estimate slider */
.est{margin-top:18px}
.estval{text-align:center;font-size:30px;font-weight:800;color:var(--brand);margin-bottom:8px}
.estrange{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;
  background:var(--line);outline:none}
.estrange::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--brand);border:3px solid var(--card);box-shadow:var(--shadow);cursor:pointer}
.estrange::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--brand);border:3px solid var(--card);cursor:pointer}
.estminmax{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}

/* flip / recall */
.flipcard{margin-top:14px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;
  padding:20px 16px;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:600}
.hintbox{margin-top:12px;font-size:13.5px;color:var(--muted);font-style:italic}
.modelbox{margin-top:14px;border-left:3px solid var(--brand);background:var(--brand-soft);
  border-radius:8px;padding:12px 14px;font-size:14.5px}

/* feedback */
.fb{margin-top:14px;border-radius:12px;padding:13px 14px;font-size:14.5px;font-weight:500;display:none}
.fb.show{display:block}
.fb.ok{background:var(--good-soft);color:var(--good);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.fb .h{font-weight:800;display:block;margin-bottom:3px}
.fb .x{color:var(--ink);font-weight:500}

/* footer action */
.foot{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:12px 0 calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:14px;font-size:16px;font-weight:800;
  background:var(--brand);color:#fff;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good)} .btn.bad{background:var(--bad)}

/* result */
.result{text-align:center;padding:30px 16px}
.result .big{font-size:54px;font-weight:800;margin:8px 0}
.result .ring{width:130px;height:130px;margin:6px auto 14px;border-radius:50%;
  display:grid;place-items:center;font-size:34px;font-weight:800;color:#fff}
.result h2{font-size:22px;margin:4px 0 2px}
.result p{color:var(--muted);margin:4px 0}
.pill{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-weight:700;font-size:14px;margin:5px 4px;box-shadow:var(--shadow)}
.hidden{display:none!important}
/* aroma wheel */
.wheelView{width:100%;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:6px}
.wheelView svg{display:block;margin:0 auto;width:100%;max-width:460px;height:auto;touch-action:manipulation}
.seg{cursor:pointer;transition:opacity .15s} .seg.dim{opacity:.22}
.wlabel{font-weight:800;fill:#fff;pointer-events:none}
.wctr{font-weight:800;fill:var(--ink);pointer-events:none;text-anchor:middle}
.wdetail{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}
.wdetail h3{margin:0 0 4px;font-size:17px} .wdetail .cap{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand)}
.wdetail p{margin:6px 0 10px;color:var(--muted);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip:active{transform:translateY(1px)} .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.whint{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 2px}
.wheelFrame{width:100%;height:80vh;min-height:500px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;margin-bottom:8px}
.wheelFrame iframe{width:100%;height:100%;border:0;display:block}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:inline-block}
.dots i.on{background:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <!-- HEADER -->
  <header>
    <div class="brand" id="brandTitle"></div>
    <div class="stat" id="streakStat">🔥 0</div>
    <div class="stat" id="xpStat">⭐ 0</div>
    <button class="themebtn" id="themeBtn" aria-label="Hell/Dunkel">🌙</button>
  </header>

  <!-- HOME -->
  <div id="homeView">
    <div class="tabs" id="tabs"></div>
    <div id="bannerSlot"></div>
    <div id="catList"></div>
  </div>

  <!-- QUIZ -->
  <div id="quizView" class="hidden">
    <div class="qhead">
      <button class="back" id="quizBack">‹ Ende</button>
      <div class="pbar"><i id="pbarFill"></i></div>
      <div class="qcount" id="qcount"></div>
    </div>
    <div id="cardSlot"></div>
    <div class="foot" id="footSlot"></div>
  </div>

  <!-- RESULT -->
  <div id="resultView" class="hidden">
    <div class="result">
      <div class="ring" id="resRing"></div>
      <h2 id="resTitle"></h2>
      <p id="resSub"></p>
      <div id="resPills"></div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="resHome">Startseite</button>
      <button class="btn" id="resAgain">Nochmal</button>
    </div>
  </div>
</div>

: "Überblick & Teilgebiete", "d": 2, "ty": "odd", "q": "Welcher Begriff gehört NICHT zu den klassischen Teilgebieten der theoretischen Philosophie?", "opts": ["Metaphysik", "Erkenntnistheorie", "Logik", "Tugendlehre"], "c": 3, "fb": "Die <b>Tugendlehre</b> gehört zur praktischen Philosophie, die übrigen zur theoretischen."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "match", "q": "Ordne Disziplin → Leitfrage zu.", "pairs": [["Erkenntnistheorie", "Was kann ich wissen?"], ["Ethik", "Was soll ich tun?"], ["Ästhetik", "Was ist schön?"], ["Metaphysik", "Was ist das Sein?"]], "fb": "Diese Zuordnung folgt den klassischen Leitfragen der Teilgebiete."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 1, "ty": "flip", "front": "Die Lehre vom Sein des Seienden heißt … .", "reveal": "Ontologie — Die Ontologie ist der Kernbereich der Metaphysik."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "multi", "q": "Welche der folgenden zählen zur praktischen Philosophie?", "opts": ["Ethik", "Logik", "Politische Philosophie", "Ontologie", "Rechtsphilosophie"], "c": [0, 2, 4], "fb": "<b>Ethik, politische und Rechtsphilosophie</b> gehören zur praktischen Philosophie; Logik und Ontologie zur theoretischen."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "mc", "q": "Die Frage 'Was ist der Mensch?' fasst nach Kant die anderen Grundfragen zusammen und gehört zur:", "opts": ["Logik", "Anthropologie", "Mathematik", "Rhetorik"], "c": 1, "fb": "Kant ordnet 'Was ist der Mensch?' der philosophischen <b>Anthropologie</b> zu."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 1, "ty": "flip", "front": "Was bedeutet das Wort 'Philosophie' wörtlich?", "reveal": "'Liebe zur Weisheit' (griech. philosophía: philos = Freund/Liebe, sophia = Weisheit)."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "mc", "q": "Welche Disziplin untersucht systematisch die Grundlagen und Methoden der Wissenschaften?", "opts": ["Ästhetik", "Wissenschaftstheorie", "Rhetorik", "Mystik"], "c": 1, "fb": "Die <b>Wissenschaftstheorie</b> reflektiert Methoden, Begriffe und Geltungsansprüche der Wissenschaften."}, {"track": "allg", "cat": "Überblick & Teilgebiete", "d": 2, "ty": "tf", "q": "Die politische Philosophie gehört zur praktischen Philosophie.", "a": true, "fb": "Als Lehre vom gerechten Zusammenleben zählt sie zur <b>praktischen</b> Philosophie."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 1, "ty": "mc", "q": "Ein Argument, das eine Person statt ihrer Aussage angreift, ist ein …", "opts": ["Strohmann", "Zirkelschluss", "Ad-hominem-Argument", "falsches Dilemma"], "c": 2, "fb": "Beim <b>Ad-hominem</b>-Fehlschluss wird die Person statt des Arguments angegriffen."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "Wenn man die Position des Gegners verzerrt darstellt, um sie leichter zu widerlegen, begeht man einen …", "opts": ["Zirkelschluss", "Strohmann-Fehlschluss", "Appell an die Tradition", "naturalistischen Fehlschluss"], "c": 1, "fb": "Der <b>Strohmann-Fehlschluss</b> bekämpft eine verfälschte, schwächere Version der Gegenposition."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "Ein Argument heißt 'gültig', wenn …", "opts": ["alle Prämissen wahr sind", "die Konklusion zwingend aus den Prämissen folgt", "es überzeugend klingt", "die Prämissen plausibel sind"], "c": 1, "fb": "<b>Gültigkeit</b> betrifft nur die Form: Bei wahren Prämissen muss die Konklusion wahr sein."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "Ein Argument ist 'schlüssig' (sound), wenn es …", "opts": ["nur gültig ist", "gültig ist UND wahre Prämissen hat", "viele Prämissen hat", "induktiv ist"], "c": 1, "fb": "Ein <b>schlüssiges</b> Argument ist gültig und hat zugleich wahre Prämissen."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "tf", "q": "Ein gültiges Argument kann falsche Prämissen und dennoch eine wahre Konklusion haben.", "a": true, "fb": "Gültigkeit garantiert nur: Wenn die Prämissen wahr sind, ist die Konklusion wahr — sie kann aber zufällig wahr sein."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 1, "ty": "tf", "q": "Bei der Deduktion folgt die Konklusion zwingend aus den Prämissen.", "a": true, "fb": "Die <b>Deduktion</b> ist wahrheitserhaltend: Aus wahren Prämissen folgt notwendig eine wahre Konklusion."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "tf", "q": "Induktive Schlüsse sind logisch zwingend und niemals falsch.", "a": false, "fb": "<b>Induktion</b> verallgemeinert von Einzelfällen; ihre Konklusion ist nur wahrscheinlich, nicht zwingend."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 1, "ty": "mc", "q": "Der Schluss 'Alle bisher beobachteten Schwäne sind weiß, also sind alle Schwäne weiß' ist ein Beispiel für …", "opts": ["Deduktion", "Induktion", "einen Zirkelschluss", "ein falsches Dilemma"], "c": 1, "fb": "Die Verallgemeinerung von Einzelfällen auf eine Allaussage ist klassische <b>Induktion</b>."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "'Entweder du bist für uns oder gegen uns' ist ein typisches Beispiel für …", "opts": ["Zirkelschluss", "falsches Dilemma", "Strohmann", "Autoritätsargument"], "c": 1, "fb": "Das <b>falsche Dilemma</b> reduziert die Optionen künstlich auf zwei, obwohl es mehr gibt."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "mc", "q": "Ein Argument, dessen Konklusion bereits in einer Prämisse vorausgesetzt wird, ist ein …", "opts": ["Strohmann", "Zirkelschluss", "Ad-hominem", "Dammbruchargument"], "c": 1, "fb": "Beim <b>Zirkelschluss</b> (petitio principii) setzt man das Zu-Beweisende schon voraus."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 3, "ty": "match", "q": "Ordne Fehlschluss → Beschreibung zu.", "pairs": [["Ad hominem", "Angriff auf die Person statt das Argument"], ["Strohmann", "Verzerrte Wiedergabe der Gegenposition"], ["Zirkelschluss", "Konklusion steckt schon in der Prämisse"], ["Falsches Dilemma", "Künstliche Reduktion auf zwei Optionen"]], "fb": "Jede Zuordnung benennt das definierende Merkmal des Fehlschlusses."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "odd", "q": "Welcher Begriff gehört NICHT zu den informellen Fehlschlüssen?", "opts": ["Strohmann", "Ad hominem", "Modus ponens", "falsches Dilemma"], "c": 2, "fb": "Der <b>Modus ponens</b> ist eine gültige Schlussregel, kein Fehlschluss."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "flip", "front": "Die gültige Schlussform 'Wenn p, dann q; p; also q' heißt … .", "reveal": "modus ponens — Der Modus ponens ist eine grundlegende gültige Schlussregel."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 3, "ty": "flip", "front": "Die Schlussform 'Wenn p, dann q; nicht q; also nicht p' heißt … .", "reveal": "modus tollens — Der Modus tollens schließt von der Verneinung des Konsequens auf die des Antezedens."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 3, "ty": "multi", "q": "Welche der folgenden sind informelle Fehlschlüsse?", "opts": ["Appell an die Autorität", "Modus ponens", "Dammbruchargument", "Naturalistischer Fehlschluss", "Modus tollens"], "c": [0, 2, 3], "fb": "Autoritätsappell, Dammbruch und naturalistischer Fehlschluss sind Fehlschlüsse; modus ponens/tollens sind gültig."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 3, "ty": "mc", "q": "Der naturalistische Fehlschluss besteht laut G. E. Moore darin, …", "opts": ["aus dem Sein auf das Sollen zu schließen", "Naturwissenschaft zu kritisieren", "das Gute mit natürlichen Eigenschaften gleichzusetzen", "die Natur zu vergöttern"], "c": 2, "fb": "Moore kritisiert, das <b>Gute</b> einfach mit natürlichen Eigenschaften zu identifizieren."}, {"track": "allg", "cat": "Logik & Argumentation", "d": 2, "ty": "recall", "prompt": "Erkläre den Unterschied zwischen Gültigkeit und Wahrheit eines Arguments.", "hint": "Form vs. Inhalt", "model": "Gültigkeit ist eine Eigenschaft der Argumentform: Bei wahren Prämissen folgt notwendig eine wahre Konklusion. Wahrheit betrifft den Inhalt einzelner Aussagen. Ein gültiges Argument kann falsche Prämissen haben; ein schlüssiges ist gültig UND hat wahre Prämissen."}, {"track": "allg", "cat": "Antike", "d": 1, "ty": "mc", "q": "Wer gilt als Begründer der abendländischen Ethik und prägte die Methode des kritischen Fragens?", "opts": ["Platon", "Sokrates", "Aristoteles", "Thales"], "c": 1, "fb": "<b>Sokrates</b> stellte das ethische Fragen ins Zentrum und entwickelte die dialogische Methode."}, {"track": "allg", "cat": "Antike", "d": 1, "ty": "mc", "q": "Welche Methode des hartnäckigen Nachfragens ist mit Sokrates verbunden?", "opts": ["Dialektik der Aufklärung", "Mäeutik", "Phänomenologie", "Dekonstruktion"], "c": 1, "fb": "Die <b>Mäeutik</b> ('Hebammenkunst') hilft dem Gesprächspartner, Einsichten selbst zu gebären."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "mc", "q": "Platons Ideenlehre besagt, dass …", "opts": ["nur die Sinnenwelt real ist", "die Ideen das wahre, unveränderliche Sein bilden", "alles aus Atomen besteht", "Wissen unmöglich ist"], "c": 1, "fb": "Für Platon sind die <b>Ideen</b> die wahren, ewigen Urbilder; die Sinnendinge nur ihre Abbilder."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "mc", "q": "In Platons Höhlengleichnis stehen die Schatten an der Wand für …", "opts": ["die Ideen", "die wahre Erkenntnis", "die trügerische Sinnenwelt", "die Sonne des Guten"], "c": 2, "fb": "Die <b>Schatten</b> symbolisieren die täuschende Welt der Sinneserscheinungen."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "mc", "q": "Wofür steht die Sonne in Platons Höhlengleichnis?", "opts": ["Das Schöne", "Die Idee des Guten", "Die Materie", "Die Demokratie"], "c": 1, "fb": "Die <b>Sonne</b> steht für die Idee des Guten, die alles Erkennen ermöglicht."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "mc", "q": "Aristoteles bestimmt die höchste Glückseligkeit (eudaimonia) als …", "opts": ["Lustmaximierung", "Tätigkeit der Seele gemäß der Tugend", "völlige Bedürfnislosigkeit", "Reichtum und Ehre"], "c": 1, "fb": "<b>Eudaimonia</b> ist tugendgemäße Tätigkeit der Seele, vollendet im theoretischen Leben."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "mc", "q": "Die aristotelische Tugend liegt nach der Mesotes-Lehre …", "opts": ["im Übermaß", "im Mangel", "in der Mitte zwischen zwei Extremen", "jenseits aller Maße"], "c": 2, "fb": "Tugend ist nach Aristoteles die <b>Mitte</b> zwischen einem Zuviel und einem Zuwenig."}, {"track": "allg", "cat": "Antike", "d": 1, "ty": "mc", "q": "Welcher Vorsokratiker erklärte das Wasser zum Urgrund (arché) aller Dinge?", "opts": ["Heraklit", "Thales", "Parmenides", "Demokrit"], "c": 1, "fb": "<b>Thales von Milet</b> gilt als erster Philosoph; er bestimmte das Wasser als Urstoff."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "mc", "q": "Heraklit ist bekannt für die These …", "opts": ["'Alles fließt' (panta rhei)", "'Das Sein ist'", "'Der Mensch ist das Maß'", "'Ich denke, also bin ich'"], "c": 0, "fb": "Heraklit betont den steten Wandel: <b>panta rhei</b>."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "mc", "q": "Parmenides vertrat im Gegensatz zu Heraklit, dass …", "opts": ["alles im Fluss ist", "das wahre Sein eines, unveränderlich und unbeweglich ist", "alles aus Atomen besteht", "die Götter alles lenken"], "c": 1, "fb": "<b>Parmenides</b> lehrt, das Sein sei eines und unwandelbar; Veränderung sei Schein."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "mc", "q": "Das oberste Ziel der epikureischen Ethik ist …", "opts": ["die Apatheia", "die Ataraxia (Seelenruhe durch maßvolle Lust)", "die Pflichterfüllung", "der Ruhm"], "c": 1, "fb": "Epikur strebt nach <b>Ataraxia</b>: Seelenruhe durch maßvolle Lust und Schmerzfreiheit."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "mc", "q": "Das Ideal der Stoa ist das Leben …", "opts": ["im Einklang mit der Natur und der Vernunft", "der maximalen Lust", "im Zweifel an allem", "in völliger Untätigkeit"], "c": 0, "fb": "Die <b>Stoa</b> lehrt das tugendhafte Leben gemäß Natur und Vernunft."}, {"track": "allg", "cat": "Antike", "d": 3, "ty": "mc", "q": "Die antiken Skeptiker (z.B. Pyrrhon) strebten durch Urteilsenthaltung (epoché) nach …", "opts": ["Wissen", "Ataraxia (Seelenruhe)", "Macht", "Lust"], "c": 1, "fb": "Durch die <b>epoché</b> wollten die Skeptiker zur Seelenruhe gelangen."}, {"track": "allg", "cat": "Antike", "d": 1, "ty": "tf", "q": "Aristoteles war ein Schüler Platons.", "a": true, "fb": "<b>Aristoteles</b> studierte rund 20 Jahre an Platons Akademie."}, {"track": "allg", "cat": "Antike", "d": 1, "ty": "tf", "q": "Sokrates hat selbst keine philosophischen Schriften hinterlassen.", "a": true, "fb": "Unser Wissen über <b>Sokrates</b> stammt v.a. von Platon und Xenophon."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "tf", "q": "Demokrit vertrat eine atomistische Naturphilosophie.", "a": true, "fb": "<b>Demokrit</b> lehrte, alles bestehe aus unteilbaren Atomen im leeren Raum."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "odd", "q": "Welcher Denker gehört NICHT zu den Vorsokratikern?", "opts": ["Thales", "Heraklit", "Parmenides", "Seneca"], "c": 3, "fb": "<b>Seneca</b> war ein römischer Stoiker der Kaiserzeit, kein Vorsokratiker."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "odd", "q": "Welcher Begriff gehört NICHT zur Stoa?", "opts": ["Logos", "Apatheia", "Ataraxia", "Ideenlehre"], "c": 3, "fb": "Die <b>Ideenlehre</b> stammt von Platon."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "match", "q": "Ordne Philosoph → Kernbegriff zu.", "pairs": [["Platon", "Ideenlehre"], ["Aristoteles", "Goldene Mitte (Mesotes)"], ["Epikur", "Ataraxia durch Lust"], ["Heraklit", "Panta rhei"]], "fb": "Jeder Begriff ist das markanteste Lehrstück des Denkers."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "match", "q": "Ordne Schule → höchstes Ziel zu.", "pairs": [["Stoa", "Leben gemäß der Vernunft"], ["Epikureismus", "Ataraxia durch maßvolle Lust"], ["Skepsis", "Urteilsenthaltung (epoché)"], ["Aristotelismus", "Eudaimonia"]], "fb": "Die antiken Schulen unterscheiden sich v.a. im Ziel des guten Lebens."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "order", "q": "Sortiere die Philosophen chronologisch (früh→spät).", "items": ["Thales", "Sokrates", "Platon", "Aristoteles"], "fb": "Thales (~600 v. Chr.), dann Sokrates, sein Schüler Platon und dessen Schüler Aristoteles."}, {"track": "allg", "cat": "Antike", "d": 3, "ty": "order", "q": "Sortiere chronologisch (früh→spät).", "items": ["Heraklit", "Demokrit", "Epikur", "Marc Aurel"], "fb": "Heraklit (~500 v. Chr.), Demokrit (~460 v. Chr.), Epikur (341 v. Chr.), Marc Aurel (121 n. Chr.)."}, {"track": "allg", "cat": "Antike", "d": 1, "ty": "flip", "front": "Sokrates' Eingeständnis lautet sinngemäß: 'Ich weiß, dass ich … weiß.'", "reveal": "nichts — Das sokratische Nichtwissen ist Ausgangspunkt echter Erkenntnissuche."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "flip", "front": "Platons Schule in Athen hieß … .", "reveal": "Akademie — Platon gründete um 387 v. Chr. die Akademie."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "flip", "front": "Aristoteles lehrte im … (seine Schule in Athen).", "reveal": "Lykeion — Aristoteles lehrte im Lykeion; seine Schule heißt Peripatos."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "flip", "front": "In welchem Jahr wurde Sokrates hingerichtet?", "reveal": "ca. -399 v. Chr. — Sokrates wurde 399 v. Chr. in Athen hingerichtet."}, {"track": "allg", "cat": "Antike", "d": 3, "ty": "flip", "front": "In welchem Jahr starb Aristoteles?", "reveal": "ca. -322 v. Chr. — Aristoteles starb 322 v. Chr."}, {"track": "allg", "cat": "Antike", "d": 3, "ty": "multi", "q": "Welche Aussagen über Platons Politeia treffen zu?", "opts": ["Sie entwirft einen idealen Staat", "Die Philosophen sollen herrschen", "Sie enthält das Höhlengleichnis", "Sie verteidigt die radikale Demokratie", "Sie gliedert die Seele in drei Teile"], "c": [0, 1, 2, 4], "fb": "Die <b>Politeia</b> entwirft den Idealstaat mit Philosophenherrschaft, das Höhlengleichnis und die Dreiteilung der Seele."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "flip", "front": "Was sind die vier antiken Kardinaltugenden?", "reveal": "Weisheit, Tapferkeit, Besonnenheit (Mäßigung) und Gerechtigkeit."}, {"track": "allg", "cat": "Antike", "d": 3, "ty": "recall", "prompt": "Erläutere Aristoteles' Lehre von der Tugend als Mitte mit einem Beispiel.", "hint": "Mut zwischen Feigheit und Tollkühnheit", "model": "Tugend ist die richtige Mitte zwischen Zuviel und Zuwenig bezogen auf die Situation. Beispiel: Tapferkeit liegt zwischen Feigheit (Mangel) und Tollkühnheit (Übermaß). Die Mitte ist nicht arithmetisch, sondern wird von der praktischen Klugheit (phronesis) bestimmt."}, {"track": "allg", "cat": "Mittelalter", "d": 1, "ty": "mc", "q": "Welcher Kirchenvater verband Platonismus mit Christentum und schrieb die 'Bekenntnisse'?", "opts": ["Thomas von Aquin", "Augustinus", "Anselm von Canterbury", "Wilhelm von Ockham"], "c": 1, "fb": "<b>Augustinus</b> (354–430) prägte das frühe Christentum platonisch und schrieb die 'Confessiones'."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "mc", "q": "Thomas von Aquin synthetisierte die christliche Lehre vor allem mit der Philosophie von …", "opts": ["Platon", "Aristoteles", "Epikur", "den Stoikern"], "c": 1, "fb": "<b>Thomas von Aquin</b> verband die christliche Theologie mit <b>Aristoteles</b>."}, {"track": "allg", "cat": "Mittelalter", "d": 2, "ty": "mc", "q": "Anselms 'ontologischer Gottesbeweis' schließt von …", "opts": ["der Bewegung in der Welt", "dem Begriff Gottes als des Größten auf dessen Existenz", "der Ordnung der Natur", "dem moralischen Gesetz"], "c": 1, "fb": "Anselm folgert aus dem <b>Begriff</b> Gottes seine Existenz."}, {"track": " mmt", "reine Vernunft ist", "göttlich offenbart wird"], "c": 1, "fb": "Der <b>Empirismus</b> (Locke, Berkeley, Hume) leitet alles Wissen aus der <b>Erfahrung</b> ab."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "mc", "q": "Lockes Bild des Geistes bei Geburt ist das einer …", "opts": ["fertigen Vernunft", "tabula rasa (unbeschriebenen Tafel)", "göttlichen Idee", "Maschine"], "c": 1, "fb": "Locke beschreibt den Geist als <b>tabula rasa</b>, die erst durch Erfahrung beschrieben wird."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 3, "ty": "mc", "q": "Berkeleys Idealismus fasst sich in der Formel …", "opts": ["cogito ergo sum", "esse est percipi (Sein heißt Wahrgenommenwerden)", "panta rhei", "ceteris paribus"], "c": 1, "fb": "Für Berkeley gilt <b>esse est percipi</b>: Dinge existieren nur als Wahrgenommenes."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 3, "ty": "mc", "q": "Hume bestreitet, dass wir Kausalität …", "opts": ["überhaupt wahrnehmen", "als notwendige Verknüpfung in der Welt erkennen können", "gebrauchen dürfen", "durch Vernunft erschließen"], "c": 1, "fb": "Hume: Wir beobachten nur regelmäßige Aufeinanderfolge; die <b>notwendige</b> Verknüpfung ist Gewohnheit."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 3, "ty": "mc", "q": "Spinozas Metaphysik ist berühmt für die Gleichsetzung …", "opts": ["von Körper und Maschine", "von Gott und Natur (deus sive natura)", "von Geist und Materie", "von Lust und Glück"], "c": 1, "fb": "Spinozas <b>deus sive natura</b> identifiziert Gott mit der einen Substanz Natur."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 3, "ty": "mc", "q": "Leibniz nennt die letzten, einfachen, fensterlosen Substanzen …", "opts": ["Atome", "Monaden", "Ideen", "Qualia"], "c": 1, "fb": "Die <b>Monaden</b> sind bei Leibniz die einfachen Grundsubstanzen in prästabilierter Harmonie."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "tf", " hanismus, der dezentrales Wissen koordiniert."}, {"track": "quellen", "cat": "Hayek", "d": 2, "ty": "tf", "q": "Hayek erhielt 1974 den Wirtschaftsnobelpreis.", "a": true, "fb": "<b>F. A. Hayek</b> wurde 1974 ausgezeichnet."}, {"track": "quellen", "cat": "Hayek", "d": 3, "ty": "flip", "front": "Hayeks bekannte Schrift gegen die Planwirtschaft heißt 'Der Weg zur …'.", "reveal": "Knechtschaft — Der Weg zur Knechtschaft warnt vor totalitären Folgen zentraler Planung."}, {"track": "quellen", "cat": "Hayek", "d": 2, "ty": "flip", "front": "Was meint Hayek mit dem 'Wissensproblem'?", "reveal": "Das für eine Wirtschaft nötige Wissen ist über unzählige Individuen verstreut, oft lokal und unausgesprochen. Keine zentrale Stelle kann es vollständig sammeln; der Markt koordiniert es über Preise dezentral."}, {"track": "quellen", "cat": "Wittgenstein", "d": 2, "ty": "mc", "q": "Wittgensteins zwei Hauptwerke sind …", "opts": ["Tractatus und Philosophische Untersuchungen", "Sein und Zeit und Was ist Metaphysik", "Die beiden Kritiken", "Wille und Vorstellung"], "c": 0, "fb": "Der frühe <b>Tractatus</b> und die späten <b>Philosophischen Untersuchungen</b>."}, {"track": "quellen", "cat": "Wittgenstein", "d": 3, "ty": "mc", "q": "Mit dem 'Privatsprachenargument' bestreitet der späte Wittgenstein, dass …", "opts": ["Sprache öffentlich ist", "es eine nur dem Einzelnen zugängliche, private Sprache geben kann", "Wörter Bedeutung haben", "Grammatik existiert"], "c": 1, "fb": "Eine rein private, unüberprüfbare Sprache wäre unmöglich; Bedeutung ist an öffentliche Regeln gebunden."}, {"track": "quellen", "cat": "Wittgenstein", "d": 2, "ty": "tf", "q": "Der frühe Wittgenstein vertrat eine 'Abbildtheorie' der Sprache.", "a": true, "fb": "Im <b>Tractatus</b> bilden Sätze mögliche Sachverhalte der Welt ab."}, {"track": "quellen", "cat": "Wittgenstein", "d": 3, "ty": "flip", "front": "Der Spätwittgenstein erklärt Bedeutung durch den … eines Wortes.", "reveal": "Gebrauch — 'Die Bedeutung eines Worte lip", "front": "Was unterscheidet 'bridging' von 'bonding' social capital?", "reveal": "Bonding (bindend) verknüpft Menschen innerhalb homogener Gruppen (Familie, enge Cliquen). Bridging (überbrückend) verbindet über Gruppengrenzen hinweg und fördert breiteren gesellschaftlichen Zusammenhalt."}, {"track": "quellen", "cat": "Veblen", "d": 2, "ty": "mc", "q": "Thorstein Veblen prägte den Begriff des 'demonstrativen Konsums', der …", "opts": ["sparsames Verhalten beschreibt", "Konsum zur Zurschaustellung von Status meint", "reinen Grundbedarf meint", "staatlichen Konsum meint"], "c": 1, "fb": "<b>Demonstrativer Konsum</b>: Güter werden gekauft, um Reichtum und Status sichtbar vorzuführen."}, {"track": "quellen", "cat": "Veblen", "d": 2, "ty": "tf", "q": "Veblens Analyse stammt aus 'Die Theorie der feinen Leute'.", "a": true, "fb": "In <b>Die Theorie der feinen Leute</b> (1899) entwickelt Veblen Geltungskonsum und müßige Klasse."}, {"track": "quellen", "cat": "Veblen", "d": 2, "ty": "flip", "front": "Was ist ein 'Veblen-Gut'?", "reveal": "Ein Gut, dessen Nachfrage steigt, wenn der Preis steigt, weil der hohe Preis selbst als Statussymbol wirkt — entgegen dem üblichen Nachfragegesetz."}, {"track": "quellen", "cat": "Byung-Chul Han", "d": 2, "ty": "mc", "q": "Byung-Chul Han charakterisiert die Gegenwart in 'Müdigkeitsgesellschaft' als Gesellschaft der …", "opts": ["Disziplinierung durch Verbote", "Selbstausbeutung durch das Leistungssubjekt", "totalen Überwachung", "klassenlosen Gleichheit"], "c": 1, "fb": "Han sieht das <b>Leistungssubjekt</b>, das sich freiwillig selbst ausbeutet."}, {"track": "quellen", "cat": "Byung-Chul Han", "d": 3, "ty": "tf", "q": "Han meint, an die Stelle von Fremdzwang sei zunehmend Selbstzwang getreten.", "a": true, "fb": "Han kontrastiert die <b>Disziplinargesellschaft</b> mit der heutigen <b>Leistungsgesellschaft</b> der Selbstoptimierung."}, {"track": "quellen", "cat": "Byung-Chul Han", "d": 3, "ty": "flip", "front": "Worin sieht Han den Unt innt durch Schocks und Volatilität hinzu."}, {"track": "vertieft", "cat": "Nassim Taleb", "d": 3, "ty": "tf", "q": "Talebs 'Via negativa' empfiehlt, Robustheit eher durch Weglassen von Schädlichem als durch Hinzufügen zu erreichen.", "a": true, "fb": "Die <b>Via negativa</b> setzt auf Subtraktion (Risiken entfernen) statt auf Hinzufügen von Komplexität."}, {"track": "vertieft", "cat": "Nassim Taleb", "d": 3, "ty": "recall", "prompt": "Erläutere, warum Taleb Prognosen in 'Extremistan' für besonders unzuverlässig hält.", "hint": "Fat tails, seltene Events", "model": "In Extremistan dominieren seltene, extreme Ereignisse das Gesamtbild ('fat tails'). Standardmodelle wie die Normalverteilung unterschätzen deren Wahrscheinlichkeit und Wirkung systematisch. Da gerade die folgenreichsten Ereignisse selten und neuartig sind, lassen sie sich aus vergangenen Daten kaum vorhersagen."}, {"track": "vertieft", "cat": "Stoa", "d": 3, "ty": "mc", "q": "Die stoische Lehre der 'Oikeiosis' beschreibt …", "opts": ["die Ablehnung aller Gefühle", "die natürliche Zuwendung, die sich vom Selbst auf andere ausweitet", "die Urteilsenthaltung", "das Lustkalkül"], "c": 1, "fb": "<b>Oikeiosis</b> ist die natürliche Selbstzuwendung, die sich zur Sorge um andere und die Menschheit weitet."}, {"track": "vertieft", "cat": "Stoa", "d": 3, "ty": "mc", "q": "In der stoischen Werttheorie sind Gesundheit oder Reichtum keine echten Güter, sondern …", "opts": ["Übel", "Adiaphora / 'Vorzuziehendes'", "Tugenden", "Affekte"], "c": 1, "fb": "Solche Dinge sind <b>indifferent (adiaphora)</b>, aber 'vorzuziehen'; nur die Tugend ist ein echtes Gut."}, {"track": "vertieft", "cat": "Stoa", "d": 3, "ty": "tf", "q": "Für die Stoa ist allein die Tugend gut und allein das Laster schlecht; alles andere ist im strengen Sinn indifferent.", "a": true, "fb": "Dieser <b>Tugendrigorismus</b> erklärt, warum Äußeres die Glückseligkeit nicht antasten kann."}, {"track": "vertieft", "cat": "Viktor Frankl", "d": 3, "ty": "mc", "q": "Frankl unterscheidet drei Wege, Sinn zu finden; welcher gehört NICHT dazu?", "opts": ["schöpferische Werte (Tun/Schaffen)", "Erlebniswerte (Erleben/Lieben)", "Einstellungswerte (Haltung zum Leid)", "Konsumwerte (Besitz)"], "c": 3, "fb": "Frankls drei Wertkategorien sind schöpferische, Erlebnis- und Einstellungswerte."}, {"track": "vertieft", "cat": "Viktor Frankl", "d": 3, "ty": "flip", "front": "Was ist nach Frankl das 'existenzielle Vakuum'?", "reveal": "Ein verbreitetes Gefühl innerer Leere und Sinnlosigkeit in der modernen Gesellschaft, das entsteht, wenn weder Instinkte noch Traditionen das Handeln leiten und der Mensch keinen tragenden Sinn findet."}, {"track": "vertieft", "cat": "J. S. Mill", "d": 3, "ty": "mc", "q": "Mill modifiziert Benthams Utilitarismus entscheidend durch …", "opts": ["Ablehnung des Nutzenprinzips", "die qualitative Unterscheidung höherer und niederer Freuden", "den kategorischen Imperativ", "die Verwerfung der Freiheit"], "c": 1, "fb": "Mill: 'Lieber ein unzufriedener Sokrates als ein zufriedenes Schwein' — geistige Freuden sind höherwertig."}, {"track": "vertieft", "cat": "J. S. Mill", "d": 3, "ty": "tf", "q": "Mills Diktum lautet sinngemäß: Lieber ein unzufriedener Mensch als ein zufriedenes Schwein.", "a": true, "fb": "Mill verteidigt damit die <b>qualitative</b> Höherwertigkeit geistiger Freuden."}, {"track": "vertieft", "cat": "Michael Sandel", "d": 3, "ty": "recall", "prompt": "Welche Alternativen zur reinen Meritokratie deutet Sandel an?", "hint": "Demut, Los, Gemeinwohl", "model": "Sandel plädiert für mehr Demut gegenüber der Rolle von Glück und Gemeinschaft beim eigenen Erfolg, für eine Aufwertung der Würde der Arbeit jenseits akademischer Bildung und diskutiert sogar ein Losverfahren bei Eliteuni-Zulassungen, um den meritokratischen Hochmut zu dämpfen."}, {"track": "vertieft", "cat": "Epikur", "d": 3, "ty": "mc", "q": "Epikurs 'Tetrapharmakon' (Vierfaches Heilmittel) beginnt klassisch mit dem Satz: …", "opts": ["'Den Tod fürc Imperative gelten unter Zwecken; der <b>kategorische</b> gilt unbedingt."}, {"track": "vertieft", "cat": "Hegel", "d": 3, "ty": "mc", "q": "Hegels Begriff der 'Aufhebung' vereint drei Bedeutungen; welche gehört NICHT dazu?", "opts": ["negieren/beseitigen", "bewahren", "emporheben", "beschleunigen"], "c": 3, "fb": "Hegels <b>Aufheben</b> meint zugleich negieren, bewahren und auf eine höhere Stufe heben."}, {"track": "vertieft", "cat": "Hegel", "d": 3, "ty": "tf", "q": "In Hegels 'Herr-Knecht-Dialektik' gewinnt am Ende paradoxerweise der Knecht durch seine Arbeit ein höheres Selbstbewusstsein.", "a": true, "fb": "Durch die formende <b>Arbeit</b> gewinnt der Knecht Selbstständigkeit, während der Herr abhängig wird."}, {"track": "vertieft", "cat": "Nietzsche", "d": 3, "ty": "recall", "prompt": "Erläutere Nietzsches Gedanken der 'ewigen Wiederkunft des Gleichen' als Prüfstein.", "hint": "amor fati, Lebensbejahung", "model": "Die ewige Wiederkunft ist ein Gedankenexperiment: Würdest du dein Leben in allen Einzelheiten unendlich oft genau so wiederleben wollen? Wer das bejahen kann, lebt aus voller Lebensbejahung (amor fati). Der Gedanke dient als existenzieller Prüfstein der Daseinsbejahung ohne Jenseitströstung."}, {"track": "vertieft", "cat": "Camus", "d": 3, "ty": "mc", "q": "Warum nennt Camus Sisyphos am Ende 'glücklich'?", "opts": ["weil er den Felsen oben hält", "weil er sein absurdes Schicksal hellsichtig annimmt und im Aufstieg Sinn schafft", "weil die Götter ihn begnadigen", "weil er die Arbeit beendet"], "c": 1, "fb": "Im bewussten Annehmen des absurden Loses findet Sisyphos eine trotzige Erfüllung — 'Wir müssen uns Sisyphos als glücklichen Menschen vorstellen.'"}, {"track": "vertieft", "cat": "Camus", "d": 3, "ty": "tf", "q": "Camus hält den Selbstmord für die richtige Antwort auf das Absurde.", "a": false, "fb": "Camus <b>lehnt</b> Selbstmord wie auch den religiösen 'Sprung' ab; er empfiehlt die hellsichtige Revolte."}, {"track": "vertieft", "cat": "Kant", "d" "track": "vertieft", "cat": "Descartes", "d": 3, "ty": "recall", "prompt": "Erkläre, wie Descartes vom Zweifel zum 'Cogito' gelangt.", "hint": "Was bleibt beim Zweifeln übrig?", "model": "Descartes bezweifelt methodisch alles Bezweifelbare: Sinne täuschen, Träume sind möglich, ein 'böser Geist' könnte ihn systematisch täuschen. Doch selbst dann muss es ein Ich geben, das getäuscht wird bzw. zweifelt. Das Zweifeln ist ein Denken, und Denken setzt einen Denkenden voraus – daher: 'Ich denke, also bin ich.'"}, {"track": "vertieft", "cat": "Hume", "d": 2, "ty": "mc", "q": "Wie erklärt Hume unsere Vorstellung von Kausalität (Ursache–Wirkung)?", "opts": ["Als angeborene Idee", "Als beobachtbare notwendige Verknüpfung", "Als Gewohnheit aus wiederholter Erfahrung", "Als göttliche Eingebung"], "c": 2, "fb": "Wir sehen nur regelmäßige Abfolge; die 'Notwendigkeit' ist eine Gewohnheit der Erwartung."}, {"track": "vertieft", "cat": "Hume", "d": 3, "ty": "mc", "q": "Humes 'Gesetz' besagt, dass man nicht ohne Weiteres schließen darf von …", "opts": ["Ursache auf Wirkung", "Sein auf Sollen", "Teil auf Ganzes", "Wirkung auf Ursache"], "c": 1, "fb": "Aus rein deskriptiven Prämissen (Sein) folgt keine normative Konklusion (Sollen)."}, {"track": "vertieft", "cat": "Hume", "d": 2, "ty": "tf", "q": "Nach Hume stammen alle Vorstellungen letztlich aus vorausgehenden Sinneseindrücken.", "a": true, "fb": "Vorstellungen sind blassere Kopien lebhafter Eindrücke (impressions)."}, {"track": "vertieft", "cat": "Hume", "d": 2, "ty": "flip", "front": "Das Problem, dass sich allgemeine Gesetze nicht sicher aus Einzelfällen ableiten lassen, heißt … .", "reveal": "Induktionsproblem — von noch so vielen Beobachtungen folgt kein logisch zwingendes allgemeines Gesetz."}, {"track": "vertieft", "cat": "Hume", "d": 2, "ty": "tf", "q": "Hume weckte nach eigener Aussage Kant aus dem 'dogmatischen Schlummer'.", "a": true, "fb": "Kant nennt Hume ausdrücklich als Anstoß für seine kritische Philosophie."}, {"track": "vertieft", "cat": "Locke", "d": 1, "ty": "mc", "q": "Wofür steht Lockes Bild der 'tabula rasa'?", "opts": ["Der Geist als unbeschriebenes Blatt bei Geburt", "Ein angeborener Ideenschatz", "Der absolute Staat", "Die beste aller Welten"], "c": 0, "fb": "Alles Wissen stammt für Locke aus Erfahrung – der Geist ist anfangs 'leer'."}, {"track": "vertieft", "cat": "Locke", "d": 2, "ty": "multi", "q": "Welche Rechte zählt Locke zu den natürlichen Rechten des Menschen?", "opts": ["Leben", "Freiheit", "Eigentum", "Gehorsam gegenüber dem König", "Gleichheit des Einkommens"], "c": [0, 1, 2], "fb": "Leben, Freiheit und Eigentum sind Lockes klassische Naturrechte."}, {"track": "vertieft", "cat": "Locke", "d": 2, "ty": "tf", "q": "Locke gilt als einer der Begründer des politischen Liberalismus.", "a": true, "fb": "Naturrechte, Gesellschaftsvertrag und Gewaltenteilung prägen den Liberalismus."}, {"track": "vertieft", "cat": "Locke", "d": 2, "ty": "flip", "front": "Bei einer Regierung, die die Naturrechte verletzt, besteht laut Locke ein … .", "reveal": "Widerstandsrecht — das Volk darf eine Regierung absetzen, die den Zweck des Vertrags (Schutz der Rechte) verfehlt."}, {"track": "vertieft", "cat": "Hobbes", "d": 1, "ty": "mc", "q": "Wie beschreibt Hobbes den Naturzustand ohne Staat?", "opts": ["Als paradiesische Harmonie", "Als Krieg aller gegen alle", "Als Herrschaft der Weisen", "Als klassenlose Gesellschaft"], "c": 1, "fb": "'Bellum omnium contra omnes' – aus Furcht schließt man den Gesellschaftsvertrag."}, {"track": "vertieft", "cat": "Hobbes", "d": 1, "ty": "flip", "front": "Hobbes' Hauptwerk über Staat und Souveränität heißt … .", "reveal": "Leviathan (1651) — benannt nach dem biblischen Seeungeheuer als Bild des mächtigen Staates."}, {"track": "vertieft", "cat": "Hobbes", "d": 2, "ty": "tf", "q": "Bei Hobbes übertragen die Menschen ihre Macht an einen starken Souverän, um Sicherheit zu erhalten.", "a": true, "fb": "Der Souverän garantiert Frieden; dafür geben die Bürger n Naturordnung."}, {"track": "vertieft", "cat": "Spinoza", "d": 2, "ty": "mc", "q": "Was meint Spinozas Formel 'Deus sive Natura'?", "opts": ["Gott straft die Natur", "Gott und Natur sind ein und dasselbe", "Die Natur ist gottlos", "Gott steht über der Natur"], "c": 1, "fb": "Spinozas Pantheismus: eine einzige Substanz, Gott = Natur."}, {"track": "vertieft", "cat": "Spinoza", "d": 2, "ty": "tf", "q": "Für Spinoza wächst Freiheit mit der Einsicht in die notwendigen Zusammenhänge der Natur.", "a": true, "fb": "Freiheit ist nicht Willkür, sondern vernünftige Einsicht in die Notwendigkeit."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 3, "ty": "mc", "q": "Welcher Empirist vertrat den Idealismus 'esse est percipi' (Sein ist Wahrgenommenwerden)?", "opts": ["John Locke", "George Berkeley", "David Hume", "Francis Bacon"], "c": 1, "fb": "Berkeley bestreitet eine vom Wahrnehmen unabhängige materielle Welt."}, {"track": "allg", "cat": "Rationalismus & Empirismus", "d": 2, "ty": "tf", "q": "Pascals 'Wette' argumentiert, es sei rational vorteilhafter, auf die Existenz Gottes zu setzen.", "a": true, "fb": "Ein entscheidungstheoretisches Argument angesichts unendlichen Gewinns."}, {"track": "vertieft", "cat": "Camus", "d": 2, "ty": "mc", "q": "Womit vergleicht Camus die menschliche Existenz im 'Mythos des Sisyphos'?", "opts": ["Mit einem Fluss", "Mit dem sinnlos wiederholten Steinrollen des Sisyphos", "Mit einer Maschine", "Mit einem Traum"], "c": 1, "fb": "Das Absurde entsteht aus dem Zusammenstoß von Sinnverlangen und stummer Welt."}, {"track": "vertieft", "cat": "Camus", "d": 2, "ty": "tf", "q": "Camus empfiehlt gegen das Absurde nicht den Selbstmord, sondern die trotzige Bejahung des Lebens (Revolte).", "a": true, "fb": "'Wir müssen uns Sisyphos als einen glücklichen Menschen vorstellen.'"}, {"track": "vertieft", "cat": "Hegel", "d": 2, "ty": "mc", "q": "Wie heißt Hegels Denkbewegung von These und Gegensatz zu einer höheren Einheit?", "opts": ["Falsifikation", il", "Keinem Seelenteil"], "c": 1, "fb": "Der <b>muthafte Seelenteil</b> entspricht den Wächtern; Vernunft den Philosophenherrschern, Begehren dem Nährstand."}, {"track": "allg", "cat": "Antike", "d": 1, "ty": "mc", "q": "Von wem stammt die Bestimmung des Menschen als „zoon politikon“ (von Natur aus politisches Lebewesen)?", "opts": ["Platon", "Aristoteles", "Protagoras", "Epikur"], "c": 1, "fb": "In der „Politik“ bestimmt <b>Aristoteles</b> den Menschen als von Natur aus auf die Polis-Gemeinschaft angelegt."}, {"track": "allg", "cat": "Antike", "d": 1, "ty": "mc", "q": "Wessen wurde Sokrates in seinem Prozess angeklagt?", "opts": ["Diebstahl und Betrug", "Gottlosigkeit und Verführung der Jugend", "Hochverrat an Sparta", "Steuerhinterziehung"], "c": 1, "fb": "Die Anklage lautete auf <b>Asebie</b> (Missachtung der Staatsgötter, Einführung neuer Götter) und Verderben der Jugend."}, {"track": "allg", "cat": "Antike", "d": 3, "ty": "mc", "q": "Welches ist das höchste Prinzip in Plotins Neuplatonismus?", "opts": ["Die Materie", "Das Eine (to hen)", "Der Weltgeist Hegels", "Das Atom"], "c": 1, "fb": "Bei <b>Plotin</b> geht alles durch Emanation aus dem überseienden <b>Einen</b> hervor: Geist, Seele, Materie."}, {"track": "allg", "cat": "Antike", "d": 1, "ty": "tf", "q": "Epikur lehrte ein Leben hemmungsloser Ausschweifung und maßloser Genüsse.", "a": false, "fb": "Epikurs <b>Hedonismus</b> zielt auf maßvolle Lust, Schmerzfreiheit und Seelenruhe – nicht auf Ausschweifung."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "tf", "q": "Zenon von Elea wollte mit seinen Paradoxien (z.B. Achilles und die Schildkröte) die Lehre des Parmenides stützen.", "a": true, "fb": "Zenons <b>Paradoxien</b> sollten zeigen, dass Bewegung und Vielheit auf Widersprüche führen – zugunsten des einen Seins."}, {"track": "allg", "cat": "Antike", "d": 2, "ty": "tf", "q": "Der Stoiker Epiktet war ursprünglich ein Sklave.", "a": true, "fb": "<b>Epiktet</b> kam als Sklave nach Rom, wurde freigelassen
